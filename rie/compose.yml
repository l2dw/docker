networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-rie-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  appdata:
    name: ${APPDATA_VOLUME_NAME:-appdata}
    external: ${APPDATA_VOLUME_EXTERNAL:-false}
    driver: ${APPDATA_VOLUME_DRIVER:-local}
    # Empty type/o/device = normal Docker named volume. Set for bind or NFS — see README.
    driver_opts:
      type: ${APPDATA_VOLUME_DRIVER_TYPE:-}
      o: ${APPDATA_VOLUME_DRIVER_O:-}
      device: ${APPDATA_VOLUME_DRIVER_DEVICE:-}

services:

  app:
    image: ${IMAGE:-atelier.cen.umontreal.ca/rie/rie:latest}
    networks:
      default:
        aliases:
          - ${APP_NAME:-rie}
    volumes:
      - ${APPDATA_HOST_PATH:-appdata}:${APPDATA_CONTAINER_PATH:-/appdata}:z
    env_file:
      - ${ENV_FILE:-.env.example}
    # Critical vars for the app entrypoint (fullstack.entrypoint.sh).
    # `environment:` overrides `env_file:`. Docker Compose unquotes these on
    # interpolation, so Dokploy's quoted `env_file` values ("true") cannot
    # break the strict `[ "$VAR" = "true" ]` checks in the entrypoint, and
    # quoted pass/url/host values cannot corrupt PG_DATABASE_URL construction.
    environment:
      ENABLE_SERVICE_API: ${ENABLE_SERVICE_API:-true}
      ENABLE_SERVICE_WEB_APP: ${ENABLE_SERVICE_WEB_APP:-true}
      API_PORT: ${API_PORT:-4000}
      CLIENT_PORT: ${CLIENT_PORT:-3000}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      NODE_ENV: ${NODE_ENV:-production}
      # Database (unquoted so PG_DATABASE_URL builds correctly)
      PG_DATABASE_NAME: ${PG_DATABASE_NAME:-}
      PG_DATABASE_USER: ${PG_DATABASE_USER:-}
      PG_DATABASE_PASSWORD: ${PG_DATABASE_PASSWORD:-}
      PG_DATABASE_HOST: ${PG_DATABASE_HOST:-}
      PG_DATABASE_PORT: ${PG_DATABASE_PORT:-5432}
      # OpenTelemetry / Auth
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RIE_AUTH_CLIENT_ID: ${RIE_AUTH_CLIENT_ID:-}
      RIE_AUTH_CLIENT_SECRET: ${RIE_AUTH_CLIENT_SECRET:-}
    ports:
      - target: ${APP_PORT:-3000}
        published: ${PUBLISHED_PORT:-30000}
        protocol: tcp
    deploy:
      mode: ${DEPLOY_MODE:-replicated}
      replicas: ${DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${RESTART_POLICY_CONDITION:-any}
        delay: ${RESTART_POLICY_DELAY:-5s}
        max_attempts: ${RESTART_POLICY_MAX_ATTEMPTS:-3}
