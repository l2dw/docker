
networks:
  default:
    name: ${DEFAULT_NETWORK:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  rie_postgresql_data:
    name: ${RIE_POSTGRESQL_DATA_VOLUME_NAME:-rie_postgresql_data}
    external: ${RIE_POSTGRESQL_DATA_VOLUME_EXTERNAL:-false}

  rie_data:
    name: ${RIE_DATA_VOLUME_NAME:-rie_data}
    external: ${RIE_DATA_VOLUME_EXTERNAL:-false}

services:

  rie-postgresql:
    image: ${RIE_POSTGRESQL_IMAGE:-docker.io/postgres:15}
    command: ["postgres", "-c", "listen_addresses=*"]
    # container_name: rie-${RIE_ENV_NAME}--postgresql
    pull_policy: ${RIE_PULL_POLICY:-always}
    restart: ${RIE_RESTART:-unless-stopped}
    privileged: ${RIE_PRIVILEGED:-false}
    # tty: ${RIE_TTY:-true}
    # stdin_open: ${RIE_STDIN_OPEN:-true}
    networks:
      default:
        aliases:
          - ${RIE_POSTGRESQL_NETWORK_ALIAS:-rie-postgresql}
    environment:
      - TZ=America/Toronto
      - POSTGRES_USER=${RIE_DATABASE_USER:-rie}
      - POSTGRES_PASSWORD=${RIE_DATABASE_PASSWORD:-rie123}
      - POSTGRES_DB=${RIE_DATABASE_NAME:-rie}
    volumes:
      - ${RIE_POSTGRESQL_MOUNT_DATA:-rie_postgresql_data}:/var/lib/postgresql/data
      - ${RIE_MOUNT_DATA:-rie_data}:/app/data

  rie-app:
    image: ${RIE_IMAGE:-atelier.cen.umontreal.ca/rie/rie-fullstack:latest}
    # container_name: rie-${RIE_ENV_NAME}--fullstack
    pull_policy: ${RIE_PULL_POLICY:-always}
    restart: ${RIE_RESTART:-unless-stopped}
    privileged: ${RIE_PRIVILEGED:-false}
    # tty: ${RIE_TTY:-true}
    # stdin_open: ${RIE_STDIN_OPEN:-true}
    # networks:
    #   default:
    #     aliases:
    #       - rie-${RIE_ENV_NAME}--backend
    #       - rie-${RIE_ENV_NAME}--frontend
    volumes:
      - ${RIE_MOUNT_DATA:-rie_data}:/app/data
    mem_limit: ${RIE_MEMORY_LIMIT:-512M}
    networks:
      default:
        aliases:
          - ${RIE_BACKEND_HOST:-rie-backend-host}
    environment:
      - TZ
      - http_proxy
      - https_proxy
      - no_proxy
      - ENABLE_SERVICE_WEB_APP=${RIE_ENABLE_SERVICE_WEB_APP:-true}
      - ENABLE_SERVICE_API=${RIE_ENABLE_SERVICE_API:-true}
      # Database configuration
      - PG_DATABASE_NAME=${RIE_DATABASE_NAME:-rie}
      - PG_DATABASE_USER=${RIE_DATABASE_USER:-rie}
      - PG_DATABASE_PASSWORD=${RIE_DATABASE_PASSWORD:-rie123}
      - PG_DATABASE_HOST=${RIE_POSTGRESQL_HOST:-rie-postgresql}
      - PG_DATABASE_PORT=${RIE_POSTGRESQL_PORT:-5432}
      # API configuration
      - API_BASE_PATH=${RIE_API_BASE_PATH:-/api}
      - API_PORT=${RIE_API_PORT:-4000}
      - RIE_API_DOMAIN=${RIE_API_DOMAIN:-rie.example.com}
      - RIE_API_URL=${RIE_API_URL:-http://rie.example.com/api}
      # Authentication
      - MICROSOFT_TENANT_ID=${RIE_MICROSOFT_TENANT_ID:-your-microsoft-tenant-id}
      - MICROSOFT_CLIENT_ID=${RIE_MICROSOFT_CLIENT_ID:-your-microsoft-client-id}
      - MICROSOFT_CLIENT_SECRET=${RIE_MICROSOFT_CLIENT_SECRET:-your-microsoft-client-secret}
      - BETTER_AUTH_SECRET=${RIE_BETTER_AUTH_SECRET:-your-better-auth-secret--long-32}
      # OpenTelemetry
      - LOG_LEVEL=${RIE_LOG_LEVEL:-info}
      - OTEL_SERVICE_NAME_API=rie-${RIE_ENV_NAME}--api
      - OTEL_SERVICE_NAME_CLIENT=rie-${RIE_ENV_NAME}--client
      - OTEL_API_ENABLED=${RIE_OTEL_API_ENABLED:-true}
      - OTEL_CLIENT_ENABLED=${RIE_OTEL_CLIENT_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${RIE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      # S3 Storage client
      - S3_ENDPOINT=${RIE_S3_ENDPOINT:-https://s3.example.com}
      - S3_ACCESS_KEY=${RIE_S3_ACCESS_KEY:-your-s3-access-key}
      - S3_SECRET_KEY=${RIE_S3_SECRET_KEY:-your-s3-secret-key}
      - S3_PROVIDER=${RIE_S3_PROVIDER:-minio}
      - S3_USE_SSL=${RIE_S3_USE_SSL:-true}
      - S3_REGION=${RIE_S3_REGION:-your-s3-region}
      - S3_BUCKET=${RIE_S3_BUCKET:-rie-storage}
      # Client configuration
      - RIE_CLIENT_DOMAIN=${RIE_CLIENT_DOMAIN:-rie.example.com}
      - RIE_CLIENT_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/}
      - CLIENT_DOMAIN=${RIE_CLIENT_DOMAIN:-rie.example.com}
      - CLIENT_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/}
      - CLIENT_ORIGIN_URL=${RIE_CLIENT_ORIGIN_URL:-http://rie.example.com/}
      - CLIENT_PORT=${RIE_CLIENT_PORT:-3000}
      - NEXT_PUBLIC_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/}
      - NEXT_PUBLIC_API_FULL_URL=${RIE_API_URL:-http://rie.example.com/api}
    labels:
      - "traefik.enable=${RIE_TRAEFIK_ENABLE:-true}"
      - "traefik.http.services.rie-${RIE_ENV_NAME}--backend.loadbalancer.server.port=4000"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.entrypoints=${RIE_TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.rule=Host(`${RIE_API_DOMAIN:-rie.example.com}`) && PathPrefix(`${RIE_API_BASE_PATH:-/api}`)"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.service=rie-${RIE_ENV_NAME}--backend"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.middlewares=${RIE_TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.tls=${RIE_TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--backend.tls.certresolver=${RIE_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      # ## Web App configuration
      - "traefik.http.services.rie-${RIE_ENV_NAME}--frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.entrypoints=${RIE_TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.rule=Host(`${RIE_CLIENT_DOMAIN:-rie.example.com}`) && PathPrefix(`${RIE_CLIENT_BASE_PATH:-/}`)"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.service=rie-${RIE_ENV_NAME}--frontend"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.middlewares=${RIE_TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.tls=${RIE_TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.http.routers.rie-${RIE_ENV_NAME}--frontend.tls.certresolver=${RIE_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      ## Homepage configuration
      - "homepage.enabled=${RIE_HOMEPAGE_ENABLED:-true}"
      - "homepage.group=${RIE_HOMEPAGE_GROUP:-RIÉ}"
      - "homepage.name=${RIE_HOMEPAGE_NAME:-RIÉ API}"
      - "homepage.icon=${RIE_HOMEPAGE_ICON:-}"
      - "homepage.href=${RIE_HOMEPAGE_HREF:-http://rie.example.com/api}"
      - "homepage.description=${RIE_HOMEPAGE_DESCRIPTION:-}"
      - "homepage.siteMonitor=${RIE_HOMEPAGE_SITEMONITOR:-http://rie.example.com/api/version}"
      - "homepage.ping=${RIE_HOMEPAGE_PING:-http://rie-backend:4000}"
      # ## Homepage configuration
      # - "homepage.group=${RIE_HOMEPAGE_FRONTEND_GROUP:-RIÉ}"
      # - "homepage.name=${RIE_HOMEPAGE_FRONTEND_NAME:-RIÉ Web App}"
      # - "homepage.icon=${RIE_HOMEPAGE_FRONTEND_ICON:-}"
      # - "homepage.href=${RIE_HOMEPAGE_FRONTEND_HREF:-http://rie.example.com/}"
      # - "homepage.description=${RIE_HOMEPAGE_FRONTEND_DESCRIPTION:-}"
      # - "homepage.siteMonitor=${RIE_HOMEPAGE_FRONTEND_SITEMONITOR:-http://rie.example.com/fr}"
      # - "homepage.ping=${RIE_HOMEPAGE_FRONTEND_PING:-http://rie-frontend:3000}"


  rie-workspace:
    image: ${RIE_WORKSPACE_IMAGE:-atelier.cen.umontreal.ca/rie/rie-fullstack:workspace}
    pull_policy: ${RIE_PULL_POLICY:-always}
    restart: ${RIE_RESTART:-unless-stopped}
    privileged: ${RIE_PRIVILEGED:-false}
    tty: ${RIE_TTY:-true}
    stdin_open: ${RIE_STDIN_OPEN:-true}
    volumes:
      - ${RIE_MOUNT_DATA:-rie_data}:/app/data
    mem_limit: 1G
    networks:
      default:
        aliases:
          - ${RIE_BACKEND_HOST:-rie-backend-host}
    environment:
      - TZ
      - http_proxy
      - https_proxy
      - no_proxy
      - ENABLE_SERVICE_WEB_APP=false
      - ENABLE_SERVICE_API=false
      # Database configuration
      - PG_DATABASE_NAME=${RIE_DATABASE_NAME:-rie}
      - PG_DATABASE_USER=${RIE_DATABASE_USER:-rie}
      - PG_DATABASE_PASSWORD=${RIE_DATABASE_PASSWORD:-rie123}
      - PG_DATABASE_HOST=${RIE_DATABASE_HOST:-rie-postgresql}
      - PG_DATABASE_PORT=${RIE_DATABASE_PORT:-5432}
      # API configuration
      - API_BASE_PATH=${RIE_API_BASE_PATH:-/workspace/api}
      - API_PORT=${RIE_API_PORT:-4000}
      - RIE_API_DOMAIN=${RIE_API_DOMAIN:-rie.example.com}
      - RIE_API_URL=${RIE_API_URL:-http://rie.example.com/workspace/api}
      # Authentication
      - MICROSOFT_TENANT_ID=${RIE_MICROSOFT_TENANT_ID:-your-microsoft-tenant-id}
      - MICROSOFT_CLIENT_ID=${RIE_MICROSOFT_CLIENT_ID:-your-microsoft-client-id}
      - MICROSOFT_CLIENT_SECRET=${RIE_MICROSOFT_CLIENT_SECRET:-your-microsoft-client-secret}
      - BETTER_AUTH_SECRET=${RIE_BETTER_AUTH_SECRET:-your-better-auth-secret--long-32}
      # OpenTelemetry
      - LOG_LEVEL=${RIE_LOG_LEVEL:-info}
      - OTEL_SERVICE_NAME_API=rie-${RIE_ENV_NAME}--api
      - OTEL_SERVICE_NAME_CLIENT=rie-${RIE_ENV_NAME}--client
      - OTEL_API_ENABLED=false
      - OTEL_CLIENT_ENABLED=false
      - OTEL_EXPORTER_OTLP_ENDPOINT=${RIE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      # S3 Storage client
      - S3_ENDPOINT=${RIE_S3_ENDPOINT:-https://s3.example.com}
      - S3_ACCESS_KEY=${RIE_S3_ACCESS_KEY:-your-s3-access-key}
      - S3_SECRET_KEY=${RIE_S3_SECRET_KEY:-your-s3-secret-key}
      - S3_PROVIDER=${RIE_S3_PROVIDER:-minio}
      - S3_USE_SSL=${RIE_S3_USE_SSL:-true}
      - S3_REGION=${RIE_S3_REGION:-your-s3-region}
      - S3_BUCKET=${RIE_S3_BUCKET:-rie-storage}
      # Client configuration
      - RIE_CLIENT_DOMAIN=${RIE_CLIENT_DOMAIN:-rie.example.com}
      - RIE_CLIENT_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/workspace}
      - CLIENT_DOMAIN=${RIE_CLIENT_DOMAIN:-rie.example.com}
      - CLIENT_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/workspace}
      - CLIENT_ORIGIN_URL=${RIE_CLIENT_ORIGIN_URL:-http://rie.example.com/workspace}
      - CLIENT_PORT=${RIE_CLIENT_PORT:-3000}
      - NEXT_PUBLIC_BASE_PATH=${RIE_CLIENT_BASE_PATH:-/workspace}
      - NEXT_PUBLIC_API_FULL_URL=${RIE_API_URL:-http://rie.example.com/workspace/api}

