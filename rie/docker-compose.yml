networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-rie-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  appdata:
    name: ${APPDATA_VOLUME_NAME:-appdata}
    external: ${APPDATA_VOLUME_EXTERNAL:-false}
    driver: ${APPDATA_VOLUME_DRIVER:-local}
    # Empty type/o/device = normal Docker named volume. Set for bind or NFS — see README.
    driver_opts:
      type: ${APPDATA_VOLUME_DRIVER_TYPE:-}
      o: ${APPDATA_VOLUME_DRIVER_O:-}
      device: ${APPDATA_VOLUME_DRIVER_DEVICE:-}

services:
  app:
    image: ${IMAGE:-atelier.cen.umontreal.ca/rie/rie:latest}
    networks:
      default:
        aliases:
          - ${APP_NAME:-rie}
    volumes:
      - ${APPDATA_HOST_PATH:-appdata}:${APPDATA_CONTAINER_PATH:-/appdata}:z
    env_file:
      - ${ENV_FILE:-.env.example}
    deploy:
      mode: ${DEPLOY_MODE:-replicated}
      replicas: ${DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${RESTART_POLICY_CONDITION:-any}
        delay: ${RESTART_POLICY_DELAY:-5s}
        max_attempts: ${RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-rie}.loadbalancer.server.port=${APP_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-rie}.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-rie}.rule=Host(`${APP_DOMAIN:-rie.example.com}`) && PathPrefix(`${APP_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-rie}.service=${APP_NAME:-rie}"
        - "traefik.http.routers.${APP_NAME:-rie}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-rie}.tls=${TRAEFIK_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-rie}.tls.certresolver=${TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
        ## Homepage configuration
        - "homepage.enabled=${HOMEPAGE_ENABLED:-true}"
        - "homepage.group=${HOMEPAGE_GROUP:-APP}"
        - "homepage.name=${HOMEPAGE_NAME:-RIE}"
        - "homepage.icon=${HOMEPAGE_ICON:-}"
        - "homepage.href=${HOMEPAGE_HREF:-http://rie.example.com/}"
        - "homepage.description=${HOMEPAGE_DESCRIPTION:-}"
        - "homepage.siteMonitor=${HOMEPAGE_SITEMONITOR:-http://rie.example.com/}"
        - "homepage.ping=${HOMEPAGE_PING:-http://rie.example.com}"
    labels:
      - "traefik.enable=${TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-rie}.loadbalancer.server.port=${APP_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-rie}.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-rie}.rule=Host(`${APP_DOMAIN:-rie.example.com}`) && PathPrefix(`${APP_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-rie}.service=${APP_NAME:-rie}"
      - "traefik.http.routers.${APP_NAME:-rie}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-rie}.tls=${TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-rie}.tls.certresolver=${TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      ## Homepage configuration
      - "homepage.enabled=${HOMEPAGE_ENABLED:-true}"
      - "homepage.group=${HOMEPAGE_GROUP:-APP}"
      - "homepage.name=${HOMEPAGE_NAME:-RIE}"
      - "homepage.icon=${HOMEPAGE_ICON:-}"
      - "homepage.href=${HOMEPAGE_HREF:-http://rie.example.com/}"
      - "homepage.description=${HOMEPAGE_DESCRIPTION:-}"
      - "homepage.siteMonitor=${HOMEPAGE_SITEMONITOR:-http://rie.example.com/}"
      - "homepage.ping=${HOMEPAGE_PING:-http://rie.example.com}"
