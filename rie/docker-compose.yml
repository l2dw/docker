networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-rie-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  appdata:
    name: ${APPDATA_VOLUME_NAME:-appdata}
    external: ${APPDATA_VOLUME_EXTERNAL:-false}
    driver: ${APPDATA_VOLUME_DRIVER:-local}
    # Empty type/o/device = normal Docker named volume. Set for bind or NFS — see README.
    driver_opts:
      type: ${APPDATA_VOLUME_DRIVER_TYPE:-}
      o: ${APPDATA_VOLUME_DRIVER_O:-}
      device: ${APPDATA_VOLUME_DRIVER_DEVICE:-}

services:
  app:
    image: ${IMAGE:-atelier.cen.umontreal.ca/rie/rie:latest}
    networks:
      default:
        aliases:
          - ${APP_NAME:-rie}
    volumes:
      - ${APPDATA_HOST_PATH:-appdata}:${APPDATA_CONTAINER_PATH:-/appdata}:z
    env_file:
      - ${ENV_FILE:-.env.example}
    # All env vars from .env.example, exposed via `environment:` (grouped by
    # app) so Docker Compose unquotes them on interpolation. This defeats
    # Dokploy's quoted `env_file` values ("true") that would otherwise break
    # the strict `[ "$VAR" = "true" ]` checks in fullstack.entrypoint.sh and
    # corrupt PG_DATABASE_URL construction.
    environment:
      # ── General ──────────────────────────────────────────────
      NODE_ENV: ${NODE_ENV:-production}
      ENV_NAME: ${ENV_NAME:-prod}
      TZ: ${TZ:-America/Montreal}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # ── Service toggles (entrypoint) ─────────────────────────
      ENABLE_SERVICE_API: ${ENABLE_SERVICE_API:-true}
      ENABLE_SERVICE_WEB_APP: ${ENABLE_SERVICE_WEB_APP:-true}
      # ── rie-api (Hono / Effect-ts) ────────────────────────────
      API_PORT: ${API_PORT:-4000}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      RIE_API_DOMAIN: ${RIE_API_DOMAIN:-rie.example.com}
      RIE_API_URL: ${RIE_API_URL:-http://rie.example.com/api}
      # Database (unquoted so PG_DATABASE_URL builds correctly)
      PG_DATABASE_NAME: ${PG_DATABASE_NAME:-}
      PG_DATABASE_USER: ${PG_DATABASE_USER:-}
      PG_DATABASE_PASSWORD: ${PG_DATABASE_PASSWORD:-}
      PG_DATABASE_HOST: ${PG_DATABASE_HOST:-}
      PG_DATABASE_PORT: ${PG_DATABASE_PORT:-5432}
      # S3 / MinIO
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PROVIDER: ${S3_PROVIDER:-minio}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-rie-storage}
      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@rie.umontreal.ca}
      SIGNUP_ALLOWED_EMAIL_SUFFIXES: ${SIGNUP_ALLOWED_EMAIL_SUFFIXES:-}
      # ── apps/auth (Better Auth / Microsoft AD) ───────────────
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      RIE_AUTH_CLIENT_ID: ${RIE_AUTH_CLIENT_ID:-}
      RIE_AUTH_CLIENT_SECRET: ${RIE_AUTH_CLIENT_SECRET:-}
      # ── rie-web (Next.js) ─────────────────────────────────────
      CLIENT_PORT: ${CLIENT_PORT:-3000}
      CLIENT_HTTP_PROTOCOL: ${CLIENT_HTTP_PROTOCOL:-http}
      CLIENT_HTTP_HOST: ${CLIENT_HTTP_HOST:-localhost}
      CLIENT_HTTP_PORT: ${CLIENT_HTTP_PORT:-3000}
      CLIENT_ORIGIN_URL: ${CLIENT_ORIGIN_URL:-http://localhost:3000}
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:-rie.example.com}
      CLIENT_BASE_PATH: ${CLIENT_BASE_PATH:-/web}
      RIE_CLIENT_DOMAIN: ${RIE_CLIENT_DOMAIN:-rie.example.com}
      RIE_CLIENT_BASE_PATH: ${RIE_CLIENT_BASE_PATH:-/web}
      NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/web}
      NEXT_PUBLIC_API_FULL_URL: ${NEXT_PUBLIC_API_FULL_URL:-http://rie.example.com/api}
      NEXT_PUBLIC_RIE_API_URL: ${NEXT_PUBLIC_RIE_API_URL:-http://rie.example.com/api}
      NEXT_PUBLIC_API_HTTP_PROTOCOL: ${NEXT_PUBLIC_API_HTTP_PROTOCOL:-http}
      NEXT_PUBLIC_API_HTTP_HOST: ${NEXT_PUBLIC_API_HTTP_HOST:-rie.example.com}
      NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-443}
      NEXT_PUBLIC_API_BASE_PATH: ${NEXT_PUBLIC_API_BASE_PATH:-/api}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      # ── OpenTelemetry ────────────────────────────────────────
      OTEL_API_ENABLED: ${OTEL_API_ENABLED:-false}
      OTEL_CLIENT_ENABLED: ${OTEL_CLIENT_ENABLED:-false}
      OTEL_SERVICE_NAME_API: ${OTEL_SERVICE_NAME_API:-rie-api}
      OTEL_SERVICE_NAME_CLIENT: ${OTEL_SERVICE_NAME_CLIENT:-rie-web}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    deploy:
      mode: ${DEPLOY_MODE:-replicated}
      replicas: ${DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${RESTART_POLICY_CONDITION:-any}
        delay: ${RESTART_POLICY_DELAY:-5s}
        max_attempts: ${RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-rie}.loadbalancer.server.port=${APP_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-rie}.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-rie}.rule=Host(`${APP_DOMAIN:-rie.example.com}`) && PathPrefix(`${APP_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-rie}.service=${APP_NAME:-rie}"
        - "traefik.http.routers.${APP_NAME:-rie}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-rie}.tls=${TRAEFIK_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-rie}.tls.certresolver=${TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
        ## Homepage configuration
        - "homepage.enabled=${HOMEPAGE_ENABLED:-true}"
        - "homepage.group=${HOMEPAGE_GROUP:-APP}"
        - "homepage.name=${HOMEPAGE_NAME:-RIE}"
        - "homepage.icon=${HOMEPAGE_ICON:-}"
        - "homepage.href=${HOMEPAGE_HREF:-http://rie.example.com/}"
        - "homepage.description=${HOMEPAGE_DESCRIPTION:-}"
        - "homepage.siteMonitor=${HOMEPAGE_SITEMONITOR:-http://rie.example.com/}"
        - "homepage.ping=${HOMEPAGE_PING:-http://rie.example.com}"
    labels:
      - "traefik.enable=${TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-rie}.loadbalancer.server.port=${APP_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-rie}.entrypoints=${TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-rie}.rule=Host(`${APP_DOMAIN:-rie.example.com}`) && PathPrefix(`${APP_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-rie}.service=${APP_NAME:-rie}"
      - "traefik.http.routers.${APP_NAME:-rie}.middlewares=${TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-rie}.tls=${TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-rie}.tls.certresolver=${TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      ## Homepage configuration
      - "homepage.enabled=${HOMEPAGE_ENABLED:-true}"
      - "homepage.group=${HOMEPAGE_GROUP:-APP}"
      - "homepage.name=${HOMEPAGE_NAME:-RIE}"
      - "homepage.icon=${HOMEPAGE_ICON:-}"
      - "homepage.href=${HOMEPAGE_HREF:-http://rie.example.com/}"
      - "homepage.description=${HOMEPAGE_DESCRIPTION:-}"
      - "homepage.siteMonitor=${HOMEPAGE_SITEMONITOR:-http://rie.example.com/}"
      - "homepage.ping=${HOMEPAGE_PING:-http://rie.example.com}"
