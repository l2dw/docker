networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-huly-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

services:
  media:
    image: ${HULY_MEDIA_IMAGE:-docker.io/hardcoreeng/media:v0.7.426}
    restart: ${HULY_RESTART:-unless-stopped}
    privileged: ${HULY_PRIVILEGED:-false}
    env_file:
      - ${HULY_MEDIA_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - SECRET=${HULY_SECRET:-ChangeMe}
      - REGION=${HULY_MEDIA_REGION:-cockroach}
      - QUEUE_CONFIG=${HULY_QUEUE_CONFIG:-kafka:9092}
      - ACCOUNTS_URL=http://account:3000
    networks:
      - default
    deploy:
      mode: ${HULY_MEDIA_DEPLOY_MODE:-replicated}
      replicas: ${HULY_MEDIA_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${HULY_MEDIA_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${HULY_MEDIA_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${HULY_MEDIA_RESTART_POLICY_CONDITION:-any}
        delay: ${HULY_MEDIA_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${HULY_MEDIA_RESTART_POLICY_MAX_ATTEMPTS:-3}
