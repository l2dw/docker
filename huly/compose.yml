        max_attempts: ${HULY_STATS_RESTART_POLICY_MAX_ATTEMPTS:-3}

  kvs:
    image: ${HULY_KVS_IMAGE:-docker.io/hardcoreeng/hulykvs:v0.7.426}
    restart: ${HULY_RESTART:-unless-stopped}
    privileged: ${HULY_PRIVILEGED:-false}
    env_file:
      - ${HULY_KVS_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - HULY_DB_CONNECTION=${HULY_CR_DB_URL:-postgres://huly:ChangeMe@postgresql:26257/huly}
