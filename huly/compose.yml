    networks:
      - default
    deploy:
      mode: ${HULY_KVS_DEPLOY_MODE:-replicated}
      replicas: ${HULY_KVS_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${HULY_KVS_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${HULY_KVS_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${HULY_KVS_RESTART_POLICY_CONDITION:-any}
        delay: ${HULY_KVS_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${HULY_KVS_RESTART_POLICY_MAX_ATTEMPTS:-3}
