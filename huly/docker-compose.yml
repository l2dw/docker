      - UPLOAD_URL=${HULY_UPLOAD_URL:-/files}
      - STREAM_URL=${HULY_STREAM_URL:-https://huly.example.com/recording}
      - FILES_URL=${HULY_FILES_URL:-https://huly.example.com/_datalake/blob/:workspace/:blobId/:filename}
      - DATALAKE_URL=${HULY_DATALAKE_URL:-https://huly.example.com/_datalake}
      - ELASTIC_URL=${HULY_ELASTIC_URL:-http://elasticsearch:9200}
      - COLLABORATOR_URL=${HULY_WS_SCHEME:-wss}://${HULY_DOMAIN:-huly.example.com}/_collaborator
