      restart_policy:
        condition: ${HULY_FRONT_RESTART_POLICY_CONDITION:-any}
        delay: ${HULY_FRONT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${HULY_FRONT_RESTART_POLICY_MAX_ATTEMPTS:-3}
