    networks:
      - default
    deploy:
      mode: ${HULY_WORKSPACE_DEPLOY_MODE:-replicated}
      replicas: ${HULY_WORKSPACE_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${HULY_WORKSPACE_MEMORY_LIMIT:-1G}
      placement:
        constraints:
