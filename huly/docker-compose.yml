      - COLLABORATOR_PORT=${HULY_COLLABORATOR_PORT:-3078}
      - SECRET=${HULY_SECRET:-ChangeMe}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=${HULY_STORAGE_CONFIG:-minio|minio:9000?accessKey=ChangeMe&secretKey=ChangeMe}
    networks:
      - default
    deploy:
      mode: ${HULY_COLLABORATOR_DEPLOY_MODE:-replicated}
