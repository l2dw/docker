networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  karakeep-data:
    name: ${KARAKEEP_DATA_VOLUME_NAME:-karakeep-data}
    external: ${KARAKEEP_DATA_VOLUME_EXTERNAL:-false}

services:
  karakeep-web:
    image: ${KARAKEEP_IMAGE:-ghcr.io/karakeep-app/karakeep:release}
    restart: ${KARAKEEP_RESTART:-unless-stopped}
    privileged: ${KARAKEEP_PRIVILEGED:-false}
    env_file:
      - ${KARAKEEP_WEB_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - DATA_DIR=${KARAKEEP_DATA_CONTAINER_PATH:-/data}
      - NEXTAUTH_URL=${KARAKEEP_NEXTAUTH_URL:-http://karakeep.example.com}
      - NEXTAUTH_SECRET=${KARAKEEP_NEXTAUTH_SECRET:-}
      - MEILI_ADDR=${KARAKEEP_MEILI_ADDR:-}
      - MEILI_MASTER_KEY=${KARAKEEP_MEILI_MASTER_KEY:-}
      - BROWSER_WEB_URL=${KARAKEEP_BROWSER_WEB_URL:-http://karakeep-chrome:9222}
      - DISABLE_SIGNUPS=${KARAKEEP_DISABLE_SIGNUPS:-false}
      - OPENAI_API_KEY=${KARAKEEP_OPENAI_API_KEY:-}
    volumes:
      - ${KARAKEEP_DATA_DIR:-karakeep-data}:${KARAKEEP_DATA_CONTAINER_PATH:-/data}
    depends_on:
      - karakeep-chrome
    deploy:
      mode: ${KARAKEEP_DEPLOY_MODE:-replicated}
      replicas: ${KARAKEEP_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${KARAKEEP_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${KARAKEEP_WEB_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${KARAKEEP_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.routers.karakeep-web.entrypoints=${KARAKEEP_ENTRYPOINTS:-web}"
        - "traefik.http.routers.karakeep-web.rule=Host(`${KARAKEEP_DOMAIN:-karakeep.example.com}`)"
        - "traefik.http.routers.karakeep-web.service=karakeep-web"
        - "traefik.http.routers.karakeep-web.middlewares=${KARAKEEP_MIDDLEWARES:-}"
        - "traefik.http.routers.karakeep-web.tls=${KARAKEEP_TLS_ENABLED:-false}"
        - "traefik.http.routers.karakeep-web.tls.certresolver=${KARAKEEP_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.karakeep-web.loadbalancer.server.port=3000"
        - "traefik.http.services.karakeep-web.loadbalancer.passhostheader=true"
        - "homepage.group=${KARAKEEP_HOMEPAGE_GROUP:-Bookmarks}"
        - "homepage.name=${KARAKEEP_HOMEPAGE_NAME:-Karakeep}"
        - "homepage.icon=${KARAKEEP_HOMEPAGE_ICON:-karakeep.png}"
        - "homepage.href=${KARAKEEP_APP_URL:-http://karakeep.example.com}"
        - "homepage.description=${KARAKEEP_HOMEPAGE_DESCRIPTION:-Bookmark and note hoarder (formerly Hoarder)}"
        - "homepage.siteMonitor=${KARAKEEP_HOMEPAGE_SITEMONITOR:-http://karakeep-web:3000}"
    labels:
      - "traefik.enable=${KARAKEEP_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.routers.karakeep-web.entrypoints=${KARAKEEP_ENTRYPOINTS:-web}"
      - "traefik.http.routers.karakeep-web.rule=Host(`${KARAKEEP_DOMAIN:-karakeep.example.com}`)"
      - "traefik.http.routers.karakeep-web.service=karakeep-web"
      - "traefik.http.routers.karakeep-web.middlewares=${KARAKEEP_MIDDLEWARES:-}"
      - "traefik.http.routers.karakeep-web.tls=${KARAKEEP_TLS_ENABLED:-false}"
      - "traefik.http.routers.karakeep-web.tls.certresolver=${KARAKEEP_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.karakeep-web.loadbalancer.server.port=3000"
      - "traefik.http.services.karakeep-web.loadbalancer.passhostheader=true"
      - "homepage.group=${KARAKEEP_HOMEPAGE_GROUP:-Bookmarks}"
      - "homepage.name=${KARAKEEP_HOMEPAGE_NAME:-Karakeep}"
      - "homepage.icon=${KARAKEEP_HOMEPAGE_ICON:-karakeep.png}"
      - "homepage.href=${KARAKEEP_APP_URL:-http://karakeep.example.com}"
      - "homepage.description=${KARAKEEP_HOMEPAGE_DESCRIPTION:-Bookmark and note hoarder (formerly Hoarder)}"
      - "homepage.siteMonitor=${KARAKEEP_HOMEPAGE_SITEMONITOR:-http://karakeep-web:3000}"

  karakeep-chrome:
    image: ${KARAKEEP_CHROME_IMAGE:-ghcr.io/karakeep-app/karakeep-chrome:release}
    restart: ${KARAKEEP_RESTART:-unless-stopped}
    privileged: ${KARAKEEP_PRIVILEGED:-false}
    init: true
    env_file:
      - ${KARAKEEP_CHROME_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    deploy:
      mode: ${KARAKEEP_DEPLOY_MODE:-replicated}
      replicas: ${KARAKEEP_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${KARAKEEP_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${KARAKEEP_CHROME_MEMORY_LIMIT:-1G}
