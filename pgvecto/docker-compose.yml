networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  pgvecto-data:
    name: ${PGVECTO_DATA_VOLUME_NAME:-pgvecto-data}
    external: ${PGVECTO_DATA_VOLUME_EXTERNAL:-false}

services:
  pgvecto:
    image: ${PGVECTO_IMAGE:-docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0}
    restart: ${PGVECTO_RESTART:-unless-stopped}
    privileged: ${PGVECTO_PRIVILEGED:-false}
    env_file:
      - ${PGVECTO_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - POSTGRES_PASSWORD=${PGVECTO_PASSWORD:-}
      - POSTGRES_USER=${PGVECTO_USER:-pgvecto}
      - POSTGRES_DB=${PGVECTO_DATABASE:-pgvecto}
      - POSTGRES_INITDB_ARGS=${PGVECTO_INITDB_ARGS:---data-checksums}
    volumes:
      - ${PGVECTO_DATA_BIND:-pgvecto-data}:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - ${PGVECTO_NETWORK_ALIAS:-dokploy-pgvecto}
    command:
      - postgres
      - -c
      - shared_preload_libraries=vectors.so
      - -c
      - search_path="$$user", public, vectors
      - -c
      - logging_collector=on
      - -c
      - max_wal_size=${PGVECTO_MAX_WAL_SIZE:-2GB}
      - -c
      - shared_buffers=${PGVECTO_SHARED_BUFFERS:-512MB}
      - -c
      - wal_compression=on
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      mode: ${PGVECTO_DEPLOY_MODE:-replicated}
      replicas: ${PGVECTO_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${PGVECTO_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: ${PGVECTO_MEMORY_LIMIT:-1G}
