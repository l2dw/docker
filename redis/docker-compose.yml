networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-redis-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${REDIS_DATA_VOLUME_NAME:-redis_data}
    external: ${REDIS_DATA_VOLUME_EXTERNAL:-false}
    driver: ${REDIS_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${REDIS_DATA_VOLUME_TYPE:-}
      o: ${REDIS_DATA_VOLUME_OPTS:-}
      device: ${REDIS_DATA_VOLUME_PATH:-}

services:
  server:
    image: ${REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: ${REDIS_RESTART:-unless-stopped}
    privileged: ${REDIS_PRIVILEGED:-false}
    env_file:
      - ${REDIS_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - data:${REDIS_DATA_VOLUME_DIR:-/data}:z
    networks:
      default:
        aliases:
          - ${APP_NAME:-redis}_server
          - ${REDIS_NETWORK_ALIAS:-redis.server}
    deploy:
      mode: ${REDIS_DEPLOY_MODE:-replicated}
      replicas: ${REDIS_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${REDIS_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${REDIS_RESTART_POLICY_CONDITION:-any}
        delay: ${REDIS_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${REDIS_RESTART_POLICY_MAX_ATTEMPTS:-3}
