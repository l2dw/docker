networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  homepage_data:
    name: ${HOMEPAGE_DATA_VOLUME_NAME:-homepage_data}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOMEPAGE_DATA_HOST_PATH:-/appdata/homepage/config}

services:
  homepage:
    image: ${HOMEPAGE_IMAGE:-ghcr.io/gethomepage/homepage:latest}
    restart: ${HOMEPAGE_RESTART:-unless-stopped}
    privileged: ${HOMEPAGE_PRIVILEGED:-false}
    env_file:
      - ${HOMEPAGE_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-homepage.example.com}
    volumes:
      - homepage_data:${HOMEPAGE_DATA_CONTAINER_PATH:-/app/config}:z
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - ${HOMEPAGE_PLACEMENT_CONSTRAINTS:-node.role==manager}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HOMEPAGE_MEMORY_LIMIT:-1G}
