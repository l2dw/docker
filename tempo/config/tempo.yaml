# Tempo (monolithic) — every value overridable by env (-config.expand-env=true).
stream_over_http_enabled: true
server:
  http_listen_port: ${TEMPO_HTTP_PORT:-3200}
  grpc_listen_port: ${TEMPO_GRPC_PORT:-9095}
  log_level: ${TEMPO_LOG_LEVEL:-info}
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:${TEMPO_OTLP_GRPC_PORT:-4317}
        http:
          endpoint: 0.0.0.0:${TEMPO_OTLP_HTTP_PORT:-4318}
storage:
  trace:
    backend: ${TEMPO_STORAGE_BACKEND:-local}
    wal:
      path: ${TEMPO_DATA_DIR:-/var/tempo}/wal
    local:
      path: ${TEMPO_DATA_DIR:-/var/tempo}/blocks
    s3:
      bucket: ${TEMPO_S3_BUCKET:-tempo}
      endpoint: ${TEMPO_S3_ENDPOINT:-s3:9000}
      region: ${TEMPO_S3_REGION:-us-east-1}
      access_key: ${TEMPO_S3_ACCESS_KEY:-}
      secret_key: ${TEMPO_S3_SECRET_KEY:-}
      insecure: ${TEMPO_S3_INSECURE:-true}
      forcepathstyle: ${TEMPO_S3_FORCE_PATH_STYLE:-true}
# Retention (Tempo 3: compaction/retention run in the backend scheduler + worker).
backend_scheduler:
  local_work_path: ${TEMPO_DATA_DIR:-/var/tempo}
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_RETENTION:-336h}
backend_worker:
  compaction:
    block_retention: ${TEMPO_RETENTION:-336h}
