      - AWS_S3_BUCKET_NAME=${PLANE_S3_BUCKET_NAME:-uploads}
      - FILE_SIZE_LIMIT=${PLANE_FILE_SIZE_LIMIT:-5242880}
      - APP_DOMAIN=${PLANE_DOMAIN:-plane.example.com}
    networks:
      - default
    deploy:
      mode: ${PLANE_API_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_API_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_API_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_API_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_API_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_API_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_API_RESTART_POLICY_MAX_ATTEMPTS:-3}
