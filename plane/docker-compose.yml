networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-plane-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

services:
  web:
    image: ${PLANE_WEB_IMAGE:-docker.io/makeplane/plane-frontend:stable}
    restart: ${PLANE_RESTART:-unless-stopped}
    privileged: ${PLANE_PRIVILEGED:-false}
    env_file:
      - ${PLANE_WEB_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    networks:
      - default
    deploy:
      mode: ${PLANE_WEB_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_WEB_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_WEB_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_WEB_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_WEB_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_WEB_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_WEB_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${PLANE_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-plane}-web.loadbalancer.server.port=${PLANE_WEB_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-plane}-web.entrypoints=${PLANE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-plane}-web.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`)"
        - "traefik.http.routers.${APP_NAME:-plane}-web.service=${APP_NAME:-plane}-web"
        - "traefik.http.routers.${APP_NAME:-plane}-web.middlewares=${PLANE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-plane}-web.tls=${PLANE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-plane}-web.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${PLANE_HOMEPAGE_GROUP:-Productivity}"
        - "homepage.name=${PLANE_HOMEPAGE_NAME:-Plane}"
        - "homepage.icon=${PLANE_HOMEPAGE_ICON:-plane.png}"
        - "homepage.href=${PLANE_HOMEPAGE_URL:-}"
        - "homepage.description=${PLANE_HOMEPAGE_DESCRIPTION:-Project management}"
        - "homepage.siteMonitor=${PLANE_HOMEPAGE_SITEMONITOR:-http://web:3000}"
    labels:
      - "traefik.enable=${PLANE_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-plane}-web.loadbalancer.server.port=${PLANE_WEB_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-plane}-web.entrypoints=${PLANE_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-plane}-web.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`)"
      - "traefik.http.routers.${APP_NAME:-plane}-web.service=${APP_NAME:-plane}-web"
      - "traefik.http.routers.${APP_NAME:-plane}-web.middlewares=${PLANE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-plane}-web.tls=${PLANE_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-plane}-web.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${PLANE_HOMEPAGE_GROUP:-Productivity}"
      - "homepage.name=${PLANE_HOMEPAGE_NAME:-Plane}"
      - "homepage.icon=${PLANE_HOMEPAGE_ICON:-plane.png}"
      - "homepage.href=${PLANE_HOMEPAGE_URL:-}"
      - "homepage.description=${PLANE_HOMEPAGE_DESCRIPTION:-Project management}"
      - "homepage.siteMonitor=${PLANE_HOMEPAGE_SITEMONITOR:-http://web:3000}"

  space:
    image: ${PLANE_SPACE_IMAGE:-docker.io/makeplane/plane-space:stable}
    restart: ${PLANE_RESTART:-unless-stopped}
    privileged: ${PLANE_PRIVILEGED:-false}
    env_file:
      - ${PLANE_SPACE_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    networks:
      - default
    deploy:
      mode: ${PLANE_SPACE_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_SPACE_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_SPACE_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_SPACE_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_SPACE_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_SPACE_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_SPACE_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${PLANE_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-plane}-space.loadbalancer.server.port=${PLANE_SPACE_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-plane}-space.entrypoints=${PLANE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-plane}-space.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/spaces`) || PathPrefix(`/spaces/`))"
        - "traefik.http.routers.${APP_NAME:-plane}-space.service=${APP_NAME:-plane}-space"
        - "traefik.http.routers.${APP_NAME:-plane}-space.middlewares=${PLANE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-plane}-space.tls=${PLANE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-plane}-space.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
    labels:
      - "traefik.enable=${PLANE_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-plane}-space.loadbalancer.server.port=${PLANE_SPACE_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-plane}-space.entrypoints=${PLANE_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-plane}-space.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/spaces`) || PathPrefix(`/spaces/`))"
      - "traefik.http.routers.${APP_NAME:-plane}-space.service=${APP_NAME:-plane}-space"
      - "traefik.http.routers.${APP_NAME:-plane}-space.middlewares=${PLANE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-plane}-space.tls=${PLANE_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-plane}-space.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"

  admin:
    image: ${PLANE_ADMIN_IMAGE:-docker.io/makeplane/plane-admin:stable}
    restart: ${PLANE_RESTART:-unless-stopped}
    privileged: ${PLANE_PRIVILEGED:-false}
    env_file:
      - ${PLANE_ADMIN_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    networks:
      - default
    deploy:
      mode: ${PLANE_ADMIN_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_ADMIN_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_ADMIN_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_ADMIN_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_ADMIN_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_ADMIN_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_ADMIN_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${PLANE_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-plane}-admin.loadbalancer.server.port=${PLANE_ADMIN_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.entrypoints=${PLANE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/god-mode`) || PathPrefix(`/god-mode/`))"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.service=${APP_NAME:-plane}-admin"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.middlewares=${PLANE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.tls=${PLANE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-plane}-admin.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
    labels:
      - "traefik.enable=${PLANE_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-plane}-admin.loadbalancer.server.port=${PLANE_ADMIN_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.entrypoints=${PLANE_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/god-mode`) || PathPrefix(`/god-mode/`))"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.service=${APP_NAME:-plane}-admin"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.middlewares=${PLANE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.tls=${PLANE_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-plane}-admin.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"

  live:
