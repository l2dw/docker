      - DEBUG=${PLANE_DEBUG:-0}
      - CORS_ALLOWED_ORIGINS=${PLANE_CORS_ALLOWED_ORIGINS:-http://plane.example.com}
      - GUNICORN_WORKERS=${PLANE_GUNICORN_WORKERS:-1}
      - USE_MINIO=${PLANE_USE_MINIO:-0}
      - DATABASE_URL=${PLANE_DATABASE_URL:-postgresql://plane:ChangeMe@postgres:5432/plane}
      - SECRET_KEY=${PLANE_SECRET_KEY:-ChangeMe}
      - AMQP_URL=${PLANE_AMQP_URL:-amqp://plane:ChangeMe@rabbitmq:5672/plane}
      - API_KEY_RATE_LIMIT=${PLANE_API_KEY_RATE_LIMIT:-60/minute}
      - AUTHENTICATION_RATE_LIMIT=${PLANE_AUTHENTICATION_RATE_LIMIT:-10/minute}
      - MINIO_ENDPOINT_SSL=${PLANE_MINIO_ENDPOINT_SSL:-0}
      - LIVE_SERVER_SECRET_KEY=${PLANE_LIVE_SERVER_SECRET_KEY:-ChangeMe}
      - WEBHOOK_ALLOWED_IPS=${PLANE_WEBHOOK_ALLOWED_IPS:-}
