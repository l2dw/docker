        - "traefik.http.routers.${APP_NAME:-plane}-api.entrypoints=${PLANE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-plane}-api.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/api`) || PathPrefix(`/api/`) || Path(`/auth`) || PathPrefix(`/auth/`) || Path(`/static`) || PathPrefix(`/static/`))"
        - "traefik.http.routers.${APP_NAME:-plane}-api.service=${APP_NAME:-plane}-api"
        - "traefik.http.routers.${APP_NAME:-plane}-api.middlewares=${PLANE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-plane}-api.tls=${PLANE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-plane}-api.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
    labels:
