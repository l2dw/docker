      - default
    deploy:
      mode: ${PLANE_BEAT_WORKER_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_BEAT_WORKER_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_BEAT_WORKER_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_BEAT_WORKER_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_BEAT_WORKER_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_BEAT_WORKER_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_BEAT_WORKER_RESTART_POLICY_MAX_ATTEMPTS:-3}

  migrator:
    image: ${PLANE_MIGRATOR_IMAGE:-docker.io/makeplane/plane-backend:stable}
    command: ./bin/docker-entrypoint-migrator.sh
    restart: ${PLANE_RESTART:-unless-stopped}
    privileged: ${PLANE_PRIVILEGED:-false}
    env_file:
      - ${PLANE_MIGRATOR_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - WEB_URL=${PLANE_APP_URL:-http://plane.example.com}
      - DEBUG=${PLANE_DEBUG:-0}
      - CORS_ALLOWED_ORIGINS=${PLANE_CORS_ALLOWED_ORIGINS:-http://plane.example.com}
      - GUNICORN_WORKERS=${PLANE_GUNICORN_WORKERS:-1}
      - USE_MINIO=${PLANE_USE_MINIO:-0}
      - DATABASE_URL=${PLANE_DATABASE_URL:-postgresql://plane:ChangeMe@postgres:5432/plane}
      - SECRET_KEY=${PLANE_SECRET_KEY:-ChangeMe}
      - AMQP_URL=${PLANE_AMQP_URL:-amqp://plane:ChangeMe@rabbitmq:5672/plane}
      - API_KEY_RATE_LIMIT=${PLANE_API_KEY_RATE_LIMIT:-60/minute}
      - AUTHENTICATION_RATE_LIMIT=${PLANE_AUTHENTICATION_RATE_LIMIT:-10/minute}
      - MINIO_ENDPOINT_SSL=${PLANE_MINIO_ENDPOINT_SSL:-0}
      - LIVE_SERVER_SECRET_KEY=${PLANE_LIVE_SERVER_SECRET_KEY:-ChangeMe}
      - WEBHOOK_ALLOWED_IPS=${PLANE_WEBHOOK_ALLOWED_IPS:-}
      - WEBHOOK_ALLOWED_HOSTS=${PLANE_WEBHOOK_ALLOWED_HOSTS:-}
      - PGHOST=${PLANE_PGHOST:-postgres}
      - PGDATABASE=${PLANE_PGDATABASE:-plane}
      - POSTGRES_USER=${PLANE_POSTGRES_USER:-plane}
      - POSTGRES_PASSWORD=${PLANE_POSTGRES_PASSWORD:-ChangeMe}
      - POSTGRES_DB=${PLANE_POSTGRES_DB:-plane}
      - POSTGRES_PORT=${PLANE_POSTGRES_PORT:-5432}
      - REDIS_HOST=${PLANE_REDIS_HOST:-redis}
      - REDIS_PORT=${PLANE_REDIS_PORT:-6379}
      - REDIS_URL=${PLANE_REDIS_URL:-redis://redis:6379/}
      - AWS_REGION=${PLANE_AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${PLANE_AWS_ACCESS_KEY_ID:-access-key}
      - AWS_SECRET_ACCESS_KEY=${PLANE_AWS_SECRET_ACCESS_KEY:-ChangeMe}
      - AWS_S3_ENDPOINT_URL=${PLANE_S3_ENDPOINT_URL:-http://minio:9000}
      - AWS_S3_BUCKET_NAME=${PLANE_S3_BUCKET_NAME:-uploads}
      - FILE_SIZE_LIMIT=${PLANE_FILE_SIZE_LIMIT:-5242880}
      - APP_DOMAIN=${PLANE_DOMAIN:-plane.example.com}
    networks:
      - default
    deploy:
      mode: ${PLANE_MIGRATOR_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_MIGRATOR_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_MIGRATOR_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_MIGRATOR_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_MIGRATOR_RESTART_POLICY_CONDITION:-on-failure}
        delay: ${PLANE_MIGRATOR_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_MIGRATOR_RESTART_POLICY_MAX_ATTEMPTS:-3}
