networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-plane-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

services:
  live:
    image: ${PLANE_LIVE_IMAGE:-docker.io/makeplane/plane-live:stable}
    restart: ${PLANE_RESTART:-unless-stopped}
    privileged: ${PLANE_PRIVILEGED:-false}
    env_file:
      - ${PLANE_LIVE_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - API_BASE_URL=${PLANE_API_BASE_URL:-http://api:8000}
      - LIVE_SERVER_SECRET_KEY=${PLANE_LIVE_SERVER_SECRET_KEY:-ChangeMe}
      - REDIS_HOST=${PLANE_REDIS_HOST:-redis}
      - REDIS_PORT=${PLANE_REDIS_PORT:-6379}
      - REDIS_URL=${PLANE_REDIS_URL:-redis://redis:6379/}
    networks:
      - default
    deploy:
      mode: ${PLANE_LIVE_DEPLOY_MODE:-replicated}
      replicas: ${PLANE_LIVE_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PLANE_LIVE_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PLANE_LIVE_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PLANE_LIVE_RESTART_POLICY_CONDITION:-any}
        delay: ${PLANE_LIVE_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PLANE_LIVE_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${PLANE_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-plane}-live.loadbalancer.server.port=${PLANE_LIVE_PORT:-3000}"
        - "traefik.http.routers.${APP_NAME:-plane}-live.entrypoints=${PLANE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-plane}-live.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/live`) || PathPrefix(`/live/`))"
        - "traefik.http.routers.${APP_NAME:-plane}-live.service=${APP_NAME:-plane}-live"
        - "traefik.http.routers.${APP_NAME:-plane}-live.middlewares=${PLANE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-plane}-live.tls=${PLANE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-plane}-live.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
    labels:
      - "traefik.enable=${PLANE_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-plane}-live.loadbalancer.server.port=${PLANE_LIVE_PORT:-3000}"
      - "traefik.http.routers.${APP_NAME:-plane}-live.entrypoints=${PLANE_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-plane}-live.rule=Host(`${PLANE_DOMAIN:-plane.example.com}`) && (Path(`/live`) || PathPrefix(`/live/`))"
      - "traefik.http.routers.${APP_NAME:-plane}-live.service=${APP_NAME:-plane}-live"
      - "traefik.http.routers.${APP_NAME:-plane}-live.middlewares=${PLANE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-plane}-live.tls=${PLANE_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-plane}-live.tls.certresolver=${PLANE_TLS_CERTRESOLVER:-letsencrypt}"
