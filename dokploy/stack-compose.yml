networks:
  default:
    name: dokploy-network
    external: true

volumes:
  dokploy-postgresql_data:
    name: ${DOKPLOY_POSTGRES_DATA_VOLUME_NAME:-dokploy-postgresql_data}
    external: ${DOKPLOY_POSTGRES_DATA_VOLUME_EXTERNAL:-false}
  dokploy-postgresql_logs:
    name: ${DOKPLOY_POSTGRES_LOGS_VOLUME_NAME:-dokploy-postgresql_logs}
    external: ${DOKPLOY_POSTGRES_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-redis_data:
    name: ${DOKPLOY_REDIS_DATA_VOLUME_NAME:-dokploy-redis_data}
    external: ${DOKPLOY_REDIS_DATA_VOLUME_EXTERNAL:-false}
  dokploy-redis_logs:
    name: ${DOKPLOY_REDIS_LOGS_VOLUME_NAME:-dokploy-redis_logs}
    external: ${DOKPLOY_REDIS_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-data:
    name: ${DOKPLOY_DATA_VOLUME_NAME:-dokploy-data}
    external: ${DOKPLOY_DATA_VOLUME_EXTERNAL:-false}
  dokploy-logs:
    name: ${DOKPLOY_LOGS_VOLUME_NAME:-dokploy-logs}
    external: ${DOKPLOY_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_config:
    name: ${DOKPLOY_TRAEFIK_CONFIG_VOLUME_NAME:-dokploy-traefik_config}
    external: ${DOKPLOY_TRAEFIK_CONFIG_VOLUME_EXTERNAL:-false}
  dokploy-traefik_logs:
    name: ${DOKPLOY_TRAEFIK_LOGS_VOLUME_NAME:-dokploy-traefik_logs}
    external: ${DOKPLOY_TRAEFIK_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_certs:
    name: ${DOKPLOY_TRAEFIK_CERTS_VOLUME_NAME:-dokploy-traefik_certs}
    external: ${DOKPLOY_TRAEFIK_CERTS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_rules:
    name: ${DOKPLOY_TRAEFIK_RULES_VOLUME_NAME:-dokploy-traefik_rules}
    external: ${DOKPLOY_TRAEFIK_RULES_VOLUME_EXTERNAL:-false}
  ## Single-file mount (traefik.yml), not a directory — empty named volumes behave like dirs; bind or pre-create the file when external.
  dokploy-certificates:
    name: ${DOKPLOY_CERTIFICATES_VOLUME_NAME:-dokploy-certificates}
    external: ${DOKPLOY_CERTIFICATES_VOLUME_EXTERNAL:-false}

services:
  dokploy-postgresql:
    image: ${DOKPLOY_POSTGRES_IMAGE:-postgres:16}
    user: postgres
    environment:
      - POSTGRES_PASSWORD=${DOKPLOY_POSTGRES_PASSWORD:-ChangeMe}
      - POSTGRES_USER=${DOKPLOY_POSTGRES_USER:-dokploy}
      - POSTGRES_DB=${DOKPLOY_POSTGRES_DB:-dokploy}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DOKPLOY_POSTGRES_DATA_DIR:-dokploy-postgresql_data}:/var/lib/postgresql/data
      - ${DOKPLOY_POSTGRES_LOGS_DIR:-dokploy-postgresql_logs}:/var/log/postgresql
    networks:
      default:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback

  ## redis
  dokploy-redis:
    image: ${DOKPLOY_REDIS_IMAGE:-redis:latest}
    user: redis
    environment:
      - REDIS_PASSWORD=${DOKPLOY_REDIS_PASSWORD}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DOKPLOY_REDIS_DATA_DIR:-dokploy-redis_data}:/data
      - ${DOKPLOY_REDIS_LOGS_DIR:-dokploy-redis_logs}:/var/log/redis
    networks:
      default:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: start-first
        failure_action: rollback

  ## dokploy
  ## On manager node create dirs first: sudo mkdir -p /etc/dokploy /root/.docker
  dokploy:
    image: dokploy/dokploy:latest
    environment:
      - ADVERTISE_ADDR=${ADVERTISE_ADDR}
      - DATABASE_URL=${DOKPLOY_DATABASE_URL:-postgres://dokploy:ChangeMe@dokploy-postgresql:5432/dokploy}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOKPLOY_DATA_DIR:-dokploy-data}:/etc/dokploy
      - ${DOKPLOY_LOGS_DIR:-dokploy-logs}:/etc/dokploy/logs
      - ${DOKPLOY_TRAEFIK_CONFIG_DIR:-dokploy-traefik_config}:/etc/dokploy/traefik
    networks:
      default:
    ports:
      - target: 3000
        published: ${DOKPLOY_PORT:-3000}
        protocol: tcp
        mode: host
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # start-first + host ports = two tasks compete for the same PublishedPort on one node
        order: stop-first
        failure_action: rollback

  ## traefik
  dokploy-traefik:
    image: traefik:latest
    environment:
      - TZ=${TZ:-America/Toronto}
    ports:
      - target: 80
        published: ${DOKPLOY_TRAEFIK_PORT_HTTP:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${DOKPLOY_TRAEFIK_PORT_HTTPS:-443}
        protocol: tcp
        mode: host
    volumes:
      - ${DOKPLOY_TRAEFIK_LOGS_DIR:-dokploy-traefik_logs}:/etc/dokploy/logs/traefik
      - ${DOKPLOY_TRAEFIK_CONFIG_DIR:-dokploy-traefik_config}:/etc/dokploy/traefik
      - ${DOKPLOY_CERTIFICATES_DIR:-dokploy-certificates}:/etc/dokploy/traefik/dynamic/certificates
      - ${DOKPLOY_TRAEFIK_RULES_DIR:-dokploy-traefik_rules}:/etc/dokploy/traefik/dynamic/rules
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--serversTransport.insecureSkipVerify=true"
      - "--providers.swarm=true"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=dokploy-network"
      - "--providers.swarm.watch=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.watch=true"
      - "--providers.file.directory=/etc/dokploy/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.default.acme.tlschallenge=true"
      - "--certificatesresolvers.default.acme.storage=/etc/dokploy/traefik/dynamic/certificates/acme.json"
      - "--certificatesresolvers.default.acme.email=${DOKPLOY_TRAEFIK_EMAIL:-admin@traefik.dokploy}"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/dokploy/traefik/dynamic/certificates/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.email=${DOKPLOY_TRAEFIK_EMAIL:-admin@traefik.dokploy}"
      - "--certificatesresolvers.default.acme.email=${DOKPLOY_TRAEFIK_EMAIL:-admin@traefik.dokploy}"
      - "--log.level=${DOKPLOY_TRAEFIK_LOG_LEVEL:-DEBUG}"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filePath=/etc/dokploy/logs/traefik/access.log"
      - "--accesslog.format=${DOKPLOY_TRAEFIK_ACCESS_LOG_FORMAT:-json}"
      - "--accesslog.fields.defaultMode=keep"
      - "--accesslog.fields.names.RequestHost=keep"
      - "--accesslog.fields.names.RequestPath=keep"
      - "--accesslog.fields.names.RequestScheme=keep"
      - "--accesslog.fields.names.RequestMethod=keep"
      - "--accesslog.fields.names.RequestProtocol=keep"
      - "--accesslog.fields.names.RequestPort=keep"
      - "--accesslog.fields.names.RequestQuery=keep"
      - "--accesslog.fields.names.DownstreamURL=keep"
      - "--accesslog.fields.names.UserAgent=keep"
      - "--accesslog.fields.names.Duration=keep"
      - "--experimental.plugins.traefik-modsecurity-plugin.moduleName=github.com/acouvreur/traefik-modsecurity-plugin"
      - "--experimental.plugins.traefik-modsecurity-plugin.version=v1.3.0"
      - "--experimental.plugins.rewritebody.moduleName=github.com/traefik/plugin-rewritebody"
      - "--experimental.plugins.rewritebody.version=v0.3.1"
      - "${DOKPLOY_TRAEFIK_COMMAND:-}"
    networks:
      default:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # same rationale as dokploy: host PublishedPorts cannot overlap during rolling update
        order: stop-first
        failure_action: rollback
      # Swarm: these are SERVICE labels (Spec.Labels), not task/container labels — they will not
      # appear on `docker container inspect`. Check: `docker service inspect dokploy_dokploy-traefik --format '{{json .Spec.Labels}}'`
      # Traefik Swarm provider reads service labels (enable providers.docker.swarmMode if using file provider defaults).
      labels:
        traefik.enable: "true"
        ## Middleware configuration
        traefik.http.middlewares.redirect-to-websecure.redirectscheme.scheme: https
        traefik.http.middlewares.redirect-to-websecure.redirectscheme.permanent: "true"
        traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: https
        traefik.http.middlewares.redirect-to-https.redirectscheme.permanent: "true"
        traefik.http.middlewares.stripprefix-traefik.stripPrefix.prefixes: "${DOKPLOY_TRAEFIK_PATH_PREFIX:-/traefik}"
        ## After stripping the path prefix, bare `/` hits nothing on :8080; Traefik dashboard UI lives under `/dashboard/`
        traefik.http.middlewares.traefik-dash-root.replacePathRegex.regex: "^/?$$"
        traefik.http.middlewares.traefik-dash-root.replacePathRegex.replacement: "/dashboard/"
        # htpasswd hashes use $ → double each when passed through Compose/Swarm interpolation (cenadmin:$$apr1$$...)
        traefik.http.middlewares.basic-auth.basicAuth.users: "${DOKPLOY_TRAEFIK_BASIC_AUTH_CREDENTIALS}"
        ## Service configuration
        traefik.http.services.traefik-dashboard.loadbalancer.server.port: 8080
        traefik.http.services.traefik-dashboard.loadbalancer.server.scheme: http
        ## Secure router configuration
        traefik.http.routers.traefik-dashboard-secure.service: traefik-dashboard
        traefik.http.routers.traefik-dashboard-secure.entrypoints: websecure
        traefik.http.routers.traefik-dashboard-secure.tls: "true"
        traefik.http.routers.traefik-dashboard-secure.tls.certresolver: default
        traefik.http.routers.traefik-dashboard-secure.rule: "Host(`${DOKPLOY_TRAEFIK_DOMAIN:-traefik.dokploy}`) && PathPrefix(`${DOKPLOY_TRAEFIK_PATH_PREFIX:-/}`)"
        # traefik.http.routers.traefik-dashboard-secure.rule: "Host(`${DOKPLOY_TRAEFIK_DOMAIN:-traefik.dokploy}`) && PathPrefix(`${DOKPLOY_TRAEFIK_PATH_PREFIX:-/traefik}`)"
        # traefik.http.routers.traefik-dashboard-secure.middlewares: "stripprefix-traefik, traefik-dash-root"
        traefik.http.routers.traefik-dashboard-secure.middlewares: "${DOKPLOY_TRAEFIK_MIDDLEWARES_SECURE:-}"
        ## Insecure router configuration
        traefik.http.routers.traefik-dashboard-insecure.entrypoints: web
        traefik.http.routers.traefik-dashboard-insecure.rule: "Host(`${DOKPLOY_TRAEFIK_DOMAIN:-traefik.dokploy}`) && PathPrefix(`${DOKPLOY_TRAEFIK_PATH_PREFIX:-/}`)"
        traefik.http.routers.traefik-dashboard-insecure.service: traefik-dashboard
        # traefik.http.routers.traefik-dashboard-insecure.rule: "Host(`${DOKPLOY_TRAEFIK_DOMAIN:-traefik.dokploy}`) && PathPrefix(`${DOKPLOY_TRAEFIK_PATH_PREFIX:-/traefik}`)"
        # traefik.http.routers.traefik-dashboard-insecure.middlewares: "stripprefix-traefik, traefik-dash-root"
        traefik.http.routers.traefik-dashboard-insecure.middlewares: "${DOKPLOY_TRAEFIK_MIDDLEWARES_INSECURE:-}"

  traefik-certs-dumper:
    image: ldez/traefik-certs-dumper:v2.8.3
    entrypoint: sh -c '
      apk add jq ;
      while ! [ -e /etc/certificates/acme.json ] || ! [ `jq ".[] | .Certificates | length" /etc/certificates/acme.json` != 0 ]; do sleep 1 ; done
      && traefik-certs-dumper file --version v2 --watch --source /etc/certificates/acme.json --dest /etc/certificates '
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        traefik.enable: false
    volumes:
      - ${DOKPLOY_CERTIFICATES_DIR:-dokploy-certificates}:/etc/certificates

  waf:
    image: owasp/modsecurity-crs:apache
    volumes:
      - /var/log/apache2:/var/log/apache2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        traefik.enable: false
