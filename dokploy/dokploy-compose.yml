networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  dokploy-data:
    name: ${DOKPLOY_DATA_VOLUME_NAME:-dokploy-data}
    external: ${DOKPLOY_DATA_VOLUME_EXTERNAL:-false}
  dokploy-logs:
    name: ${DOKPLOY_LOGS_VOLUME_NAME:-dokploy-logs}
    external: ${DOKPLOY_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-docker:
    name: ${DOKPLOY_DOCKER_VOLUME_NAME:-dokploy-docker}
    external: ${DOKPLOY_DOCKER_VOLUME_EXTERNAL:-false}
  dokploy-traefik_certificates:
    name: ${DOKPLOY_TRAEFIK_CERTIFICATES_VOLUME_NAME:-dokploy-traefik_certificates}
    external: ${DOKPLOY_TRAEFIK_CERTIFICATES_VOLUME_EXTERNAL:-false}

services:
  ## dokploy console only — expects postgresql/redis (and Traefik) already on the overlay
  ## On manager node create dirs first: sudo mkdir -p /etc/dokploy /root/.docker
  dokploy:
    image: ${DOKPLOY_DOKPLOY_IMAGE:-docker.io/dokploy/dokploy:latest}
    privileged: ${DOKPLOY_PRIVILEGED:-false}
    restart: ${DOKPLOY_DOKPLOY_RESTART:-unless-stopped}
    # Swarm `stack deploy` does not reliably apply env_file — Make exports
    # $(INFRA_DIR)/dokploy/.env via stack-deploy before interpolation.
    env_file:
      - ${DOKPLOY_ENV_FILE:-.env.example}
    environment:
      - ADVERTISE_ADDR=${DOKPLOY_ADVERTISE_ADDR}
      - DATABASE_URL=${DOKPLOY_DATABASE_URL:-postgres://dokploy:ChangeMe@dokploy-postgresql:5432/dokploy}
      - REDIS_URL=${DOKPLOY_REDIS_URL:-redis://dokploy-redis:6379}
      - TZ=${TZ:-America/Toronto}
      # Do not set vendor BASE_PATH here — Dokploy uses /etc/dokploy as FS root.
      # DOKPLOY_BASE_PATH is Traefik PathPrefix only (see labels).
      # Must match Traefik router Host rules for login/session.
      - ALLOWED_ORIGINS=${DOKPLOY_ALLOWED_ORIGINS}
      - BETTER_AUTH_SECRET=${DOKPLOY_BETTER_AUTH_SECRET}
      - BETTER_AUTH_TRUSTED_ORIGINS=${DOKPLOY_BETTER_AUTH_TRUSTED_ORIGINS}
    volumes:
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DOKPLOY_DATA_DIR:-dokploy-data}:/etc/dokploy
      - ${DOKPLOY_LOGS_DIR:-dokploy-logs}:/var/log/dokploy
      - ${DOKPLOY_DOCKER_DIR:-dokploy-docker}:/root/.docker
      - ${DOKPLOY_TRAEFIK_CERTIFICATES_DIR:-dokploy-traefik_certificates}:/etc/dokploy/traefik/dynamic/certificates:z
    deploy:
      mode: ${DOKPLOY_DOKPLOY_DEPLOY_MODE:-replicated}
      replicas: ${DOKPLOY_DOKPLOY_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${DOKPLOY_DOKPLOY_PLACEMENT_CONSTRAINTS:-node.role==manager}
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # start-first + host ports = two tasks compete for the same PublishedPort on one node
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: ${DOKPLOY_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${DOKPLOY_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-dokploy}-console.loadbalancer.server.port=3000"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.entrypoints=${DOKPLOY_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.service=${APP_NAME:-dokploy}-console"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.middlewares=${DOKPLOY_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.tls=${DOKPLOY_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-dokploy}-console.tls.certresolver=${DOKPLOY_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
        - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Dokploy}"
        - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-dokploy.png}"
        - "homepage.href=${DOKPLOY_HOMEPAGE_URL:-}"
        - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Dokploy is a platform for deploying and managing applications.}"
        - "homepage.siteMonitor=${DOKPLOY_HOMEPAGE_SITEMONITOR:-http://dokploy:3000}"
    labels:
      - "traefik.enable=${DOKPLOY_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-dokploy}-console.loadbalancer.server.port=3000"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.entrypoints=${DOKPLOY_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.service=${APP_NAME:-dokploy}-console"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.middlewares=${DOKPLOY_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.tls=${DOKPLOY_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-dokploy}-console.tls.certresolver=${DOKPLOY_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
      - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Dokploy}"
      - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-dokploy.png}"
      - "homepage.href=${DOKPLOY_HOMEPAGE_URL:-}"
      - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Dokploy is a platform for deploying and managing applications.}"
      - "homepage.siteMonitor=${DOKPLOY_HOMEPAGE_SITEMONITOR:-http://dokploy:3000}"
