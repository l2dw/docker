networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    # Literal boolean required: podman-compose treats external: "true" (env string) as a dict and crashes.
    external: true

volumes:
  dokploy-postgresql_data:
    name: ${DOKPLOY_POSTGRES_DATA_VOLUME_NAME:-dokploy-postgresql_data}
    external: ${DOKPLOY_POSTGRES_DATA_VOLUME_EXTERNAL:-false}
  dokploy-postgresql_logs:
    name: ${DOKPLOY_POSTGRES_LOGS_VOLUME_NAME:-dokploy-postgresql_logs}
    external: ${DOKPLOY_POSTGRES_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-redis_data:
    name: ${DOKPLOY_REDIS_DATA_VOLUME_NAME:-dokploy-redis_data}
    external: ${DOKPLOY_REDIS_DATA_VOLUME_EXTERNAL:-false}
  dokploy-redis_logs:
    name: ${DOKPLOY_REDIS_LOGS_VOLUME_NAME:-dokploy-redis_logs}
    external: ${DOKPLOY_REDIS_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-data:
    name: ${DOKPLOY_DATA_VOLUME_NAME:-dokploy-data}
    external: ${DOKPLOY_DATA_VOLUME_EXTERNAL:-false}
  dokploy-logs:
    name: ${DOKPLOY_LOGS_VOLUME_NAME:-dokploy-logs}
    external: ${DOKPLOY_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_config:
    name: ${DOKPLOY_TRAEFIK_CONFIG_VOLUME_NAME:-dokploy-traefik_config}
    external: ${DOKPLOY_TRAEFIK_CONFIG_VOLUME_EXTERNAL:-false}
  dokploy-traefik_logs:
    name: ${DOKPLOY_TRAEFIK_LOGS_VOLUME_NAME:-dokploy-traefik_logs}
    external: ${DOKPLOY_TRAEFIK_LOGS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_certs:
    name: ${DOKPLOY_TRAEFIK_CERTS_VOLUME_NAME:-dokploy-traefik_certs}
    external: ${DOKPLOY_TRAEFIK_CERTS_VOLUME_EXTERNAL:-false}
  dokploy-traefik_rules:
    name: ${DOKPLOY_TRAEFIK_RULES_VOLUME_NAME:-dokploy-traefik_rules}
    external: ${DOKPLOY_TRAEFIK_RULES_VOLUME_EXTERNAL:-false}
  ## Single-file mount (traefik.yml), not a directory — empty named volumes behave like dirs; bind or pre-create the file when external.
  dokploy-certificates:
    name: ${DOKPLOY_CERTIFICATES_VOLUME_NAME:-dokploy-certificates}
    external: ${DOKPLOY_CERTIFICATES_VOLUME_EXTERNAL:-false}
  dokploy-waf_logs:
    name: ${DOKPLOY_WAF_LOGS_VOLUME_NAME:-dokploy-waf_logs}
    external: ${DOKPLOY_WAF_LOGS_VOLUME_EXTERNAL:-false}

services:
  postgresql:
    # Swarm rejects compose `platform` (docker stack deploy). On ARM hosts use a multi-arch image (default postgres:16) or Postgres/PostGIS on amd64/non-Swarm.
    image: ${DOKPLOY_POSTGRES_IMAGE:-docker.io/postgres:16}
    x-pull-policy: always
    user: postgres
    privileged: ${DOKPLOY_POSTGRES_PRIVILEGED:-false}
    environment:
      - POSTGRES_PASSWORD=${DOKPLOY_POSTGRES_PASSWORD:-ChangeMe}
      - POSTGRES_USER=${DOKPLOY_POSTGRES_USER:-dokploy}
      - POSTGRES_DB=${DOKPLOY_POSTGRES_DB:-dokploy}
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${DOKPLOY_POSTGRES_DATA_DIR:-dokploy-postgresql_data}:/var/lib/postgresql/data
      - ${DOKPLOY_POSTGRES_LOGS_DIR:-dokploy-postgresql_logs}:/var/log/postgresql
    networks:
      default:
        aliases:
          - dokploy-postgresql
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # bind-mounted PGDATA: start-first runs two tasks on the same path and corrupts/shuts down postgres
        order: stop-first
        failure_action: rollback

  ## redis
  redis:
    image: ${DOKPLOY_REDIS_IMAGE:-docker.io/redis:7}
    user: redis
    environment:
      - REDIS_PASSWORD=${DOKPLOY_REDIS_PASSWORD}
      - TZ=${TZ:-America/Toronto}
    command: redis-server --maxmemory-policy noeviction --maxmemory ${DOKPLOY_REDIS_MAXMEMORY:-512mb}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10s
    privileged: ${DOKPLOY_REDIS_PRIVILEGED:-false}
    volumes:
      - ${DOKPLOY_REDIS_DATA_DIR:-dokploy-redis_data}:/data
      - ${DOKPLOY_REDIS_LOGS_DIR:-dokploy-redis_logs}:/var/log/redis
    networks:
      default:
        aliases:
          - dokploy-redis
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback

  ## dokploy
  ## On manager node create dirs first: sudo mkdir -p /etc/dokploy /root/.docker
  dokploy:
    image: ${DOKPLOY_DOKPLOY_IMAGE:-docker.io/dokploy/dokploy:latest}
    x-pull-policy: always
    privileged: ${DOKPLOY_PRIVILEGED:-false}
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      # Node fetch needs this to honor HTTP(S)_PROXY (corporate proxy); avoids update-check timeouts.
      - NODE_USE_ENV_PROXY=1
      - ADVERTISE_ADDR=${ADVERTISE_ADDR}
      - DATABASE_URL=${DOKPLOY_DATABASE_URL:-postgres://dokploy:ChangeMe@postgresql:5432/dokploy}
      - REDIS_URL=${DOKPLOY_REDIS_URL:-redis://redis:6379}
      - TZ=${TZ:-America/Toronto}
      - BASE_PATH=${DOKPLOY_BASE_PATH:-}
      # Must match Traefik router Host rules (infra/traefik/dynamic/dokploy.yml) for login/session.
      - ALLOWED_ORIGINS=${DOKPLOY_ALLOWED_ORIGINS}
      - BETTER_AUTH_TRUSTED_ORIGINS=${DOKPLOY_BETTER_AUTH_TRUSTED_ORIGINS}
    volumes:
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DOKPLOY_DATA_DIR:-dokploy-data}:/etc/dokploy
      - ${DOKPLOY_LOGS_DIR:-dokploy-logs}:/etc/dokploy/logs
      # - ${DOKPLOY_TRAEFIK_CONFIG_DIR:-dokploy-traefik_config}:/etc/dokploy/traefik
    depends_on:
      - postgresql
      - redis
    # networks:
    #   default:
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        # start-first + host ports = two tasks compete for the same PublishedPort on one node
        order: stop-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.dokploy-server.loadbalancer.server.port=3000"
        - "traefik.http.routers.dokploy-server.entrypoints=${DOKPLOY_ENTRYPOINTS:-web}"
        - "traefik.http.routers.dokploy-server.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_BASE_PATH:-/}`)"
        - "traefik.http.routers.dokploy-server.service=dokploy-server"
        - "traefik.http.routers.dokploy-server.middlewares=${DOKPLOY_MIDDLEWARES:-}"
        - "traefik.http.routers.dokploy-server.tls=${DOKPLOY_TLS_ENABLED:-false}"
        - "traefik.http.routers.dokploy-server.tls.certresolver=${DOKPLOY_TLS_CERTRESOLVER:-letsencrypt}"
        ## Homepage configuration
        - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
        - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Dokploy}"
        - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-dokploy.png}"
        - "homepage.href=http://${DOKPLOY_DOMAIN:-dokploy.home}${DOKPLOY_BASE_PATH:-/}"
        - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Dokploy is a platform for deploying and managing applications.}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.dokploy-server.loadbalancer.server.port=3000"
      - "traefik.http.routers.dokploy-server.entrypoints=${DOKPLOY_ENTRYPOINTS:-web}"
      - "traefik.http.routers.dokploy-server.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_BASE_PATH:-/}`)"
      - "traefik.http.routers.dokploy-server.service=dokploy-server"
      - "traefik.http.routers.dokploy-server.middlewares=${DOKPLOY_MIDDLEWARES:-}"
      - "traefik.http.routers.dokploy-server.tls=${DOKPLOY_TLS_ENABLED:-false}"
      - "traefik.http.routers.dokploy-server.tls.certresolver=${DOKPLOY_TLS_CERTRESOLVER:-letsencrypt}"
      ## Homepage configuration
      - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
      - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Dokploy}"
      - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-dokploy.png}"
      - "homepage.href=http://${DOKPLOY_DOMAIN:-dokploy.home}${DOKPLOY_BASE_PATH:-/}"
      - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Dokploy is a platform for deploying and managing applications.}"

  ## traefik
  traefik:
    image: docker.io/traefik:latest
    x-pull-policy: always
    privileged: ${DOKPLOY_TRAEFIK_PRIVILEGED:-false}
    environment:
      - TZ=${TZ:-America/Toronto}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    ports:
      - target: ${DOKPLOY_TRAEFIK_PORT_TARGET:-80}
        published: ${DOKPLOY_TRAEFIK_PORT_PUBLISHED:-80}
        protocol: ${DOKPLOY_TRAEFIK_PORT_PROTOCOL:-tcp}
        mode: ${DOKPLOY_TRAEFIK_PORT_MODE:-host}
    volumes:
      - ${DOKPLOY_TRAEFIK_LOGS_DIR:-dokploy-traefik_logs}:/var/log/traefik
      # - ${DOKPLOY_TRAEFIK_CONFIG_DIR:-dokploy-traefik_config}:/etc/traefik
      - ${DOKPLOY_CERTIFICATES_DIR:-dokploy-certificates}:/etc/traefik/certificates
      - ${DOKPLOY_TRAEFIK_RULES_DIR:-dokploy-traefik_rules}:/etc/traefik/rules
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--api.basePath=${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_READ_TIMEOUT:-600s}"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_WRITE_TIMEOUT:-600s}"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_IDLE_TIMEOUT:-180s}"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_READ_TIMEOUT:-600s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_WRITE_TIMEOUT:-600s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=${DOKPLOY_TRAEFIK_TRANSPORT_IDLE_TIMEOUT:-180s}"
      - "--serversTransport.insecureSkipVerify=true"
      - "--providers.swarm=${DOKPLOY_TRAEFIK_PROVIDERS_SWARM:-true}"
      - "--providers.swarm.endpoint=unix:///var/run/docker.sock"
      - "--providers.swarm.exposedbydefault=false"
      - "--providers.swarm.network=${DEFAULT_NETWORK_NAME:-dokploy-network}"
      - "--providers.swarm.watch=${DOKPLOY_TRAEFIK_PROVIDERS_SWARM:-true}"
      - "--providers.docker=${DOKPLOY_TRAEFIK_PROVIDERS_DOCKER:-true}"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.network=${DEFAULT_NETWORK_NAME:-dokploy-network}"
      - "--providers.docker.watch=${DOKPLOY_TRAEFIK_PROVIDERS_DOCKER:-true}"
      - "--providers.file.directory=/etc/traefik/rules"
      - "--providers.file.watch=true"
      - "--certificatesresolvers.default.acme.tlschallenge=true"
      - "--certificatesresolvers.default.acme.storage=/etc/traefik/certificates/default.json"
      - "--certificatesresolvers.default.acme.email=${DOKPLOY_TRAEFIK_EMAIL:-cenadmin@listes.umontreal.ca}"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/certificates/letsencrypt.json"
      - "--certificatesresolvers.letsencrypt.acme.email=${DOKPLOY_TRAEFIK_EMAIL:-cenadmin@listes.umontreal.ca}"
      - "--log.level=${DOKPLOY_TRAEFIK_LOG_LEVEL:-INFO}"
      - "--metrics.prometheus=true"
      - "--accesslog=true"
      - "--accesslog.filePath=/var/log/traefik/access.log"
      - "--accesslog.format=${DOKPLOY_TRAEFIK_ACCESS_LOG_FORMAT:-json}"
      - "--accesslog.fields.defaultMode=keep"
      - "--accesslog.fields.names.RequestHost=keep"
      - "--accesslog.fields.names.RequestPath=keep"
      - "--accesslog.fields.names.RequestScheme=keep"
      - "--accesslog.fields.names.RequestMethod=keep"
      - "--accesslog.fields.names.RequestProtocol=keep"
      - "--accesslog.fields.names.RequestPort=keep"
      - "--accesslog.fields.names.RequestQuery=keep"
      - "--accesslog.fields.names.DownstreamURL=keep"
      - "--accesslog.fields.names.UserAgent=keep"
      - "--accesslog.fields.names.Duration=keep"
      - "--experimental.plugins.traefik-modsecurity-plugin.moduleName=github.com/acouvreur/traefik-modsecurity-plugin"
      - "--experimental.plugins.traefik-modsecurity-plugin.version=v1.3.0"
      - "--experimental.plugins.rewritebody.moduleName=github.com/traefik/plugin-rewritebody"
      - "--experimental.plugins.rewritebody.version=v0.3.1"
      - "${DOKPLOY_TRAEFIK_COMMAND:-}"
    networks:
      default:
        aliases:
          - dokploy-traefik
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      # Swarm: these are SERVICE labels (Spec.Labels), not task/container labels — they will not
      # appear on `docker container inspect`. Check: `docker service inspect dokploy_dokploy-traefik --format '{{json .Spec.Labels}}'`
      # Traefik Swarm provider reads service labels (enable providers.docker.swarmMode if using file provider defaults).
      labels:
        - "traefik.enable=true"
        ## Middleware configuration
        - "traefik.http.middlewares.redirect-to-websecure.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-websecure.redirectscheme.permanent=true"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        # htpasswd hashes use $ → double each when passed through Compose/Swarm interpolation (cenadmin:$$apr1$$...)
        - "traefik.http.middlewares.basic-auth.basicAuth.users=${DOKPLOY_TRAEFIK_BASIC_AUTH_CREDENTIALS}"
        ## Dummy port for Swarm provider when routing to api@internal
        - "traefik.http.services.dokploy-traefik.loadbalancer.server.port=8080"
        # ## Secure router configuration
        - "traefik.http.routers.dokploy-traefik.tls=${DOKPLOY_TRAEFIK_TLS_ENABLED:-false}"
        - "traefik.http.routers.dokploy-traefik.tls.certresolver=${DOKPLOY_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.routers.dokploy-traefik.entrypoints=${DOKPLOY_TRAEFIK_ENTRYPOINTS:-web}"
        - "traefik.http.routers.dokploy-traefik.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}`)"
        - "traefik.http.routers.dokploy-traefik.service=api@internal"
        - "traefik.http.routers.dokploy-traefik.middlewares=${DOKPLOY_TRAEFIK_MIDDLEWARES:-}"
        ## Homepage configuration
        - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
        - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Traefik}"
        - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-traefik.png}"
        - "homepage.href=http://${DOKPLOY_DOMAIN:-dokploy.home}${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
        - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Traefik is a modern HTTP reverse proxy and load balancer.}"
        - "homepage.siteMonitor=http://dokploy-traefik${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
        - "homepage.widget.type=traefik"
        - "homepage.widget.url=http://dokploy-traefik${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
    labels:
      - "traefik.enable=true"
      ## Middleware configuration
      - "traefik.http.middlewares.redirect-to-websecure.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-websecure.redirectscheme.permanent=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.middlewares.forward-https-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # htpasswd hashes use $ → double each when passed through Compose/Swarm interpolation (cenadmin:$$apr1$$...)
      - "traefik.http.middlewares.basic-auth.basicAuth.users=${DOKPLOY_TRAEFIK_BASIC_AUTH_CREDENTIALS}"
      ## Dummy port for Swarm provider when routing to api@internal
      - "traefik.http.services.dokploy-traefik.loadbalancer.server.port=8080"
      # ## Secure router configuration
      - "traefik.http.routers.dokploy-traefik.tls=${DOKPLOY_TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.http.routers.dokploy-traefik.tls.certresolver=${DOKPLOY_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.dokploy-traefik.entrypoints=${DOKPLOY_TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.dokploy-traefik.rule=Host(`${DOKPLOY_DOMAIN:-dokploy.home}`) && PathPrefix(`${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}`)"
      - "traefik.http.routers.dokploy-traefik.service=api@internal"
      - "traefik.http.routers.dokploy-traefik.middlewares=${DOKPLOY_TRAEFIK_MIDDLEWARES:-}"
      ## Homepage configuration
      - "homepage.group=${DOKPLOY_HOMEPAGE_GROUP:-Infra}"
      - "homepage.name=${DOKPLOY_HOMEPAGE_NAME:-Traefik}"
      - "homepage.icon=${DOKPLOY_HOMEPAGE_ICON:-traefik.png}"
      - "homepage.href=http://${DOKPLOY_DOMAIN:-dokploy.home}${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
      - "homepage.description=${DOKPLOY_HOMEPAGE_DESCRIPTION:-Traefik is a modern HTTP reverse proxy and load balancer.}"
      - "homepage.siteMonitor=http://dokploy-traefik${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"
      - "homepage.widget.type=traefik"
      - "homepage.widget.url=http://dokploy-traefik${DOKPLOY_TRAEFIK_BASE_PATH:-/traefik}"

  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.8.3
    entrypoint:
      - sh
      - -ec
      - |
        apk add --no-cache jq
        dest="/etc/certificates"
        started=""
        while true; do
          for f in "$$dest"/*.json; do
            [ -f "$$f" ] || continue
            case " $$started " in *" $$f "*) continue ;; esac
            [ -s "$$f" ] || continue
            [ "$$(jq -r '[.[].Certificates | length] | add // 0' "$$f" 2>/dev/null)" = "0" ] && continue
            traefik-certs-dumper file --version v2 --watch --source "$$f" --dest "$$dest" &
            started="$$started $$f"
          done
          sleep 5
        done
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=false"
    depends_on:
      - traefik
    volumes:
      - ${DOKPLOY_CERTIFICATES_DIR:-dokploy-certificates}:/etc/certificates

  waf:
    image: owasp/modsecurity-crs:apache
    volumes:
      - ${DOKPLOY_WAF_LOGS_DIR:-dokploy-waf_logs}:/var/log/apache2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=false"
