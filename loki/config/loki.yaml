# Loki (single binary) — every value overridable by env (-config.expand-env=true).
# LOKI_STORAGE_BACKEND: s3 | filesystem
auth_enabled: false
server:
  http_listen_port: ${LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${LOKI_GRPC_PORT:-9096}
  log_level: ${LOKI_LOG_LEVEL:-info}
common:
  path_prefix: ${LOKI_DATA_DIR:-/loki}
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
storage_config:
  tsdb_shipper:
    active_index_directory: ${LOKI_DATA_DIR:-/loki}/tsdb-index
    cache_location: ${LOKI_DATA_DIR:-/loki}/tsdb-cache
  filesystem:
    directory: ${LOKI_DATA_DIR:-/loki}/chunks
  aws:
    endpoint: ${LOKI_S3_ENDPOINT:-s3:9000}
    bucketnames: ${LOKI_S3_BUCKET:-loki}
    region: ${LOKI_S3_REGION:-us-east-1}
    access_key_id: ${LOKI_S3_ACCESS_KEY:-}
    secret_access_key: ${LOKI_S3_SECRET_KEY:-}
    insecure: ${LOKI_S3_INSECURE:-true}
    s3forcepathstyle: ${LOKI_S3_FORCE_PATH_STYLE:-true}
schema_config:
  configs:
    - from: ${LOKI_SCHEMA_FROM:-2026-01-01}
      store: tsdb
      object_store: ${LOKI_STORAGE_BACKEND:-filesystem}
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: ${LOKI_DATA_DIR:-/loki}/compactor
  retention_enabled: true
  delete_request_store: ${LOKI_STORAGE_BACKEND:-filesystem}
limits_config:
  retention_period: ${LOKI_RETENTION:-720h}
  allow_structured_metadata: true
  volume_enabled: true
  max_query_lookback: ${LOKI_RETENTION:-720h}
pattern_ingester:
  enabled: false
ruler:
  storage:
    type: local
    local:
      directory: ${LOKI_DATA_DIR:-/loki}/rules
analytics:
  reporting_enabled: false
