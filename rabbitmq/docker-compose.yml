networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-rabbitmq-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${RABBITMQ_DATA_VOLUME_NAME:-rabbitmq_data}
    external: ${RABBITMQ_DATA_VOLUME_EXTERNAL:-false}
    driver: ${RABBITMQ_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${RABBITMQ_DATA_VOLUME_TYPE:-}
      o: ${RABBITMQ_DATA_VOLUME_OPTS:-}
      device: ${RABBITMQ_DATA_VOLUME_PATH:-}

services:
  broker:
    image: ${RABBITMQ_IMAGE:-docker.io/library/rabbitmq:4-management-alpine}
    hostname: ${RABBITMQ_HOSTNAME:-rabbitmq}
    restart: ${RABBITMQ_RESTART:-unless-stopped}
    privileged: ${RABBITMQ_PRIVILEGED:-false}
    env_file:
      - ${RABBITMQ_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-rabbit}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-ChangeMe}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - data:${RABBITMQ_DATA_VOLUME_DIR:-/var/lib/rabbitmq}:z
    deploy:
      mode: ${RABBITMQ_DEPLOY_MODE:-replicated}
      replicas: ${RABBITMQ_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${RABBITMQ_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${RABBITMQ_RESTART_POLICY_CONDITION:-any}
        delay: ${RABBITMQ_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${RABBITMQ_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${RABBITMQ_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-rabbitmq}.loadbalancer.server.port=${RABBITMQ_PORT:-15672}"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.entrypoints=${RABBITMQ_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.rule=Host(`${RABBITMQ_DOMAIN:-rabbitmq.example.com}`) && PathPrefix(`${RABBITMQ_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.service=${APP_NAME:-rabbitmq}"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.middlewares=${RABBITMQ_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.tls=${RABBITMQ_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-rabbitmq}.tls.certresolver=${RABBITMQ_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${RABBITMQ_HOMEPAGE_GROUP:-Infrastructure}"
        - "homepage.name=${RABBITMQ_HOMEPAGE_NAME:-RabbitMQ}"
        - "homepage.icon=${RABBITMQ_HOMEPAGE_ICON:-rabbitmq.png}"
        - "homepage.href=${RABBITMQ_APP_URL:-http://rabbitmq.example.com/}"
        - "homepage.description=${RABBITMQ_HOMEPAGE_DESCRIPTION:-Message broker}"
        - "homepage.siteMonitor=${RABBITMQ_HOMEPAGE_SITEMONITOR:-http://rabbitmq:15672}"
    labels:
      - "traefik.enable=${RABBITMQ_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-rabbitmq}.loadbalancer.server.port=${RABBITMQ_PORT:-15672}"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.entrypoints=${RABBITMQ_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.rule=Host(`${RABBITMQ_DOMAIN:-rabbitmq.example.com}`) && PathPrefix(`${RABBITMQ_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.service=${APP_NAME:-rabbitmq}"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.middlewares=${RABBITMQ_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.tls=${RABBITMQ_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-rabbitmq}.tls.certresolver=${RABBITMQ_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${RABBITMQ_HOMEPAGE_GROUP:-Infrastructure}"
      - "homepage.name=${RABBITMQ_HOMEPAGE_NAME:-RabbitMQ}"
      - "homepage.icon=${RABBITMQ_HOMEPAGE_ICON:-rabbitmq.png}"
      - "homepage.href=${RABBITMQ_APP_URL:-http://rabbitmq.example.com/}"
      - "homepage.description=${RABBITMQ_HOMEPAGE_DESCRIPTION:-Message broker}"
      - "homepage.siteMonitor=${RABBITMQ_HOMEPAGE_SITEMONITOR:-http://rabbitmq:15672}"
