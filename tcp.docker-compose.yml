# TCP Traefik — long-form ports. Requires an existing Traefik TCP entrypoint (e.g. postgres, mysql).
networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-app-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${APP_DATA_VOLUME_NAME:-app_data}
    external: ${APP_DATA_VOLUME_EXTERNAL:-false}
    driver: ${APP_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${APP_DATA_VOLUME_TYPE:-}
      o: ${APP_DATA_VOLUME_OPTS:-}
      device: ${APP_DATA_VOLUME_PATH:-}

services:
  app:
    image: ${APP_IMAGE:-docker.io/library/alpine:latest}
    restart: ${APP_RESTART:-unless-stopped}
    privileged: ${APP_PRIVILEGED:-false}
    env_file:
      - ${APP_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    volumes:
      - data:${APP_DATA_VOLUME_DIR:-/data}:z
    networks:
      default:
        aliases:
          - ${APP_NAME:-app}
          - ${APP_ALIAS:-app}
    ports:
      - published: ${APP_PUBLISHED_PORT:-}
        target: ${APP_PORT:-}
        mode: ${APP_PORT_MODE:-ingress}
        protocol: ${APP_PORT_PROTOCOL:-tcp}
    deploy:
      mode: ${APP_DEPLOY_MODE:-replicated}
      replicas: ${APP_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${APP_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${APP_RESTART_POLICY_CONDITION:-any}
        delay: ${APP_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${APP_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${APP_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.tcp.services.${APP_NAME:-app}.loadbalancer.server.port=${APP_PORT:-5432}"
        - "traefik.tcp.routers.${APP_NAME:-app}.entrypoints=${APP_ENTRYPOINTS:-postgres}"
        - "traefik.tcp.routers.${APP_NAME:-app}.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.${APP_NAME:-app}.service=${APP_NAME:-app}"
        - "traefik.tcp.routers.${APP_NAME:-app}.tls=${APP_TLS_ENABLED:-false}"
        - "traefik.tcp.routers.${APP_NAME:-app}.tls.certresolver=${APP_TLS_CERTRESOLVER:-none}"
        - "homepage.enabled=${APP_HOMEPAGE_ENABLED:-true}"
        - "homepage.group=${APP_HOMEPAGE_GROUP:-Infrastructure}"
        - "homepage.name=${APP_HOMEPAGE_NAME:-App}"
        - "homepage.icon=${APP_HOMEPAGE_ICON:-app.png}"
        - "homepage.href=${APP_APP_URL:-}"
        - "homepage.description=${APP_HOMEPAGE_DESCRIPTION:-Application dashboard}"
        - "homepage.siteMonitor=${APP_HOMEPAGE_SITEMONITOR:-}"
        - "homepage.ping=${APP_HOMEPAGE_PING:-}"
    labels:
      - "traefik.enable=${APP_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.tcp.services.${APP_NAME:-app}.loadbalancer.server.port=${APP_PORT:-5432}"
      - "traefik.tcp.routers.${APP_NAME:-app}.entrypoints=${APP_ENTRYPOINTS:-postgres}"
      - "traefik.tcp.routers.${APP_NAME:-app}.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.${APP_NAME:-app}.service=${APP_NAME:-app}"
      - "traefik.tcp.routers.${APP_NAME:-app}.tls=${APP_TLS_ENABLED:-false}"
      - "traefik.tcp.routers.${APP_NAME:-app}.tls.certresolver=${APP_TLS_CERTRESOLVER:-none}"
      - "homepage.enabled=${APP_HOMEPAGE_ENABLED:-true}"
      - "homepage.group=${APP_HOMEPAGE_GROUP:-Infrastructure}"
      - "homepage.name=${APP_HOMEPAGE_NAME:-App}"
      - "homepage.icon=${APP_HOMEPAGE_ICON:-app.png}"
      - "homepage.href=${APP_APP_URL:-}"
      - "homepage.description=${APP_HOMEPAGE_DESCRIPTION:-Application dashboard}"
      - "homepage.siteMonitor=${APP_HOMEPAGE_SITEMONITOR:-}"
      - "homepage.ping=${APP_HOMEPAGE_PING:-}"
