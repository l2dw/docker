networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-s3-client-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${S3_CLIENT_DATA_VOLUME_NAME:-s3_client_data}
    external: ${S3_CLIENT_DATA_VOLUME_EXTERNAL:-false}
    driver: ${S3_CLIENT_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${S3_CLIENT_DATA_VOLUME_TYPE:-}
      o: ${S3_CLIENT_DATA_VOLUME_OPTS:-}
      device: ${S3_CLIENT_DATA_VOLUME_PATH:-}
  config:
    name: ${S3_CLIENT_CONFIG_VOLUME_NAME:-s3_client_config}
    external: ${S3_CLIENT_CONFIG_VOLUME_EXTERNAL:-false}
    driver: ${S3_CLIENT_CONFIG_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${S3_CLIENT_CONFIG_VOLUME_TYPE:-}
      o: ${S3_CLIENT_CONFIG_VOLUME_OPTS:-}
      device: ${S3_CLIENT_CONFIG_VOLUME_PATH:-}

services:
  s3-client:
    image: ${S3_CLIENT_IMAGE:-docker.io/minio/mc:latest}
    restart: ${S3_CLIENT_RESTART:-unless-stopped}
    privileged: ${S3_CLIENT_PRIVILEGED:-false}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    env_file:
      - ${S3_CLIENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    volumes:
      - data:${S3_CLIENT_DATA_VOLUME_DIR:-/data}:z
      - config:${S3_CLIENT_CONFIG_VOLUME_DIR:-/root/.mc}:z
    deploy:
      mode: ${S3_CLIENT_DEPLOY_MODE:-replicated}
      replicas: ${S3_CLIENT_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${S3_CLIENT_MEMORY_LIMIT:-256M}
      placement:
        constraints:
          - ${S3_CLIENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${S3_CLIENT_RESTART_POLICY_CONDITION:-any}
        delay: ${S3_CLIENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${S3_CLIENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${S3_CLIENT_HOMEPAGE_GROUP:-Storage}"
        - "homepage.name=${S3_CLIENT_HOMEPAGE_NAME:-S3 Client}"
        - "homepage.icon=${S3_CLIENT_HOMEPAGE_ICON:-s3-client.png}"
        - "homepage.href=${S3_CLIENT_HOMEPAGE_URL:-}"
        - "homepage.description=${S3_CLIENT_HOMEPAGE_DESCRIPTION:-S3 mc CLI sidecar}"
        - "homepage.siteMonitor=${S3_CLIENT_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${S3_CLIENT_HOMEPAGE_GROUP:-Storage}"
      - "homepage.name=${S3_CLIENT_HOMEPAGE_NAME:-S3 Client}"
      - "homepage.icon=${S3_CLIENT_HOMEPAGE_ICON:-s3-client.png}"
      - "homepage.href=${S3_CLIENT_HOMEPAGE_URL:-}"
      - "homepage.description=${S3_CLIENT_HOMEPAGE_DESCRIPTION:-S3 mc CLI sidecar}"
      - "homepage.siteMonitor=${S3_CLIENT_HOMEPAGE_SITEMONITOR:-}"
