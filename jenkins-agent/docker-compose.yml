    #     homepage.group: ${JENKINS_AGENT_HOMEPAGE_GROUP:-Infra}
    #     homepage.name: ${JENKINS_AGENT_HOMEPAGE_NAME:-Jenkins Agent}
    #     homepage.icon: ${JENKINS_AGENT_HOMEPAGE_ICON:-jenkins.png}
