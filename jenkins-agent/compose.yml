networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-jenkins-agent-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  home:
    name: ${JENKINS_AGENT_HOME_VOLUME_NAME:-jenkins_agent_home}
    external: ${JENKINS_AGENT_HOME_VOLUME_EXTERNAL:-false}
    driver: ${JENKINS_AGENT_HOME_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${JENKINS_AGENT_HOME_VOLUME_TYPE:-}
      o: ${JENKINS_AGENT_HOME_VOLUME_OPTS:-}
      device: ${JENKINS_AGENT_HOME_VOLUME_PATH:-}
  workdir:
    name: ${JENKINS_AGENT_WORKDIR_VOLUME_NAME:-jenkins_agent_workdir}
    external: ${JENKINS_AGENT_WORKDIR_VOLUME_EXTERNAL:-false}
    driver: ${JENKINS_AGENT_WORKDIR_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${JENKINS_AGENT_WORKDIR_VOLUME_TYPE:-}
      o: ${JENKINS_AGENT_WORKDIR_VOLUME_OPTS:-}
      device: ${JENKINS_AGENT_WORKDIR_VOLUME_PATH:-}

services:
  jenkins-agent:
    image: ${JENKINS_AGENT_IMAGE:-docker.io/jenkins/inbound-agent:lts}
    restart: ${JENKINS_AGENT_RESTART:-unless-stopped}
    privileged: ${JENKINS_AGENT_PRIVILEGED:-true}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${JENKINS_AGENT_USER_UID:-1000}
        USER_GID: ${JENKINS_AGENT_USER_GID:-1000}
        USER_NAME: ${JENKINS_AGENT_USER_NAME:-jenkins}
        DOCKER_VERSION: ${DOCKER_VERSION:-27.3.1}
    userns_mode: ${JENKINS_AGENT_USERNS_MODE:-keep-id}
    security_opt:
      - label=disable
    env_file:
      - ${JENKINS_AGENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - JENKINS_URL=${JENKINS_SERVER_URL:-https://jenkins.example.com/jenkins}
      - JENKINS_AGENT_NAME=${JENKINS_AGENT_NODE_NAME:-}
      - JENKINS_SECRET=${JENKINS_AGENT_NODE_SECRET:-}
      - JENKINS_AGENT_WORKDIR=${JENKINS_AGENT_NODE_WORKDIR:-/var/jenkins_agent}
      - JENKINS_WEB_SOCKET=${JENKINS_AGENT_WEB_SOCKET:-true}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - home:${JENKINS_AGENT_HOME_VOLUME_DIR:-/home/jenkins}:z
      - workdir:${JENKINS_AGENT_WORKDIR_VOLUME_DIR:-/var/jenkins_agent}:z
    deploy:
      mode: ${JENKINS_AGENT_DEPLOY_MODE:-replicated}
      replicas: ${JENKINS_AGENT_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${JENKINS_AGENT_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${JENKINS_AGENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${JENKINS_AGENT_RESTART_POLICY_CONDITION:-any}
        delay: ${JENKINS_AGENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${JENKINS_AGENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${JENKINS_AGENT_HOMEPAGE_GROUP:-CI}"
        - "homepage.name=${JENKINS_AGENT_HOMEPAGE_NAME:-Jenkins Agent}"
        - "homepage.icon=${JENKINS_AGENT_HOMEPAGE_ICON:-jenkins.png}"
        - "homepage.href=${JENKINS_AGENT_HOMEPAGE_URL:-}"
        - "homepage.description=${JENKINS_AGENT_HOMEPAGE_DESCRIPTION:-Jenkins build agent}"
        - "homepage.siteMonitor=${JENKINS_AGENT_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${JENKINS_AGENT_HOMEPAGE_GROUP:-CI}"
      - "homepage.name=${JENKINS_AGENT_HOMEPAGE_NAME:-Jenkins Agent}"
      - "homepage.icon=${JENKINS_AGENT_HOMEPAGE_ICON:-jenkins.png}"
      - "homepage.href=${JENKINS_AGENT_HOMEPAGE_URL:-}"
      - "homepage.description=${JENKINS_AGENT_HOMEPAGE_DESCRIPTION:-Jenkins build agent}"
      - "homepage.siteMonitor=${JENKINS_AGENT_HOMEPAGE_SITEMONITOR:-}"
