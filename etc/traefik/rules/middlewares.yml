http:
  middlewares:
    # Proto/port only — do not set X-Forwarded-For / X-Real-Ip (Traefik owns the real client IP).
    forward-https-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Port: "443"
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
    # Traefik → ModSecurity CRS (service `waf` / alias `dokploy-waf`). Also on Traefik labels;
    # entrypoints use DOKPLOY_TRAEFIK_WEB*_MIDDLEWARES (default waf).
    # CRS apache listens on 8080. Its BACKEND must be dokploy-waf-dummy (or another real upstream)
    # — empty/localhost:80 inside the WAF container causes Traefik 503.
    waf:
      plugin:
        traefik-modsecurity-plugin:
          modSecurityUrl: http://dokploy-waf:8080
          maxBodySize: 10485760
          timeoutMillis: 2000
