# Custom ModSecurity exclusions / rules executed BEFORE the OWASP CRS.
# Mounted into the WAF container at:
#   /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
# Examples:
#   SecRuleRemoveById 920100
#   SecRule REQUEST_URI "@beginsWith /dokploy" "id:1001,phase:1,pass,nolog,ctl:ruleEngine=Off"

