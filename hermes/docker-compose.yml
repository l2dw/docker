networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-hermes-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  hermes-home:
    name: ${HERMES_HOME_VOLUME_NAME:-hermes-home}
    external: ${HERMES_HOME_VOLUME_EXTERNAL:-false}
  hermes-agent-src:
    name: ${HERMES_AGENT_SRC_VOLUME_NAME:-hermes-agent-src}
    external: ${HERMES_AGENT_SRC_VOLUME_EXTERNAL:-false}
  hermes-workspace:
    name: ${HERMES_WORKSPACE_VOLUME_NAME:-hermes-workspace}
    external: ${HERMES_WORKSPACE_VOLUME_EXTERNAL:-false}

services:
  agent:
    image: ${HERMES_AGENT_IMAGE:-nousresearch/hermes-agent:latest}
    restart: ${HERMES_AGENT_RESTART:-unless-stopped}
    privileged: ${HERMES_AGENT_PRIVILEGED:-false}
    command: gateway run
    env_file:
      - ${HERMES_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
    volumes:
      - ${HERMES_HOME_DIR:-hermes-home}:/home/hermes/.hermes
      - ${HERMES_AGENT_SRC_DIR:-hermes-agent-src}:/opt/hermes
    deploy:
      mode: ${HERMES_AGENT_DEPLOY_MODE:-replicated}
      replicas: 1
      placement:
        constraints:
          - ${HERMES_AGENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HERMES_AGENT_MEMORY_LIMIT:-2G}

  dashboard:
    image: ${HERMES_DASHBOARD_IMAGE:-nousresearch/hermes-agent:latest}
    restart: ${HERMES_DASHBOARD_RESTART:-unless-stopped}
    privileged: ${HERMES_DASHBOARD_PRIVILEGED:-false}
    command: dashboard --host 0.0.0.0 --no-open
    env_file:
      - ${HERMES_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - GATEWAY_HEALTH_URL=${HERMES_GATEWAY_URL:-http://agent:8642}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      - HERMES_DASHBOARD_PUBLIC_URL=${HERMES_DASHBOARD_APP_URL:-}
    volumes:
      - ${HERMES_HOME_DIR:-hermes-home}:/home/hermes/.hermes
    depends_on:
      - agent
    deploy:
      mode: ${HERMES_DASHBOARD_DEPLOY_MODE:-replicated}
      replicas: 1
      placement:
        constraints:
          - ${HERMES_DASHBOARD_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HERMES_DASHBOARD_MEMORY_LIMIT:-512M}
      labels:
        - "traefik.enable=${HERMES_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-hermes}-dashboard.loadbalancer.server.port=9119"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.entrypoints=${HERMES_DASHBOARD_ENTRYPOINTS:-websecure}"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.rule=Host(`${HERMES_DASHBOARD_DOMAIN:-hermes-dashboard.example.com}`) && PathPrefix(`${HERMES_DASHBOARD_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.service=${APP_NAME:-hermes}-dashboard"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.middlewares=${HERMES_DASHBOARD_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.tls=${HERMES_DASHBOARD_TLS_ENABLED:-true}"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.tls.certresolver=${HERMES_DASHBOARD_TLS_CERTRESOLVER:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.entrypoints=web"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.rule=Host(`${HERMES_DASHBOARD_DOMAIN:-hermes-dashboard.example.com}`) && PathPrefix(`${HERMES_DASHBOARD_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.middlewares=${HERMES_DASHBOARD_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
        - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.service=${APP_NAME:-hermes}-dashboard"
        - "homepage.group=${HERMES_HOMEPAGE_GROUP:-Apps}"
        - "homepage.name=${HERMES_DASHBOARD_HOMEPAGE_NAME:-Hermes Dashboard}"
        - "homepage.icon=${HERMES_DASHBOARD_HOMEPAGE_ICON:-hermes.png}"
        - "homepage.href=${HERMES_DASHBOARD_APP_URL:-https://hermes-dashboard.example.com}"
        - "homepage.description=${HERMES_DASHBOARD_HOMEPAGE_DESCRIPTION:-Hermes monitoring dashboard}"
        - "homepage.siteMonitor=${HERMES_DASHBOARD_HOMEPAGE_SITEMONITOR:-http://dashboard:9119}"
    labels:
      - "traefik.enable=${HERMES_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-hermes}-dashboard.loadbalancer.server.port=9119"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.entrypoints=${HERMES_DASHBOARD_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.rule=Host(`${HERMES_DASHBOARD_DOMAIN:-hermes-dashboard.example.com}`) && PathPrefix(`${HERMES_DASHBOARD_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.service=${APP_NAME:-hermes}-dashboard"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.middlewares=${HERMES_DASHBOARD_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.tls=${HERMES_DASHBOARD_TLS_ENABLED:-true}"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard.tls.certresolver=${HERMES_DASHBOARD_TLS_CERTRESOLVER:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.rule=Host(`${HERMES_DASHBOARD_DOMAIN:-hermes-dashboard.example.com}`) && PathPrefix(`${HERMES_DASHBOARD_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.middlewares=${HERMES_DASHBOARD_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
      - "traefik.http.routers.${APP_NAME:-hermes}-dashboard-http.service=${APP_NAME:-hermes}-dashboard"

  webui:
    image: ${HERMES_WEBUI_IMAGE:-ghcr.io/nesquena/hermes-webui:latest}
    restart: ${HERMES_WEBUI_RESTART:-unless-stopped}
    privileged: ${HERMES_WEBUI_PRIVILEGED:-false}
    env_file:
      - ${HERMES_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - HERMES_API_URL=${HERMES_GATEWAY_URL:-http://agent:8642}
      - HERMES_WEBUI_GATEWAY_API_KEY=${HERMES_API_SERVER_KEY:-}
      - HERMES_WEBUI_PASSWORD=${HERMES_WEBUI_PASSWORD:-}
      - WANTED_UID=${HERMES_UID:-1000}
      - WANTED_GID=${HERMES_GID:-1000}
    volumes:
      - ${HERMES_HOME_DIR:-hermes-home}:/home/hermeswebui/.hermes
      - ${HERMES_AGENT_SRC_DIR:-hermes-agent-src}:/home/hermeswebui/.hermes/hermes-agent:ro
      - ${HERMES_WORKSPACE_DIR:-hermes-workspace}:/workspace
    depends_on:
      - agent
    deploy:
      mode: ${HERMES_WEBUI_DEPLOY_MODE:-replicated}
      replicas: 1
      placement:
        constraints:
          - ${HERMES_WEBUI_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HERMES_WEBUI_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${HERMES_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-hermes}.loadbalancer.server.port=8787"
        - "traefik.http.routers.${APP_NAME:-hermes}.entrypoints=${HERMES_ENTRYPOINTS:-websecure}"
        - "traefik.http.routers.${APP_NAME:-hermes}.rule=Host(`${HERMES_DOMAIN:-hermes.example.com}`) && PathPrefix(`${HERMES_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}.service=${APP_NAME:-hermes}"
        - "traefik.http.routers.${APP_NAME:-hermes}.middlewares=${HERMES_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}.tls=${HERMES_TLS_ENABLED:-true}"
        - "traefik.http.routers.${APP_NAME:-hermes}.tls.certresolver=${HERMES_TLS_CERTRESOLVER:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}-http.entrypoints=web"
        - "traefik.http.routers.${APP_NAME:-hermes}-http.rule=Host(`${HERMES_DOMAIN:-hermes.example.com}`) && PathPrefix(`${HERMES_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}-http.middlewares=${HERMES_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
        - "traefik.http.routers.${APP_NAME:-hermes}-http.service=${APP_NAME:-hermes}"
        - "homepage.group=${HERMES_HOMEPAGE_GROUP:-Apps}"
        - "homepage.name=${HERMES_HOMEPAGE_NAME:-Hermes}"
        - "homepage.icon=${HERMES_HOMEPAGE_ICON:-hermes.png}"
        - "homepage.href=${HERMES_APP_URL:-https://hermes.example.com}"
        - "homepage.description=${HERMES_HOMEPAGE_DESCRIPTION:-Hermes Agent Web UI}"
        - "homepage.siteMonitor=${HERMES_HOMEPAGE_SITEMONITOR:-http://webui:8787}"
    labels:
      - "traefik.enable=${HERMES_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-hermes}.loadbalancer.server.port=8787"
      - "traefik.http.routers.${APP_NAME:-hermes}.entrypoints=${HERMES_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${APP_NAME:-hermes}.rule=Host(`${HERMES_DOMAIN:-hermes.example.com}`) && PathPrefix(`${HERMES_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}.service=${APP_NAME:-hermes}"
      - "traefik.http.routers.${APP_NAME:-hermes}.middlewares=${HERMES_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}.tls=${HERMES_TLS_ENABLED:-true}"
      - "traefik.http.routers.${APP_NAME:-hermes}.tls.certresolver=${HERMES_TLS_CERTRESOLVER:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-hermes}-http.rule=Host(`${HERMES_DOMAIN:-hermes.example.com}`) && PathPrefix(`${HERMES_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}-http.middlewares=${HERMES_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
      - "traefik.http.routers.${APP_NAME:-hermes}-http.service=${APP_NAME:-hermes}"

  workspace:
    image: ${HERMES_WORKSPACE_IMAGE:-ghcr.io/outsourc-e/hermes-workspace:latest}
    restart: ${HERMES_WORKSPACE_RESTART:-unless-stopped}
    privileged: ${HERMES_WORKSPACE_PRIVILEGED:-false}
    user: "${HERMES_UID:-1000}:${HERMES_GID:-1000}"
    env_file:
      - ${HERMES_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - HERMES_HOME=/home/workspace/.hermes
      - HERMES_WORKSPACE_DIR=/workspace
      - HERMES_API_URL=${HERMES_GATEWAY_URL:-http://agent:8642}
      - HERMES_DASHBOARD_URL=${HERMES_DASHBOARD_INTERNAL_URL:-http://dashboard:9119}
      - HERMES_API_TOKEN=${HERMES_API_SERVER_KEY:-}
      - HERMES_PASSWORD=${HERMES_WORKSPACE_PASSWORD:-}
      - COOKIE_SECURE=${HERMES_WORKSPACE_COOKIE_SECURE:-true}
      - TRUST_PROXY=${HERMES_WORKSPACE_TRUST_PROXY:-true}
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ${HERMES_HOME_DIR:-hermes-home}:/home/workspace/.hermes
      - ${HERMES_WORKSPACE_DIR:-hermes-workspace}:/workspace
    depends_on:
      - agent
      - dashboard
    deploy:
      mode: ${HERMES_WORKSPACE_DEPLOY_MODE:-replicated}
      replicas: 1
      placement:
        constraints:
          - ${HERMES_WORKSPACE_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HERMES_WORKSPACE_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${HERMES_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-hermes}-workspace.loadbalancer.server.port=3000"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.entrypoints=${HERMES_WORKSPACE_ENTRYPOINTS:-websecure}"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.rule=Host(`${HERMES_WORKSPACE_DOMAIN:-hermes-workspace.example.com}`) && PathPrefix(`${HERMES_WORKSPACE_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.service=${APP_NAME:-hermes}-workspace"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.middlewares=${HERMES_WORKSPACE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.tls=${HERMES_WORKSPACE_TLS_ENABLED:-true}"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace.tls.certresolver=${HERMES_WORKSPACE_TLS_CERTRESOLVER:-}"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.entrypoints=web"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.rule=Host(`${HERMES_WORKSPACE_DOMAIN:-hermes-workspace.example.com}`) && PathPrefix(`${HERMES_WORKSPACE_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.middlewares=${HERMES_WORKSPACE_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
        - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.service=${APP_NAME:-hermes}-workspace"
        - "homepage.group=${HERMES_HOMEPAGE_GROUP:-Apps}"
        - "homepage.name=${HERMES_WORKSPACE_HOMEPAGE_NAME:-Hermes Workspace}"
        - "homepage.icon=${HERMES_WORKSPACE_HOMEPAGE_ICON:-hermes.png}"
        - "homepage.href=${HERMES_WORKSPACE_APP_URL:-https://hermes-workspace.example.com}"
        - "homepage.description=${HERMES_WORKSPACE_HOMEPAGE_DESCRIPTION:-Hermes IDE-style workspace}"
        - "homepage.siteMonitor=${HERMES_WORKSPACE_HOMEPAGE_SITEMONITOR:-http://workspace:3000}"
    labels:
      - "traefik.enable=${HERMES_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-hermes}-workspace.loadbalancer.server.port=3000"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.entrypoints=${HERMES_WORKSPACE_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.rule=Host(`${HERMES_WORKSPACE_DOMAIN:-hermes-workspace.example.com}`) && PathPrefix(`${HERMES_WORKSPACE_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.service=${APP_NAME:-hermes}-workspace"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.middlewares=${HERMES_WORKSPACE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.tls=${HERMES_WORKSPACE_TLS_ENABLED:-true}"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace.tls.certresolver=${HERMES_WORKSPACE_TLS_CERTRESOLVER:-}"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.rule=Host(`${HERMES_WORKSPACE_DOMAIN:-hermes-workspace.example.com}`) && PathPrefix(`${HERMES_WORKSPACE_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.middlewares=${HERMES_WORKSPACE_HTTP_MIDDLEWARES:-redirect-to-https@swarm}"
      - "traefik.http.routers.${APP_NAME:-hermes}-workspace-http.service=${APP_NAME:-hermes}-workspace"
