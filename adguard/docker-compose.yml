networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-adguard-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  conf:
    name: ${ADGUARD_CONF_VOLUME_NAME:-adguard_conf}
    external: ${ADGUARD_CONF_VOLUME_EXTERNAL:-false}
    driver: ${ADGUARD_CONF_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${ADGUARD_CONF_VOLUME_TYPE:-}
      o: ${ADGUARD_CONF_VOLUME_OPTS:-}
      device: ${ADGUARD_CONF_VOLUME_PATH:-}
  work:
    name: ${ADGUARD_WORK_VOLUME_NAME:-adguard_work}
    external: ${ADGUARD_WORK_VOLUME_EXTERNAL:-false}
    driver: ${ADGUARD_WORK_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${ADGUARD_WORK_VOLUME_TYPE:-}
      o: ${ADGUARD_WORK_VOLUME_OPTS:-}
      device: ${ADGUARD_WORK_VOLUME_PATH:-}

services:
  adguard:
    image: ${ADGUARD_IMAGE:-docker.io/adguard/adguardhome:v0.107.79}
    restart: ${ADGUARD_RESTART:-unless-stopped}
    privileged: ${ADGUARD_PRIVILEGED:-false}
    env_file:
      - ${ADGUARD_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    ports:
      - target: 53
        published: ${ADGUARD_PORT_DNS_TCP:-53}
        protocol: tcp
        mode: ${ADGUARD_PORT_DNS_MODE:-host}
      - target: 53
        published: ${ADGUARD_PORT_DNS_UDP:-53}
        protocol: udp
        mode: ${ADGUARD_PORT_DNS_MODE:-host}
      - target: 3000
        published: ${ADGUARD_PORT_SETUP:-3053}
        protocol: tcp
        mode: ${ADGUARD_PORT_SETUP_MODE:-host}
    volumes:
      - conf:${ADGUARD_CONF_VOLUME_DIR:-/opt/adguardhome/conf}:z
      - work:${ADGUARD_WORK_VOLUME_DIR:-/opt/adguardhome/work}:z
    deploy:
      mode: ${ADGUARD_DEPLOY_MODE:-replicated}
      replicas: ${ADGUARD_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${ADGUARD_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${ADGUARD_PLACEMENT_CONSTRAINTS:-node.role==manager}
      restart_policy:
        condition: ${ADGUARD_RESTART_POLICY_CONDITION:-any}
        delay: ${ADGUARD_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${ADGUARD_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${ADGUARD_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-adguard}.loadbalancer.server.port=${ADGUARD_PORT:-80}"
        - "traefik.http.routers.${APP_NAME:-adguard}.entrypoints=${ADGUARD_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-adguard}.rule=Host(`${ADGUARD_DOMAIN:-adguard.example.com}`) && PathPrefix(`${ADGUARD_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-adguard}.service=${APP_NAME:-adguard}"
        - "traefik.http.routers.${APP_NAME:-adguard}.middlewares=${ADGUARD_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-adguard}.tls=${ADGUARD_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-adguard}.tls.certresolver=${ADGUARD_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${ADGUARD_HOMEPAGE_GROUP:-Infra}"
        - "homepage.name=${ADGUARD_HOMEPAGE_NAME:-AdGuard Home}"
        - "homepage.icon=${ADGUARD_HOMEPAGE_ICON:-adguard.png}"
        - "homepage.href=${ADGUARD_HOMEPAGE_URL:-}"
        - "homepage.description=${ADGUARD_HOMEPAGE_DESCRIPTION:-Network-wide ad blocking DNS}"
        - "homepage.siteMonitor=${ADGUARD_HOMEPAGE_SITEMONITOR:-http://adguard:80}"
    labels:
      - "traefik.enable=${ADGUARD_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-adguard}.loadbalancer.server.port=${ADGUARD_PORT:-80}"
      - "traefik.http.routers.${APP_NAME:-adguard}.entrypoints=${ADGUARD_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-adguard}.rule=Host(`${ADGUARD_DOMAIN:-adguard.example.com}`) && PathPrefix(`${ADGUARD_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-adguard}.service=${APP_NAME:-adguard}"
      - "traefik.http.routers.${APP_NAME:-adguard}.middlewares=${ADGUARD_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-adguard}.tls=${ADGUARD_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-adguard}.tls.certresolver=${ADGUARD_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${ADGUARD_HOMEPAGE_GROUP:-Infra}"
      - "homepage.name=${ADGUARD_HOMEPAGE_NAME:-AdGuard Home}"
      - "homepage.icon=${ADGUARD_HOMEPAGE_ICON:-adguard.png}"
      - "homepage.href=${ADGUARD_HOMEPAGE_URL:-}"
      - "homepage.description=${ADGUARD_HOMEPAGE_DESCRIPTION:-Network-wide ad blocking DNS}"
      - "homepage.siteMonitor=${ADGUARD_HOMEPAGE_SITEMONITOR:-http://adguard:80}"
