networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-rustfs-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${RUSTFS_DATA_VOLUME_NAME:-rustfs_data}
    external: ${RUSTFS_DATA_VOLUME_EXTERNAL:-false}
    driver: ${RUSTFS_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${RUSTFS_DATA_VOLUME_TYPE:-}
      o: ${RUSTFS_DATA_VOLUME_OPTS:-}
      device: ${RUSTFS_DATA_VOLUME_PATH:-}
  rustfs-logs:
    name: ${RUSTFS_LOGS_VOLUME_NAME:-rustfs-logs}
    external: ${RUSTFS_LOGS_VOLUME_EXTERNAL:-false}

services:
  rustfs:
    image: ${RUSTFS_IMAGE:-docker.io/rustfs/rustfs:1.0.0}
    # Volumes come from RUSTFS_VOLUMES (default /data = SNSD). Do not set command — it would override env.
    restart: ${RUSTFS_RESTART:-unless-stopped}
    privileged: ${RUSTFS_PRIVILEGED:-false}
    env_file:
      - ${RUSTFS_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
      - RUSTFS_VOLUMES=${RUSTFS_VOLUMES:-/data}
    volumes:
      - data:${RUSTFS_DATA_VOLUME_DIR:-/data}:z
      - ${RUSTFS_LOGS_DIR:-rustfs-logs}:${RUSTFS_LOGS_CONTAINER_PATH:-/var/log/rustfs}
    deploy:
      mode: ${RUSTFS_DEPLOY_MODE:-replicated}
      replicas: ${RUSTFS_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${RUSTFS_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${RUSTFS_RESTART_POLICY_CONDITION:-any}
        delay: 5s
      resources:
        limits:
          memory: ${RUSTFS_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${RUSTFS_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.entrypoints=${RUSTFS_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.rule=Host(`${RUSTFS_S3_DOMAIN:-s3.example.com}`)"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.service=${APP_NAME:-rustfs}-s3"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.middlewares=${RUSTFS_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.tls=${RUSTFS_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-s3.tls.certresolver=${RUSTFS_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.${APP_NAME:-rustfs}-s3.loadbalancer.server.port=9000"
        - "traefik.http.services.${APP_NAME:-rustfs}-s3.loadbalancer.passhostheader=true"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.entrypoints=${RUSTFS_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.rule=Host(`${RUSTFS_CONSOLE_DOMAIN:-s3.example.com}`) && (PathPrefix(`${RUSTFS_CONSOLE_PATH:-/rustfs}`) || PathPrefix(`/browser`))"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.service=${APP_NAME:-rustfs}-console"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.middlewares=${RUSTFS_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.tls=${RUSTFS_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-rustfs}-console.tls.certresolver=${RUSTFS_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.${APP_NAME:-rustfs}-console.loadbalancer.server.port=9001"
        - "traefik.http.services.${APP_NAME:-rustfs}-console.loadbalancer.passhostheader=true"
        - "homepage.group=${RUSTFS_HOMEPAGE_GROUP:-Storage}"
        - "homepage.name=${RUSTFS_HOMEPAGE_NAME:-RustFS}"
        - "homepage.icon=${RUSTFS_HOMEPAGE_ICON:-rustfs.png}"
        - "homepage.href=${RUSTFS_HOMEPAGE_URL:-}"
        - "homepage.description=${RUSTFS_HOMEPAGE_DESCRIPTION:-S3-compatible object storage}"
        - "homepage.siteMonitor=${RUSTFS_HOMEPAGE_SITEMONITOR:-http://rustfs:9001/rustfs/console/health}"
    labels:
      - "traefik.enable=${RUSTFS_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.entrypoints=${RUSTFS_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.rule=Host(`${RUSTFS_S3_DOMAIN:-s3.example.com}`)"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.service=${APP_NAME:-rustfs}-s3"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.middlewares=${RUSTFS_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.tls=${RUSTFS_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-s3.tls.certresolver=${RUSTFS_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME:-rustfs}-s3.loadbalancer.server.port=9000"
      - "traefik.http.services.${APP_NAME:-rustfs}-s3.loadbalancer.passhostheader=true"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.entrypoints=${RUSTFS_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.rule=Host(`${RUSTFS_CONSOLE_DOMAIN:-s3.example.com}`) && (PathPrefix(`${RUSTFS_CONSOLE_PATH:-/rustfs}`) || PathPrefix(`/browser`))"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.service=${APP_NAME:-rustfs}-console"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.middlewares=${RUSTFS_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.tls=${RUSTFS_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-rustfs}-console.tls.certresolver=${RUSTFS_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME:-rustfs}-console.loadbalancer.server.port=9001"
      - "traefik.http.services.${APP_NAME:-rustfs}-console.loadbalancer.passhostheader=true"
      - "homepage.group=${RUSTFS_HOMEPAGE_GROUP:-Storage}"
      - "homepage.name=${RUSTFS_HOMEPAGE_NAME:-RustFS}"
      - "homepage.icon=${RUSTFS_HOMEPAGE_ICON:-rustfs.png}"
      - "homepage.href=${RUSTFS_HOMEPAGE_URL:-}"
      - "homepage.description=${RUSTFS_HOMEPAGE_DESCRIPTION:-S3-compatible object storage}"
      - "homepage.siteMonitor=${RUSTFS_HOMEPAGE_SITEMONITOR:-http://rustfs:9001/rustfs/console/health}"
