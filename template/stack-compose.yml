networks:
  default:
    name: ${TPL_NETWORK:-dokploy-network}
    external: ${TPL_NETWORK_EXTERNAL:-true}

volumes:
  tpl_data:
    name: ${TPL_DATA_VOLUME_NAME:-tpl_data}
    external: ${TPL_DATA_VOLUME_EXTERNAL:-false}
  tpl_logs:
    name: ${TPL_LOGS_VOLUME_NAME:-tpl_logs}
    external: ${TPL_LOGS_VOLUME_EXTERNAL:-false}

services:
  tpl:
    image: ${TPL_IMAGE:-tpl/tpl:latest}
    volumes:
      - ${TPL_DATA_DIR:-tpl_data}:/data
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    # networks:
    #   - default
    environment:
      - TZ
      - http_proxy
      - https_proxy
      - no_proxy
    ## Deploy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role==${TPL_PLACEMENT_CONSTRAINTS:-manager}
      labels:
        traefik.enable: "true"
        traefik.http.services.tpl.loadbalancer.server.port: 9000
        traefik.http.routers.tpl.entrypoints: ${TPL_TRAEFIK_ENTRYPOINTS:-web}
        traefik.http.routers.tpl.rule: Host(`${TPL_DOMAIN:-tpl.home}`) && PathPrefix(`${TPL_TRAEFIK_PATH_PREFIX:-/}`)
        traefik.http.routers.tpl.service: tpl
        traefik.http.routers.tpl.middlewares: "${TPL_TRAEFIK_MIDDLEWARES:-}"
        traefik.http.routers.tpl.tls: "${TPL_TRAEFIK_TLS_ENABLED:-false}"
        traefik.http.routers.tpl.tls.certresolver: ${TPL_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}
        ## Homepage configuration
        homepage.group: ${TPL_HOMEPAGE_GROUP:-Infra}
        homepage.name: ${TPL_HOMEPAGE_NAME:-TPL}
        homepage.icon: ${TPL_HOMEPAGE_ICON:-tpl.png}
        homepage.href: http://${TPL_DOMAIN:-tpl.home}
        homepage.description: ${TPL_HOMEPAGE_DESCRIPTION:-TPL is a platform for managing templates.}
        homepage.siteMonitor: ${TPL_HOMEPAGE_SITEMONITOR}
        homepage.ping: ${TPL_HOMEPAGE_PING}


