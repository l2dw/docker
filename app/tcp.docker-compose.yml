# TCP Traefik stack (Dokploy compose path: app/tcp.docker-compose.yml).
# Requires a Traefik static TCP entrypoint (e.g. mysql:":3306"). Rule is HostSNI(`*`).

networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-app-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${APP_DATA_VOLUME_NAME:-app_data}
    external: ${APP_DATA_VOLUME_EXTERNAL:-false}
    driver: ${APP_DATA_VOLUME_DRIVER:-local}
    # Empty type/o/device = normal Docker named volume. Set for bind or NFS — see README.
    driver_opts:
      type: ${APP_DATA_VOLUME_DRIVER_TYPE:-}
      o: ${APP_DATA_VOLUME_DRIVER_O:-}
      device: ${APP_DATA_VOLUME_DRIVER_DEVICE:-}

services:
  app:
    image: ${APP_IMAGE:-docker.io/library/alpine:latest}
    volumes:
      - ${APP_DATA_HOST_PATH:-data}:${APP_DATA_CONTAINER_PATH:-/data}:z
    env_file:
      - ${APP_ENV_FILE:-.env.example}
    networks:
      default:
        aliases:
          - ${APP_NAME:-app}
          - ${APP_ALIAS:-app}
    ports:
      - published: ${APP_PUBLISHED_PORT:-30000}
        target: ${APP_PORT:-3000}
        mode: ${APP_PORT_MODE:-ingress}
        protocol: ${APP_PORT_PROTOCOL:-tcp}
    deploy:
      mode: ${APP_DEPLOY_MODE:-replicated}
      replicas: ${APP_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${APP_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${APP_RESTART_POLICY_CONDITION:-any}
        delay: ${APP_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${APP_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${APP_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.tcp.services.${APP_NAME:-app}.loadbalancer.server.port=${APP_PORT:-3000}"
        - "traefik.tcp.routers.${APP_NAME:-app}.entrypoints=${APP_TRAEFIK_ENTRYPOINTS:-mysql}"
        - "traefik.tcp.routers.${APP_NAME:-app}.rule=HostSNI(`*`)"
        - "traefik.tcp.routers.${APP_NAME:-app}.service=${APP_TRAEFIK_SERVICE:-app}"
        - "traefik.tcp.routers.${APP_NAME:-app}.tls=${APP_TRAEFIK_TLS_ENABLED:-false}"
        - "traefik.tcp.routers.${APP_NAME:-app}.tls.certresolver=${APP_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
        ## Homepage configuration
        - "homepage.enabled=${APP_HOMEPAGE_ENABLED:-true}"
        - "homepage.group=${APP_HOMEPAGE_GROUP:-APP}"
        - "homepage.name=${APP_HOMEPAGE_NAME:-APP}"
        - "homepage.icon=${APP_HOMEPAGE_ICON:-app.png}"
        - "homepage.href=${APP_HOMEPAGE_URL:-}"
        - "homepage.description=${APP_HOMEPAGE_DESCRIPTION:-}"
        - "homepage.siteMonitor=${APP_HOMEPAGE_SITEMONITOR_URL:-}"
        - "homepage.ping=${APP_HOMEPAGE_PING:-}"
    labels:
      - "traefik.enable=${APP_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.tcp.services.${APP_NAME:-app}.loadbalancer.server.port=${APP_PORT:-3000}"
      - "traefik.tcp.routers.${APP_NAME:-app}.entrypoints=${APP_TRAEFIK_ENTRYPOINTS:-mysql}"
      - "traefik.tcp.routers.${APP_NAME:-app}.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.${APP_NAME:-app}.service=${APP_TRAEFIK_SERVICE:-app}"
      - "traefik.tcp.routers.${APP_NAME:-app}.tls=${APP_TRAEFIK_TLS_ENABLED:-false}"
      - "traefik.tcp.routers.${APP_NAME:-app}.tls.certresolver=${APP_TRAEFIK_TLS_CERTRESOLVER:-none}"
      ## Homepage configuration
      - "homepage.enabled=${APP_HOMEPAGE_ENABLED:-true}"
      - "homepage.group=${APP_HOMEPAGE_GROUP:-APP}"
      - "homepage.name=${APP_HOMEPAGE_NAME:-APP}"
      - "homepage.icon=${APP_HOMEPAGE_ICON:-app.png}"
      - "homepage.href=${APP_HOMEPAGE_URL:-}"
      - "homepage.description=${APP_HOMEPAGE_DESCRIPTION:-}"
      - "homepage.siteMonitor=${APP_HOMEPAGE_SITEMONITOR_URL:-}"
      - "homepage.ping=${APP_HOMEPAGE_PING:-}"
