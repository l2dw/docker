networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  meilisearch-data:
    name: ${MEILISEARCH_DATA_VOLUME_NAME:-meilisearch-data}
    external: ${MEILISEARCH_DATA_VOLUME_EXTERNAL:-false}

services:
  meilisearch:
    image: ${MEILISEARCH_IMAGE:-docker.io/getmeili/meilisearch:v1.37}
    restart: ${MEILISEARCH_RESTART:-unless-stopped}
    privileged: ${MEILISEARCH_PRIVILEGED:-false}
    env_file:
      - ${MEILISEARCH_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - MEILI_ENV=${MEILISEARCH_ENV:-production}
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-}
      - MEILI_NO_ANALYTICS=${MEILISEARCH_NO_ANALYTICS:-true}
      - MEILI_HTTP_ADDR=${MEILISEARCH_HTTP_ADDR:-0.0.0.0:7700}
    volumes:
      - ${MEILISEARCH_DATA_DIR:-meilisearch-data}:/meili_data
    networks:
      default:
        aliases:
          - ${MEILISEARCH_NETWORK_ALIAS:-meilisearch}
    deploy:
      mode: ${MEILISEARCH_DEPLOY_MODE:-replicated}
      replicas: ${MEILISEARCH_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${MEILISEARCH_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${MEILISEARCH_MEMORY_LIMIT:-512M}
      labels:
        - "traefik.enable=${MEILISEARCH_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.middlewares.stripprefix-meilisearch.stripprefix.prefixes=${MEILISEARCH_BASE_PATH:-/meilisearch}"
        - "traefik.http.routers.meilisearch.entrypoints=${MEILISEARCH_ENTRYPOINTS:-web}"
        - "traefik.http.routers.meilisearch.rule=Host(`${MEILISEARCH_DOMAIN:-meilisearch.example.com}`) && PathPrefix(`${MEILISEARCH_BASE_PATH:-/meilisearch}`)"
        - "traefik.http.routers.meilisearch.service=meilisearch"
        - "traefik.http.routers.meilisearch.middlewares=${MEILISEARCH_MIDDLEWARES:-stripprefix-meilisearch}"
        - "traefik.http.routers.meilisearch.tls=${MEILISEARCH_TLS_ENABLED:-false}"
        - "traefik.http.routers.meilisearch.tls.certresolver=${MEILISEARCH_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.meilisearch.loadbalancer.server.port=7700"
        - "traefik.http.services.meilisearch.loadbalancer.passhostheader=true"
        - "homepage.group=${MEILISEARCH_HOMEPAGE_GROUP:-Search}"
        - "homepage.name=${MEILISEARCH_HOMEPAGE_NAME:-Meilisearch}"
        - "homepage.icon=${MEILISEARCH_HOMEPAGE_ICON:-meilisearch.png}"
        - "homepage.href=${MEILISEARCH_APP_URL:-http://meilisearch.example.com/meilisearch}"
        - "homepage.description=${MEILISEARCH_HOMEPAGE_DESCRIPTION:-Search engine}"
        - "homepage.siteMonitor=${MEILISEARCH_HOMEPAGE_SITEMONITOR:-http://meilisearch:7700/health}"
    labels:
      - "traefik.enable=${MEILISEARCH_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.middlewares.stripprefix-meilisearch.stripprefix.prefixes=${MEILISEARCH_BASE_PATH:-/meilisearch}"
      - "traefik.http.routers.meilisearch.entrypoints=${MEILISEARCH_ENTRYPOINTS:-web}"
      - "traefik.http.routers.meilisearch.rule=Host(`${MEILISEARCH_DOMAIN:-meilisearch.example.com}`) && PathPrefix(`${MEILISEARCH_BASE_PATH:-/meilisearch}`)"
      - "traefik.http.routers.meilisearch.service=meilisearch"
      - "traefik.http.routers.meilisearch.middlewares=${MEILISEARCH_MIDDLEWARES:-stripprefix-meilisearch}"
      - "traefik.http.routers.meilisearch.tls=${MEILISEARCH_TLS_ENABLED:-false}"
      - "traefik.http.routers.meilisearch.tls.certresolver=${MEILISEARCH_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.meilisearch.loadbalancer.server.port=7700"
      - "traefik.http.services.meilisearch.loadbalancer.passhostheader=true"
      - "homepage.group=${MEILISEARCH_HOMEPAGE_GROUP:-Search}"
      - "homepage.name=${MEILISEARCH_HOMEPAGE_NAME:-Meilisearch}"
      - "homepage.icon=${MEILISEARCH_HOMEPAGE_ICON:-meilisearch.png}"
      - "homepage.href=${MEILISEARCH_APP_URL:-http://meilisearch.example.com/meilisearch}"
      - "homepage.description=${MEILISEARCH_HOMEPAGE_DESCRIPTION:-Search engine}"
      - "homepage.siteMonitor=${MEILISEARCH_HOMEPAGE_SITEMONITOR:-http://meilisearch:7700/health}"
