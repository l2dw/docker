networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-meilisearch-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${MEILISEARCH_DATA_VOLUME_NAME:-meilisearch_data}
    external: ${MEILISEARCH_DATA_VOLUME_EXTERNAL:-false}
    driver: ${MEILISEARCH_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${MEILISEARCH_DATA_VOLUME_TYPE:-}
      o: ${MEILISEARCH_DATA_VOLUME_OPTS:-}
      device: ${MEILISEARCH_DATA_VOLUME_PATH:-}

services:
  meilisearch:
    image: ${MEILISEARCH_IMAGE:-docker.io/getmeili/meilisearch:v1.37}
    restart: ${MEILISEARCH_RESTART:-unless-stopped}
    privileged: ${MEILISEARCH_PRIVILEGED:-false}
    env_file:
      - ${MEILISEARCH_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - MEILI_ENV=${MEILISEARCH_ENV:-production}
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-}
      - MEILI_NO_ANALYTICS=${MEILISEARCH_NO_ANALYTICS:-true}
      - MEILI_HTTP_ADDR=${MEILISEARCH_HTTP_ADDR:-0.0.0.0:7700}
    volumes:
      - data:${MEILISEARCH_DATA_VOLUME_DIR:-/meili_data}:z
    networks:
      default:
        aliases:
          - ${MEILISEARCH_NETWORK_ALIAS:-meilisearch}
    deploy:
      mode: ${MEILISEARCH_DEPLOY_MODE:-replicated}
      replicas: ${MEILISEARCH_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MEILISEARCH_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${MEILISEARCH_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${MEILISEARCH_RESTART_POLICY_CONDITION:-any}
        delay: ${MEILISEARCH_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${MEILISEARCH_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${MEILISEARCH_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.middlewares.${APP_NAME:-meilisearch}-strip.stripprefix.prefixes=${MEILISEARCH_BASE_PATH:-/}"
        - "traefik.http.services.${APP_NAME:-meilisearch}.loadbalancer.server.port=${MEILISEARCH_PORT:-7700}"
        - "traefik.http.services.${APP_NAME:-meilisearch}.loadbalancer.passhostheader=true"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.entrypoints=${MEILISEARCH_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.rule=Host(`${MEILISEARCH_DOMAIN:-meilisearch.example.com}`) && PathPrefix(`${MEILISEARCH_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.service=${APP_NAME:-meilisearch}"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.middlewares=${MEILISEARCH_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.tls=${MEILISEARCH_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-meilisearch}.tls.certresolver=${MEILISEARCH_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${MEILISEARCH_HOMEPAGE_GROUP:-Search}"
        - "homepage.name=${MEILISEARCH_HOMEPAGE_NAME:-Meilisearch}"
        - "homepage.icon=${MEILISEARCH_HOMEPAGE_ICON:-meilisearch.png}"
        - "homepage.href=${MEILISEARCH_HOMEPAGE_URL:-}"
        - "homepage.description=${MEILISEARCH_HOMEPAGE_DESCRIPTION:-Search engine}"
        - "homepage.siteMonitor=${MEILISEARCH_HOMEPAGE_SITEMONITOR:-http://meilisearch:7700/health}"
    labels:
      - "traefik.enable=${MEILISEARCH_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.middlewares.${APP_NAME:-meilisearch}-strip.stripprefix.prefixes=${MEILISEARCH_BASE_PATH:-/}"
      - "traefik.http.services.${APP_NAME:-meilisearch}.loadbalancer.server.port=${MEILISEARCH_PORT:-7700}"
      - "traefik.http.services.${APP_NAME:-meilisearch}.loadbalancer.passhostheader=true"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.entrypoints=${MEILISEARCH_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.rule=Host(`${MEILISEARCH_DOMAIN:-meilisearch.example.com}`) && PathPrefix(`${MEILISEARCH_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.service=${APP_NAME:-meilisearch}"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.middlewares=${MEILISEARCH_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.tls=${MEILISEARCH_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-meilisearch}.tls.certresolver=${MEILISEARCH_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${MEILISEARCH_HOMEPAGE_GROUP:-Search}"
      - "homepage.name=${MEILISEARCH_HOMEPAGE_NAME:-Meilisearch}"
      - "homepage.icon=${MEILISEARCH_HOMEPAGE_ICON:-meilisearch.png}"
      - "homepage.href=${MEILISEARCH_HOMEPAGE_URL:-}"
      - "homepage.description=${MEILISEARCH_HOMEPAGE_DESCRIPTION:-Search engine}"
      - "homepage.siteMonitor=${MEILISEARCH_HOMEPAGE_SITEMONITOR:-http://meilisearch:7700/health}"
