networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-mariadb-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${MARIADB_DATA_VOLUME_NAME:-mariadb_data}
    external: ${MARIADB_DATA_VOLUME_EXTERNAL:-false}
    driver: ${MARIADB_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${MARIADB_DATA_VOLUME_TYPE:-}
      o: ${MARIADB_DATA_VOLUME_OPTS:-}
      device: ${MARIADB_DATA_VOLUME_PATH:-}

services:
  mariadb:
    image: ${MARIADB_IMAGE:-docker.io/library/mariadb:11}
    restart: ${MARIADB_RESTART:-unless-stopped}
    privileged: ${MARIADB_PRIVILEGED:-false}
    env_file:
      - ${MARIADB_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-mariadb}
      - MARIADB_USER=${MARIADB_USER:-mariadb}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-}
    volumes:
      - data:${MARIADB_DATA_VOLUME_DIR:-/var/lib/mysql}:z
    ports:
      - target: ${MARIADB_PORT:-3306}
        published: ${MARIADB_PUBLISHED_PORT:-23306}
        protocol: ${MARIADB_PORT_PROTOCOL:-tcp}
        mode: ${MARIADB_PORT_MODE:-ingress}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: ${MARIADB_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${MARIADB_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MARIADB_HEALTHCHECK_RETRIES:-5}
      start_period: ${MARIADB_HEALTHCHECK_START_PERIOD:-30s}
    deploy:
      mode: ${MARIADB_DEPLOY_MODE:-replicated}
      replicas: ${MARIADB_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MARIADB_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${MARIADB_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${MARIADB_RESTART_POLICY_CONDITION:-any}
        delay: ${MARIADB_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${MARIADB_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${MARIADB_HOMEPAGE_GROUP:-Database}"
        - "homepage.name=${MARIADB_HOMEPAGE_NAME:-MariaDB}"
        - "homepage.icon=${MARIADB_HOMEPAGE_ICON:-mariadb.png}"
        - "homepage.href=${MARIADB_HOMEPAGE_URL:-}"
        - "homepage.description=${MARIADB_HOMEPAGE_DESCRIPTION:-MariaDB server}"
        - "homepage.siteMonitor=${MARIADB_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${MARIADB_HOMEPAGE_GROUP:-Database}"
      - "homepage.name=${MARIADB_HOMEPAGE_NAME:-MariaDB}"
      - "homepage.icon=${MARIADB_HOMEPAGE_ICON:-mariadb.png}"
      - "homepage.href=${MARIADB_HOMEPAGE_URL:-}"
      - "homepage.description=${MARIADB_HOMEPAGE_DESCRIPTION:-MariaDB server}"
      - "homepage.siteMonitor=${MARIADB_HOMEPAGE_SITEMONITOR:-}"
