networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-elastic-agent-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${ELASTIC_AGENT_DATA_VOLUME_NAME:-elastic_agent_data}
    external: ${ELASTIC_AGENT_DATA_VOLUME_EXTERNAL:-false}
    driver: ${ELASTIC_AGENT_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${ELASTIC_AGENT_DATA_VOLUME_TYPE:-}
      o: ${ELASTIC_AGENT_DATA_VOLUME_OPTS:-}
      device: ${ELASTIC_AGENT_DATA_VOLUME_PATH:-}

services:
  elastic-agent:
    image: ${ELASTIC_AGENT_IMAGE:-docker.elastic.co/beats/elastic-agent:8.17.0}
    hostname: ${ELASTIC_AGENT_HOSTNAME:-elastic-agent}
    user: root
    pid: host
    restart: ${ELASTIC_AGENT_RESTART:-unless-stopped}
    privileged: ${ELASTIC_AGENT_PRIVILEGED:-false}
    # FLEET_ENROLLMENT_TOKEN is a secret: provide it ONLY through the env_file (ELASTIC_AGENT_ENV_FILE);
    # do not list it under environment: (it would override the file).
    env_file:
      - ${ELASTIC_AGENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - FLEET_ENROLL=${ELASTIC_AGENT_ENROLL:-1}
      - FLEET_URL=${ELASTIC_AGENT_FLEET_URL:-https://fleet.example.com/fleet}
      - FLEET_INSECURE=${ELASTIC_AGENT_INSECURE:-1}
      - ELASTIC_AGENT_TAGS=${ELASTIC_AGENT_TAGS:-}
    volumes:
      - data:${ELASTIC_AGENT_DATA_VOLUME_DIR:-/usr/share/elastic-agent/state}:z
      # Host filesystem (read-only) for the System integration (set system.hostfs=/hostfs in the policy)
      - ${ELASTIC_AGENT_HOSTFS:-/}:/hostfs:ro
      # Container runtime socket for the Docker integration (rootless Podman: /run/user/<uid>/podman/podman.sock)
      - ${ELASTIC_AGENT_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    healthcheck:
      test:
        - CMD-SHELL
        - elastic-agent status >/dev/null 2>&1
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    networks:
      default: {}
    deploy:
      mode: ${ELASTIC_AGENT_DEPLOY_MODE:-global}
      resources:
        limits:
          memory: ${ELASTIC_AGENT_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${ELASTIC_AGENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${ELASTIC_AGENT_RESTART_POLICY_CONDITION:-any}
        delay: ${ELASTIC_AGENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${ELASTIC_AGENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${ELASTIC_AGENT_HOMEPAGE_GROUP:-Search}"
        - "homepage.name=${ELASTIC_AGENT_HOMEPAGE_NAME:-Elastic Agent}"
        - "homepage.icon=${ELASTIC_AGENT_HOMEPAGE_ICON:-elasticsearch.png}"
        - "homepage.href=${ELASTIC_AGENT_HOMEPAGE_URL:-}"
        - "homepage.description=${ELASTIC_AGENT_HOMEPAGE_DESCRIPTION:-Elastic Agent (node metrics via Fleet)}"
        - "homepage.siteMonitor=${ELASTIC_AGENT_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${ELASTIC_AGENT_HOMEPAGE_GROUP:-Search}"
      - "homepage.name=${ELASTIC_AGENT_HOMEPAGE_NAME:-Elastic Agent}"
      - "homepage.icon=${ELASTIC_AGENT_HOMEPAGE_ICON:-elasticsearch.png}"
      - "homepage.href=${ELASTIC_AGENT_HOMEPAGE_URL:-}"
      - "homepage.description=${ELASTIC_AGENT_HOMEPAGE_DESCRIPTION:-Elastic Agent (node metrics via Fleet)}"
      - "homepage.siteMonitor=${ELASTIC_AGENT_HOMEPAGE_SITEMONITOR:-}"
