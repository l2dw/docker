networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-minio-client-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${MINIO_CLIENT_DATA_VOLUME_NAME:-minio_client_data}
    external: ${MINIO_CLIENT_DATA_VOLUME_EXTERNAL:-false}
    driver: ${MINIO_CLIENT_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${MINIO_CLIENT_DATA_VOLUME_TYPE:-}
      o: ${MINIO_CLIENT_DATA_VOLUME_OPTS:-}
      device: ${MINIO_CLIENT_DATA_VOLUME_PATH:-}
  config:
    name: ${MINIO_CLIENT_CONFIG_VOLUME_NAME:-minio_client_config}
    external: ${MINIO_CLIENT_CONFIG_VOLUME_EXTERNAL:-false}
    driver: ${MINIO_CLIENT_CONFIG_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${MINIO_CLIENT_CONFIG_VOLUME_TYPE:-}
      o: ${MINIO_CLIENT_CONFIG_VOLUME_OPTS:-}
      device: ${MINIO_CLIENT_CONFIG_VOLUME_PATH:-}

services:
  minio-client:
    image: ${MINIO_CLIENT_IMAGE:-docker.io/minio/mc:latest}
    restart: ${MINIO_CLIENT_RESTART:-unless-stopped}
    privileged: ${MINIO_CLIENT_PRIVILEGED:-false}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    env_file:
      - ${MINIO_CLIENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
    volumes:
      - data:${MINIO_CLIENT_DATA_VOLUME_DIR:-/data}:z
      - config:${MINIO_CLIENT_CONFIG_VOLUME_DIR:-/root/.mc}:z
    deploy:
      mode: ${MINIO_CLIENT_DEPLOY_MODE:-replicated}
      replicas: ${MINIO_CLIENT_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MINIO_CLIENT_MEMORY_LIMIT:-256M}
      placement:
        constraints:
          - ${MINIO_CLIENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${MINIO_CLIENT_RESTART_POLICY_CONDITION:-any}
        delay: ${MINIO_CLIENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${MINIO_CLIENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${MINIO_CLIENT_HOMEPAGE_GROUP:-Storage}"
        - "homepage.name=${MINIO_CLIENT_HOMEPAGE_NAME:-MinIO Client}"
        - "homepage.icon=${MINIO_CLIENT_HOMEPAGE_ICON:-minio-client.png}"
        - "homepage.href=${MINIO_CLIENT_HOMEPAGE_URL:-}"
        - "homepage.description=${MINIO_CLIENT_HOMEPAGE_DESCRIPTION:-MinIO mc CLI sidecar}"
        - "homepage.siteMonitor=${MINIO_CLIENT_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${MINIO_CLIENT_HOMEPAGE_GROUP:-Storage}"
      - "homepage.name=${MINIO_CLIENT_HOMEPAGE_NAME:-MinIO Client}"
      - "homepage.icon=${MINIO_CLIENT_HOMEPAGE_ICON:-minio-client.png}"
      - "homepage.href=${MINIO_CLIENT_HOMEPAGE_URL:-}"
      - "homepage.description=${MINIO_CLIENT_HOMEPAGE_DESCRIPTION:-MinIO mc CLI sidecar}"
      - "homepage.siteMonitor=${MINIO_CLIENT_HOMEPAGE_SITEMONITOR:-}"
