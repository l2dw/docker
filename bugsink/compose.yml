networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-bugsink-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${BUGSINK_DATA_VOLUME_NAME:-bugsink_data}
    external: ${BUGSINK_DATA_VOLUME_EXTERNAL:-false}
    driver: ${BUGSINK_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${BUGSINK_DATA_VOLUME_TYPE:-}
      o: ${BUGSINK_DATA_VOLUME_OPTS:-}
      device: ${BUGSINK_DATA_VOLUME_PATH:-}

services:
  bugsink:
    image: ${BUGSINK_IMAGE:-docker.io/bugsink/bugsink:2.6.1}
    restart: ${BUGSINK_RESTART:-unless-stopped}
    privileged: ${BUGSINK_PRIVILEGED:-false}
    env_file:
      - ${BUGSINK_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - SECRET_KEY=${BUGSINK_SECRET_KEY:-}
      - CREATE_SUPERUSER=${BUGSINK_CREATE_SUPERUSER:-admin@example.org:changeme}
      - PORT=${BUGSINK_PORT:-8000}
      - DATABASE_URL=${BUGSINK_DATABASE_URL:-}
      - BEHIND_HTTPS_PROXY=${BUGSINK_BEHIND_HTTPS_PROXY:-false}
      - USE_X_FORWARDED_HOST=${BUGSINK_USE_X_FORWARDED_HOST:-false}
      - USE_X_FORWARDED_FOR=${BUGSINK_USE_X_FORWARDED_FOR:-false}
      - X_FORWARDED_FOR_PROXY_COUNT=${BUGSINK_X_FORWARDED_FOR_PROXY_COUNT:-1}
      - BASE_URL=${BUGSINK_BASE_URL:-http://bugsink.example.com/bugsink}
      - ALLOWED_HOSTS=${BUGSINK_ALLOWED_HOSTS:-localhost,127.0.0.1,bugsink.example.com}
    volumes:
      - data:${BUGSINK_DATA_VOLUME_DIR:-/data}:z
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import requests; requests.get('http://127.0.0.1:${BUGSINK_PORT:-8000}/health/ready').raise_for_status()"
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    deploy:
      mode: ${BUGSINK_DEPLOY_MODE:-replicated}
      replicas: ${BUGSINK_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${BUGSINK_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${BUGSINK_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${BUGSINK_RESTART_POLICY_CONDITION:-any}
        delay: ${BUGSINK_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${BUGSINK_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${BUGSINK_HOMEPAGE_GROUP:-Observability}"
        - "homepage.name=${BUGSINK_HOMEPAGE_NAME:-Bugsink}"
        - "homepage.icon=${BUGSINK_HOMEPAGE_ICON:-bugsink.png}"
        - "homepage.href=${BUGSINK_HOMEPAGE_URL:-}"
        - "homepage.description=${BUGSINK_HOMEPAGE_DESCRIPTION:-Self-hosted error tracking}"
        - "homepage.siteMonitor=${BUGSINK_HOMEPAGE_SITEMONITOR:-http://bugsink:8000/health/ready}"
    labels:
      - "homepage.group=${BUGSINK_HOMEPAGE_GROUP:-Observability}"
      - "homepage.name=${BUGSINK_HOMEPAGE_NAME:-Bugsink}"
      - "homepage.icon=${BUGSINK_HOMEPAGE_ICON:-bugsink.png}"
      - "homepage.href=${BUGSINK_HOMEPAGE_URL:-}"
      - "homepage.description=${BUGSINK_HOMEPAGE_DESCRIPTION:-Self-hosted error tracking}"
      - "homepage.siteMonitor=${BUGSINK_HOMEPAGE_SITEMONITOR:-http://bugsink:8000/health/ready}"
