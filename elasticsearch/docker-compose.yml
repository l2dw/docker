networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-elasticsearch-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${ELASTICSEARCH_DATA_VOLUME_NAME:-elasticsearch_data}
    external: ${ELASTICSEARCH_DATA_VOLUME_EXTERNAL:-false}
    driver: ${ELASTICSEARCH_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${ELASTICSEARCH_DATA_VOLUME_TYPE:-}
      o: ${ELASTICSEARCH_DATA_VOLUME_OPTS:-}
      device: ${ELASTICSEARCH_DATA_VOLUME_PATH:-}

services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.17.4}
    hostname: ${ELASTICSEARCH_HOSTNAME:-elasticsearch}
    restart: ${ELASTICSEARCH_RESTART:-unless-stopped}
    privileged: ${ELASTICSEARCH_PRIVILEGED:-false}
    env_file:
      - ${ELASTICSEARCH_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      # Single-node default. Multi-node (Dokploy ×3): set ELASTICSEARCH_DISCOVERY_TYPE= (empty) so this is unset.
      - discovery.type=${ELASTICSEARCH_DISCOVERY_TYPE-single-node}
      - cluster.name=${ELASTICSEARCH_CLUSTER_NAME:-elasticsearch}
      - node.name=${ELASTICSEARCH_NODE_NAME:-elasticsearch}
      - discovery.seed_hosts=${ELASTICSEARCH_DISCOVERY_SEED_HOSTS:-}
      - cluster.initial_master_nodes=${ELASTICSEARCH_INITIAL_MASTER_NODES:-}
      - xpack.security.enabled=${ELASTICSEARCH_XPACK_SECURITY_ENABLED:-false}
      - xpack.security.http.ssl.enabled=${ELASTICSEARCH_XPACK_SECURITY_HTTP_SSL_ENABLED:-false}
      - xpack.ml.enabled=${ELASTICSEARCH_XPACK_ML_ENABLED:-false}
      - bootstrap.memory_lock=${ELASTICSEARCH_BOOTSTRAP_MEMORY_LOCK:-false}
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - data:${ELASTICSEARCH_DATA_VOLUME_DIR:-/usr/share/elasticsearch/data}:z
    ulimits:
      memlock:
        soft: ${ELASTICSEARCH_MEMLOCK_SOFT:--1}
        hard: ${ELASTICSEARCH_MEMLOCK_HARD:--1}
      nofile:
        soft: ${ELASTICSEARCH_NOFILE_SOFT:-65536}
        hard: ${ELASTICSEARCH_NOFILE_HARD:-65536}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS "http://127.0.0.1:9200/_cluster/health?wait_for_status=${ELASTICSEARCH_HEALTHCHECK_WAIT_FOR_STATUS:-yellow}&timeout=5s" >/dev/null
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      default:
        aliases:
          - ${ELASTICSEARCH_NETWORK_ALIAS:-elasticsearch}
    deploy:
      mode: ${ELASTICSEARCH_DEPLOY_MODE:-replicated}
      replicas: ${ELASTICSEARCH_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${ELASTICSEARCH_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${ELASTICSEARCH_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${ELASTICSEARCH_RESTART_POLICY_CONDITION:-any}
        delay: ${ELASTICSEARCH_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${ELASTICSEARCH_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${ELASTICSEARCH_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.middlewares.${APP_NAME:-elasticsearch}-strip.stripprefix.prefixes=${ELASTICSEARCH_BASE_PATH:-/elasticsearch}"
        - "traefik.http.services.${APP_NAME:-elasticsearch}.loadbalancer.server.port=${ELASTICSEARCH_HTTP_PORT:-9200}"
        - "traefik.http.services.${APP_NAME:-elasticsearch}.loadbalancer.passhostheader=true"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.entrypoints=${ELASTICSEARCH_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.rule=Host(`${ELASTICSEARCH_DOMAIN:-elasticsearch.example.com}`) && PathPrefix(`${ELASTICSEARCH_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.service=${APP_NAME:-elasticsearch}"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.middlewares=${ELASTICSEARCH_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.tls=${ELASTICSEARCH_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-elasticsearch}.tls.certresolver=${ELASTICSEARCH_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${ELASTICSEARCH_HOMEPAGE_GROUP:-Search}"
        - "homepage.name=${ELASTICSEARCH_HOMEPAGE_NAME:-Elasticsearch}"
        - "homepage.icon=${ELASTICSEARCH_HOMEPAGE_ICON:-elasticsearch.png}"
        - "homepage.href=${ELASTICSEARCH_HOMEPAGE_URL:-}"
        - "homepage.description=${ELASTICSEARCH_HOMEPAGE_DESCRIPTION:-Elasticsearch HTTP}"
        - "homepage.siteMonitor=${ELASTICSEARCH_HOMEPAGE_SITEMONITOR:-http://elasticsearch:9200}"
    labels:
      - "traefik.enable=${ELASTICSEARCH_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.middlewares.${APP_NAME:-elasticsearch}-strip.stripprefix.prefixes=${ELASTICSEARCH_BASE_PATH:-/elasticsearch}"
      - "traefik.http.services.${APP_NAME:-elasticsearch}.loadbalancer.server.port=${ELASTICSEARCH_HTTP_PORT:-9200}"
      - "traefik.http.services.${APP_NAME:-elasticsearch}.loadbalancer.passhostheader=true"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.entrypoints=${ELASTICSEARCH_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.rule=Host(`${ELASTICSEARCH_DOMAIN:-elasticsearch.example.com}`) && PathPrefix(`${ELASTICSEARCH_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.service=${APP_NAME:-elasticsearch}"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.middlewares=${ELASTICSEARCH_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.tls=${ELASTICSEARCH_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-elasticsearch}.tls.certresolver=${ELASTICSEARCH_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${ELASTICSEARCH_HOMEPAGE_GROUP:-Search}"
      - "homepage.name=${ELASTICSEARCH_HOMEPAGE_NAME:-Elasticsearch}"
      - "homepage.icon=${ELASTICSEARCH_HOMEPAGE_ICON:-elasticsearch.png}"
      - "homepage.href=${ELASTICSEARCH_HOMEPAGE_URL:-}"
      - "homepage.description=${ELASTICSEARCH_HOMEPAGE_DESCRIPTION:-Elasticsearch HTTP}"
      - "homepage.siteMonitor=${ELASTICSEARCH_HOMEPAGE_SITEMONITOR:-http://elasticsearch:9200}"
