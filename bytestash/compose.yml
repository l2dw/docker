networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-bytestash-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${BYTESTASH_DATA_VOLUME_NAME:-bytestash_data}
    external: ${BYTESTASH_DATA_VOLUME_EXTERNAL:-false}
    driver: ${BYTESTASH_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${BYTESTASH_DATA_VOLUME_TYPE:-}
      o: ${BYTESTASH_DATA_VOLUME_OPTS:-}
      device: ${BYTESTASH_DATA_VOLUME_PATH:-}

services:
  bytestash:
    image: ${BYTESTASH_IMAGE:-ghcr.io/jordan-dalby/bytestash:latest}
    restart: ${BYTESTASH_RESTART:-unless-stopped}
    privileged: ${BYTESTASH_PRIVILEGED:-false}
    env_file:
      - ${BYTESTASH_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - ALLOWED_HOSTS=${BYTESTASH_ALLOWED_HOSTS:-localhost,127.0.0.1,bytestash.example.com}
      - BASE_PATH=${BYTESTASH_BASE_PATH:-/bytestash}
      - JWT_SECRET=${BYTESTASH_JWT_SECRET:-}
      - TOKEN_EXPIRY=${BYTESTASH_TOKEN_EXPIRY:-24h}
      - ALLOW_NEW_ACCOUNTS=${BYTESTASH_ALLOW_NEW_ACCOUNTS:-true}
      - DEBUG=${BYTESTASH_DEBUG:-false}
      - DISABLE_ACCOUNTS=${BYTESTASH_DISABLE_ACCOUNTS:-false}
      - DISABLE_INTERNAL_ACCOUNTS=${BYTESTASH_DISABLE_INTERNAL_ACCOUNTS:-false}
      - OIDC_ENABLED=${BYTESTASH_OIDC_ENABLED:-false}
      - OIDC_DISPLAY_NAME=${BYTESTASH_OIDC_DISPLAY_NAME:-}
      - OIDC_ISSUER_URL=${BYTESTASH_OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${BYTESTASH_OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${BYTESTASH_OIDC_CLIENT_SECRET:-}
      - OIDC_SCOPES=${BYTESTASH_OIDC_SCOPES:-}
    volumes:
      - data:${BYTESTASH_DATA_VOLUME_DIR:-/data/snippets}:z
    deploy:
      mode: ${BYTESTASH_DEPLOY_MODE:-replicated}
      replicas: ${BYTESTASH_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${BYTESTASH_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${BYTESTASH_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${BYTESTASH_RESTART_POLICY_CONDITION:-any}
        delay: ${BYTESTASH_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${BYTESTASH_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${BYTESTASH_HOMEPAGE_GROUP:-Productivity}"
        - "homepage.name=${BYTESTASH_HOMEPAGE_NAME:-ByteStash}"
        - "homepage.icon=${BYTESTASH_HOMEPAGE_ICON:-bytestash.png}"
        - "homepage.href=${BYTESTASH_HOMEPAGE_URL:-}"
        - "homepage.description=${BYTESTASH_HOMEPAGE_DESCRIPTION:-Code snippet manager}"
        - "homepage.siteMonitor=${BYTESTASH_HOMEPAGE_SITEMONITOR:-http://bytestash:5000}"
    labels:
      - "homepage.group=${BYTESTASH_HOMEPAGE_GROUP:-Productivity}"
      - "homepage.name=${BYTESTASH_HOMEPAGE_NAME:-ByteStash}"
      - "homepage.icon=${BYTESTASH_HOMEPAGE_ICON:-bytestash.png}"
      - "homepage.href=${BYTESTASH_HOMEPAGE_URL:-}"
      - "homepage.description=${BYTESTASH_HOMEPAGE_DESCRIPTION:-Code snippet manager}"
      - "homepage.siteMonitor=${BYTESTASH_HOMEPAGE_SITEMONITOR:-http://bytestash:5000}"
