# OpenTelemetry Collector (contrib) — every endpoint/backend overridable by env.
# Syntax ${env:VAR:-default}; see otel/.env.example for the OTEL_* variables.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:${env:OTEL_OTLP_GRPC_PORT:-4317}
      http:
        endpoint: 0.0.0.0:${env:OTEL_OTLP_HTTP_PORT:-4318}
        # Sub-path for ingestion behind a reverse proxy (e.g. /otel); empty = /v1/*.
        traces_url_path: ${env:OTEL_HTTP_BASE_PATH:-}/v1/traces
        metrics_url_path: ${env:OTEL_HTTP_BASE_PATH:-}/v1/metrics
        logs_url_path: ${env:OTEL_HTTP_BASE_PATH:-}/v1/logs
  # Collector self-metrics + backends' /metrics, forwarded to Prometheus.
  prometheus/internal:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:${env:OTEL_TELEMETRY_PORT:-8888}"]
        - job_name: tempo
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_TEMPO:-tempo:3200}"]
        - job_name: loki
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_LOKI:-loki:3100}"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: ${env:OTEL_MEMORY_LIMIT_PERCENTAGE:-80}
    spike_limit_percentage: ${env:OTEL_MEMORY_SPIKE_PERCENTAGE:-20}
  batch: {}
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:OTEL_ENVIRONMENT:-default}
        action: upsert

exporters:
  otlp/traces:
    endpoint: ${env:OTEL_TRACES_ENDPOINT:-tempo:4317}
    tls:
      insecure: ${env:OTEL_TRACES_INSECURE:-true}
  otlphttp/logs:
    endpoint: ${env:OTEL_LOGS_ENDPOINT:-http://loki:3100/otlp}
  prometheusremotewrite:
    endpoint: ${env:OTEL_METRICS_ENDPOINT:-http://prometheus:9090/api/v1/write}
    resource_to_telemetry_conversion:
      enabled: true
    external_labels:
      cluster: ${env:OTEL_CLUSTER:-default}
  debug:
    verbosity: ${env:OTEL_DEBUG_VERBOSITY:-basic}

extensions:
  health_check:
    endpoint: 0.0.0.0:${env:OTEL_HEALTH_PORT:-13133}

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: ${env:OTEL_TELEMETRY_PORT:-8888}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/traces]
    metrics:
      receivers: [otlp, prometheus/internal]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/logs]
