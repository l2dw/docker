networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-otel-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  config:
    name: ${OPENTELEMETRY_CONFIG_VOLUME_NAME:-otel_config}
    external: ${OPENTELEMETRY_CONFIG_VOLUME_EXTERNAL:-false}
    driver: ${OPENTELEMETRY_CONFIG_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${OPENTELEMETRY_CONFIG_VOLUME_TYPE:-}
      o: ${OPENTELEMETRY_CONFIG_VOLUME_OPTS:-}
      device: ${OPENTELEMETRY_CONFIG_VOLUME_PATH:-}
  data:
    name: ${OPENTELEMETRY_DATA_VOLUME_NAME:-otel_data}
    external: ${OPENTELEMETRY_DATA_VOLUME_EXTERNAL:-false}
    driver: ${OPENTELEMETRY_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${OPENTELEMETRY_DATA_VOLUME_TYPE:-}
      o: ${OPENTELEMETRY_DATA_VOLUME_OPTS:-}
      device: ${OPENTELEMETRY_DATA_VOLUME_PATH:-}

services:
  otel:
    image: ${OPENTELEMETRY_IMAGE:-docker.io/otel/opentelemetry-collector-contrib:0.128.0}
    restart: ${OPENTELEMETRY_RESTART:-unless-stopped}
    privileged: ${OPENTELEMETRY_PRIVILEGED:-false}
    command:
      - --config=${OPENTELEMETRY_CONFIG_FILE:-/etc/otelcol-contrib/config.yaml}
    env_file:
      - ${OPENTELEMETRY_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - config:${OPENTELEMETRY_CONFIG_VOLUME_DIR:-/etc/otelcol-contrib}:z
      - data:${OPENTELEMETRY_DATA_VOLUME_DIR:-/var/lib/otelcol}:z
    ports:
      - published: ${OPENTELEMETRY_OTLP_GRPC_PUBLISHED_PORT:-4317}
        target: ${OPENTELEMETRY_OTLP_GRPC_PORT:-4317}
        mode: ${OPENTELEMETRY_OTLP_GRPC_PORT_MODE:-ingress}
        protocol: ${OPENTELEMETRY_OTLP_GRPC_PORT_PROTOCOL:-tcp}
      - published: ${OPENTELEMETRY_OTLP_HTTP_PUBLISHED_PORT:-4318}
        target: ${OPENTELEMETRY_OTLP_HTTP_PORT:-4318}
        mode: ${OPENTELEMETRY_OTLP_HTTP_PORT_MODE:-ingress}
        protocol: ${OPENTELEMETRY_OTLP_HTTP_PORT_PROTOCOL:-tcp}
      - published: ${OPENTELEMETRY_METRICS_PUBLISHED_PORT:-8888}
        target: ${OPENTELEMETRY_METRICS_PORT:-8888}
        mode: ${OPENTELEMETRY_METRICS_PORT_MODE:-ingress}
        protocol: ${OPENTELEMETRY_METRICS_PORT_PROTOCOL:-tcp}
      - published: ${OPENTELEMETRY_HEALTH_PUBLISHED_PORT:-13133}
        target: ${OPENTELEMETRY_HEALTH_PORT:-13133}
        mode: ${OPENTELEMETRY_HEALTH_PORT_MODE:-ingress}
        protocol: ${OPENTELEMETRY_HEALTH_PORT_PROTOCOL:-tcp}
    deploy:
      mode: ${OPENTELEMETRY_DEPLOY_MODE:-replicated}
      replicas: ${OPENTELEMETRY_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${OPENTELEMETRY_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${OPENTELEMETRY_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${OPENTELEMETRY_RESTART_POLICY_CONDITION:-any}
        delay: ${OPENTELEMETRY_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${OPENTELEMETRY_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${OPENTELEMETRY_HOMEPAGE_GROUP:-Observability}"
        - "homepage.name=${OPENTELEMETRY_HOMEPAGE_NAME:-OpenTelemetry}"
        - "homepage.icon=${OPENTELEMETRY_HOMEPAGE_ICON:-opentelemetry.png}"
        - "homepage.href=${OPENTELEMETRY_HOMEPAGE_URL:-}"
        - "homepage.description=${OPENTELEMETRY_HOMEPAGE_DESCRIPTION:-OTLP collector (receive-only)}"
        - "homepage.siteMonitor=${OPENTELEMETRY_HOMEPAGE_SITEMONITOR:-http://otel:13133}"
    labels:
      - "homepage.group=${OPENTELEMETRY_HOMEPAGE_GROUP:-Observability}"
      - "homepage.name=${OPENTELEMETRY_HOMEPAGE_NAME:-OpenTelemetry}"
      - "homepage.icon=${OPENTELEMETRY_HOMEPAGE_ICON:-opentelemetry.png}"
      - "homepage.href=${OPENTELEMETRY_HOMEPAGE_URL:-}"
      - "homepage.description=${OPENTELEMETRY_HOMEPAGE_DESCRIPTION:-OTLP collector (receive-only)}"
      - "homepage.siteMonitor=${OPENTELEMETRY_HOMEPAGE_SITEMONITOR:-http://otel:13133}"
