networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-openbao-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${OPENBAO_DATA_VOLUME_NAME:-openbao_data}
    external: ${OPENBAO_DATA_VOLUME_EXTERNAL:-false}
    driver: ${OPENBAO_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${OPENBAO_DATA_VOLUME_TYPE:-}
      o: ${OPENBAO_DATA_VOLUME_OPTS:-}
      device: ${OPENBAO_DATA_VOLUME_PATH:-}

services:
  openbao:
    image: ${OPENBAO_IMAGE:-docker.io/openbao/openbao:2.7.1}
    hostname: ${OPENBAO_HOSTNAME:-openbao}
    # Persistent file storage (not -dev). Init + unseal required after first boot — see README.
    command:
      - server
    restart: ${OPENBAO_RESTART:-unless-stopped}
    privileged: ${OPENBAO_PRIVILEGED:-false}
    env_file:
      - ${OPENBAO_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - BAO_API_ADDR=${OPENBAO_API_ADDR:-http://openbao.example.com}
      - BAO_LOCAL_CONFIG=${OPENBAO_LOCAL_CONFIG}
      - BAO_ADDR=${BAO_ADDR:-}
      - BAO_TOKEN=${BAO_TOKEN:-}
      - BAO_SKIP_VERIFY=${BAO_SKIP_VERIFY:-true}
    volumes:
      - data:${OPENBAO_DATA_VOLUME_DIR:-/openbao/file}:z
    healthcheck:
      test:
        - CMD-SHELL
        - env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY wget -q -O /dev/null "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
    deploy:
      mode: ${OPENBAO_DEPLOY_MODE:-replicated}
      replicas: ${OPENBAO_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${OPENBAO_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${OPENBAO_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${OPENBAO_RESTART_POLICY_CONDITION:-any}
        delay: ${OPENBAO_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${OPENBAO_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${OPENBAO_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-openbao}.loadbalancer.server.port=${OPENBAO_HTTP_PORT:-8200}"
        - "traefik.http.services.${APP_NAME:-openbao}.loadbalancer.passhostheader=true"
        - "traefik.http.routers.${APP_NAME:-openbao}.entrypoints=${OPENBAO_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-openbao}.rule=Host(`${OPENBAO_DOMAIN:-openbao.example.com}`) && PathPrefix(`${OPENBAO_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-openbao}.service=${APP_NAME:-openbao}"
        - "traefik.http.routers.${APP_NAME:-openbao}.middlewares=${OPENBAO_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-openbao}.tls=${OPENBAO_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-openbao}.tls.certresolver=${OPENBAO_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${OPENBAO_HOMEPAGE_GROUP:-Security}"
        - "homepage.name=${OPENBAO_HOMEPAGE_NAME:-OpenBao}"
        - "homepage.icon=${OPENBAO_HOMEPAGE_ICON:-vault.png}"
        - "homepage.href=${OPENBAO_HOMEPAGE_URL:-}"
        - "homepage.description=${OPENBAO_HOMEPAGE_DESCRIPTION:-Secrets management}"
        - "homepage.siteMonitor=${OPENBAO_HOMEPAGE_SITEMONITOR:-http://openbao:8200/v1/sys/health}"
    labels:
      - "traefik.enable=${OPENBAO_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-openbao}.loadbalancer.server.port=${OPENBAO_HTTP_PORT:-8200}"
      - "traefik.http.services.${APP_NAME:-openbao}.loadbalancer.passhostheader=true"
      - "traefik.http.routers.${APP_NAME:-openbao}.entrypoints=${OPENBAO_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-openbao}.rule=Host(`${OPENBAO_DOMAIN:-openbao.example.com}`) && PathPrefix(`${OPENBAO_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-openbao}.service=${APP_NAME:-openbao}"
      - "traefik.http.routers.${APP_NAME:-openbao}.middlewares=${OPENBAO_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-openbao}.tls=${OPENBAO_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-openbao}.tls.certresolver=${OPENBAO_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${OPENBAO_HOMEPAGE_GROUP:-Security}"
      - "homepage.name=${OPENBAO_HOMEPAGE_NAME:-OpenBao}"
      - "homepage.icon=${OPENBAO_HOMEPAGE_ICON:-vault.png}"
      - "homepage.href=${OPENBAO_HOMEPAGE_URL:-}"
      - "homepage.description=${OPENBAO_HOMEPAGE_DESCRIPTION:-Secrets management}"
      - "homepage.siteMonitor=${OPENBAO_HOMEPAGE_SITEMONITOR:-http://openbao:8200/v1/sys/health}"
