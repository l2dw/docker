networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-postfix-relay-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

services:
  postfix-relay:
    image: ${POSTFIX_RELAY_IMAGE:-docker.io/boky/postfix:5.1.0-alpine}
    restart: ${POSTFIX_RELAY_RESTART:-unless-stopped}
    privileged: ${POSTFIX_RELAY_PRIVILEGED:-false}
    env_file:
      - ${POSTFIX_RELAY_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - RELAYHOST=${POSTFIX_RELAY_RELAYHOST:-}
      - RELAYHOST_USERNAME=${POSTFIX_RELAY_RELAYHOST_USERNAME:-}
      - RELAYHOST_PASSWORD=${POSTFIX_RELAY_RELAYHOST_PASSWORD:-}
      - ALLOWED_SENDER_DOMAINS=${POSTFIX_RELAY_ALLOWED_SENDER_DOMAINS:-}
    ports:
      - target: 25
        published: ${POSTFIX_RELAY_PUBLISHED_PORT:-2525}
        protocol: tcp
        mode: ${POSTFIX_RELAY_PORT_MODE:-ingress}
    deploy:
      mode: ${POSTFIX_RELAY_DEPLOY_MODE:-replicated}
      replicas: ${POSTFIX_RELAY_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${POSTFIX_RELAY_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${POSTFIX_RELAY_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${POSTFIX_RELAY_RESTART_POLICY_CONDITION:-any}
        delay: ${POSTFIX_RELAY_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${POSTFIX_RELAY_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${POSTFIX_RELAY_HOMEPAGE_GROUP:-Infrastructure}"
        - "homepage.name=${POSTFIX_RELAY_HOMEPAGE_NAME:-Postfix Relay}"
        - "homepage.icon=${POSTFIX_RELAY_HOMEPAGE_ICON:-postfix.png}"
        - "homepage.href=${POSTFIX_RELAY_HOMEPAGE_URL:-}"
        - "homepage.description=${POSTFIX_RELAY_HOMEPAGE_DESCRIPTION:-Outbound Postfix relay}"
        - "homepage.siteMonitor=${POSTFIX_RELAY_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${POSTFIX_RELAY_HOMEPAGE_GROUP:-Infrastructure}"
      - "homepage.name=${POSTFIX_RELAY_HOMEPAGE_NAME:-Postfix Relay}"
      - "homepage.icon=${POSTFIX_RELAY_HOMEPAGE_ICON:-postfix.png}"
      - "homepage.href=${POSTFIX_RELAY_HOMEPAGE_URL:-}"
      - "homepage.description=${POSTFIX_RELAY_HOMEPAGE_DESCRIPTION:-Outbound Postfix relay}"
      - "homepage.siteMonitor=${POSTFIX_RELAY_HOMEPAGE_SITEMONITOR:-}"
