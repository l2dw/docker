networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-mysql-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${MYSQL_DATA_VOLUME_NAME:-mysql_data}
    external: ${MYSQL_DATA_VOLUME_EXTERNAL:-false}
    driver: ${MYSQL_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${MYSQL_DATA_VOLUME_TYPE:-}
      o: ${MYSQL_DATA_VOLUME_OPTS:-}
      device: ${MYSQL_DATA_VOLUME_PATH:-}

services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.io/library/mysql:8.0}
    restart: ${MYSQL_RESTART:-unless-stopped}
    privileged: ${MYSQL_PRIVILEGED:-false}
    env_file:
      - ${MYSQL_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-mysql}
      - MYSQL_USER=${MYSQL_USER:-mysql}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
    volumes:
      - data:${MYSQL_DATA_VOLUME_DIR:-/var/lib/mysql}:z
    ports:
      - target: ${MYSQL_PORT:-3306}
        published: ${MYSQL_PUBLISHED_PORT:-23306}
        protocol: ${MYSQL_PORT_PROTOCOL:-tcp}
        mode: ${MYSQL_PORT_MODE:-ingress}
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -p${MYSQL_ROOT_PASSWORD}
      interval: ${MYSQL_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${MYSQL_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${MYSQL_HEALTHCHECK_RETRIES:-5}
      start_period: ${MYSQL_HEALTHCHECK_START_PERIOD:-30s}
    deploy:
      mode: ${MYSQL_DEPLOY_MODE:-replicated}
      replicas: ${MYSQL_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${MYSQL_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${MYSQL_RESTART_POLICY_CONDITION:-any}
        delay: ${MYSQL_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${MYSQL_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${MYSQL_HOMEPAGE_GROUP:-Database}"
        - "homepage.name=${MYSQL_HOMEPAGE_NAME:-MySQL}"
        - "homepage.icon=${MYSQL_HOMEPAGE_ICON:-mysql.png}"
        - "homepage.href=${MYSQL_HOMEPAGE_URL:-}"
        - "homepage.description=${MYSQL_HOMEPAGE_DESCRIPTION:-MySQL server}"
        - "homepage.siteMonitor=${MYSQL_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${MYSQL_HOMEPAGE_GROUP:-Database}"
      - "homepage.name=${MYSQL_HOMEPAGE_NAME:-MySQL}"
      - "homepage.icon=${MYSQL_HOMEPAGE_ICON:-mysql.png}"
      - "homepage.href=${MYSQL_HOMEPAGE_URL:-}"
      - "homepage.description=${MYSQL_HOMEPAGE_DESCRIPTION:-MySQL server}"
      - "homepage.siteMonitor=${MYSQL_HOMEPAGE_SITEMONITOR:-}"
