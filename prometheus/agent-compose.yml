# prometheus stack — agent mode (no TSDB, no UI): scrape local exporters and
# remote_write to a central Prometheus. Used where the central server cannot
# reach the host (pull blocked). No Traefik, no published ports.
networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-prometheus-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  agent-data:
    name: ${PROMETHEUS_AGENT_DATA_VOLUME_NAME:-prometheus_agent_data}
    external: ${PROMETHEUS_AGENT_DATA_VOLUME_EXTERNAL:-false}
    driver: ${PROMETHEUS_AGENT_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${PROMETHEUS_AGENT_DATA_VOLUME_TYPE:-}
      o: ${PROMETHEUS_AGENT_DATA_VOLUME_OPTS:-}
      device: ${PROMETHEUS_AGENT_DATA_VOLUME_PATH:-}

configs:
  prometheus_agent_config:
    name: ${PROMETHEUS_AGENT_CONFIG_NAME:-prometheus_agent_config_v1}
    file: ${PROMETHEUS_AGENT_CONFIG_FILE:-./config/agent/example.yml}

secrets:
  # Password of the remote_write basic auth. Created outside Compose/Dokploy:
  #   <secret source> | docker secret create prometheus_remote_write_password -
  prometheus_remote_write_password:
    name: ${PROMETHEUS_AGENT_REMOTE_WRITE_SECRET_NAME:-prometheus_remote_write_password}
    external: true

services:
  prometheus-agent:
    image: ${PROMETHEUS_IMAGE:-docker.io/prom/prometheus:v3.16.0}
    restart: ${PROMETHEUS_RESTART:-unless-stopped}
    privileged: ${PROMETHEUS_AGENT_PRIVILEGED:-false}
    command:
      - --agent
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.agent.path=${PROMETHEUS_AGENT_DATA_VOLUME_DIR:-/prometheus}
      - --web.listen-address=:${PROMETHEUS_PORT:-9090}
    env_file:
      - ${PROMETHEUS_AGENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    configs:
      - source: prometheus_agent_config
        target: /etc/prometheus/prometheus.yml
    secrets:
      - source: prometheus_remote_write_password
        target: prometheus_remote_write_password
    volumes:
      - agent-data:${PROMETHEUS_AGENT_DATA_VOLUME_DIR:-/prometheus}:z
    deploy:
      mode: ${PROMETHEUS_AGENT_DEPLOY_MODE:-replicated}
      replicas: ${PROMETHEUS_AGENT_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PROMETHEUS_AGENT_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PROMETHEUS_AGENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PROMETHEUS_RESTART_POLICY_CONDITION:-any}
        delay: ${PROMETHEUS_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PROMETHEUS_RESTART_POLICY_MAX_ATTEMPTS:-3}

  prometheus-node-exporter:
    image: ${PROMETHEUS_NODE_EXPORTER_IMAGE:-docker.io/prom/node-exporter:v1.12.1}
    restart: ${PROMETHEUS_RESTART:-unless-stopped}
    privileged: ${PROMETHEUS_NODE_EXPORTER_PRIVILEGED:-false}
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:${PROMETHEUS_NODE_EXPORTER_PORT:-9100}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    env_file:
      - ${PROMETHEUS_NODE_EXPORTER_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      mode: ${PROMETHEUS_NODE_EXPORTER_DEPLOY_MODE:-global}
      endpoint_mode: ${PROMETHEUS_NODE_EXPORTER_ENDPOINT_MODE:-dnsrr}
      resources:
        limits:
          memory: ${PROMETHEUS_NODE_EXPORTER_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PROMETHEUS_NODE_EXPORTER_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PROMETHEUS_RESTART_POLICY_CONDITION:-any}
        delay: ${PROMETHEUS_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PROMETHEUS_RESTART_POLICY_MAX_ATTEMPTS:-3}

  prometheus-cadvisor:
    image: ${PROMETHEUS_CADVISOR_IMAGE:-ghcr.io/google/cadvisor:v0.61.0}
    restart: ${PROMETHEUS_RESTART:-unless-stopped}
    privileged: ${PROMETHEUS_CADVISOR_PRIVILEGED:-false}
    command:
      - --port=${PROMETHEUS_CADVISOR_PORT:-8080}
      - --docker_only=true
      - --housekeeping_interval=${PROMETHEUS_CADVISOR_HOUSEKEEPING_INTERVAL:-30s}
      - --store_container_labels=false
      - --whitelisted_container_labels=${PROMETHEUS_CADVISOR_LABELS_ALLOWLIST:-com.docker.stack.namespace,com.docker.swarm.service.name,com.docker.compose.project,com.docker.compose.service}
      - --enable_metrics=${PROMETHEUS_CADVISOR_ENABLE_METRICS:-cpu,memory,network,diskIO,oom_event}
    env_file:
      - ${PROMETHEUS_CADVISOR_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - ${PROMETHEUS_CADVISOR_DOCKER_DIR:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    deploy:
      mode: ${PROMETHEUS_CADVISOR_DEPLOY_MODE:-global}
      endpoint_mode: ${PROMETHEUS_CADVISOR_ENDPOINT_MODE:-dnsrr}
      resources:
        limits:
          memory: ${PROMETHEUS_CADVISOR_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PROMETHEUS_CADVISOR_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PROMETHEUS_RESTART_POLICY_CONDITION:-any}
        delay: ${PROMETHEUS_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PROMETHEUS_RESTART_POLICY_MAX_ATTEMPTS:-3}
