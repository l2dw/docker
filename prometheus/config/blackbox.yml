# Blackbox exporter modules — prometheus stack (docker-composer).
# Delivered as a Compose/Swarm config (PROMETHEUS_BLACKBOX_CONFIG_NAME). Bump the
# name (…_v2) after editing, then redeploy.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      follow_redirects: true
  http_2xx_insecure:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
