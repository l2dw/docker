# Prometheus configuration — prometheus stack (docker-composer).
# Delivered as a Compose/Swarm config (PROMETHEUS_CONFIG_NAME). Swarm configs are
# immutable: after editing this file, bump PROMETHEUS_CONFIG_NAME (…_v2) and redeploy.
#
# Cluster = infra name (osers). node-exporter / cAdvisor use dockerswarm_sd so
# instance = <Swarm node hostname>:<port> (requires docker.sock + manager node).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself. metrics_path must include PROMETHEUS_BASE_PATH
  # (/prometheus by default; use /metrics when PROMETHEUS_BASE_PATH=/).
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - localhost:9090
    relabel_configs:
      - target_label: cluster
        replacement: osers
      # Prefer the manager hostname when Prometheus is pinned to node.role==manager.
      - target_label: instance
        replacement: prod.oser.otspace.ca:9090

  # Host metrics — one node-exporter task per Swarm node (mode global).
  - job_name: node-exporter
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*prometheus-node-exporter
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        regex: (.+)
        replacement: ${1}:9100
        target_label: instance
      - target_label: cluster
        replacement: osers

  # Container metrics — one cAdvisor task per Swarm node (mode global).
  - job_name: cadvisor
    scrape_timeout: 25s
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
        port: 8080
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_service_name]
        regex: .*prometheus-cadvisor
        action: keep
      - source_labels: [__meta_dockerswarm_node_hostname]
        regex: (.+)
        replacement: ${1}:8080
        target_label: instance
      - target_label: cluster
        replacement: osers

  # Blackbox exporter own metrics.
  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - prometheus-blackbox-exporter:9115
    relabel_configs:
      - target_label: cluster
        replacement: osers
      - target_label: instance
        replacement: prod.oser.otspace.ca:9115

  # HTTP probes through the blackbox exporter. Add the URLs to monitor below.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://prometheus:9090/prometheus/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: prometheus-blackbox-exporter:9115
      - target_label: cluster
        replacement: osers
