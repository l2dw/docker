# Prometheus configuration — central Prometheus on nouv-app8 (Podman, no Swarm).
# Used with PROMETHEUS_CONFIG_FILE=./config/nouv-app8.yml. Cluster label = host name (nouv-app8).
# Remote nodes push their metrics with prometheus-agent (remote_write receiver); this host is scraped directly.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # Prometheus itself (metrics_path includes PROMETHEUS_BASE_PATH=/prometheus).
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - localhost:9090
    relabel_configs:
      - target_label: cluster
        replacement: nouv-app8
      - target_label: instance
        replacement: nouv-app8:9090

  # Host metrics of nouv-app8 (node-exporter of this stack).
  - job_name: node-exporter
    static_configs:
      - targets:
          - prometheus-node-exporter:9100
    relabel_configs:
      - target_label: cluster
        replacement: nouv-app8
      - target_label: instance
        replacement: nouv-app8

  # Blackbox exporter own metrics.
  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - prometheus-blackbox-exporter:9115
    relabel_configs:
      - target_label: cluster
        replacement: nouv-app8
      - target_label: instance
        replacement: nouv-app8:9115

  # HTTP probes through the blackbox exporter (internal URLs on dokploy-network).
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://prometheus:9090/prometheus/-/healthy
          - http://kibana:5601/kibana/api/status
          - http://grafana:3000/grafana/api/health
          - http://jaeger:16686/jaeger/
          - http://fleet-server:8220/api/status
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: prometheus-blackbox-exporter:9115
      - target_label: cluster
        replacement: nouv-app8
