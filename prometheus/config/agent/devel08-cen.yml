# Prometheus agent configuration — devel08-cen → devel-cen
# Delivered as a Compose/Swarm config (PROMETHEUS_AGENT_CONFIG_NAME, immutable:
# bump the _vN suffix after editing). Scrapes the local exporters of this host
# and pushes everything to the central Prometheus (remote_write receiver).
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    cluster: devel08-cen

scrape_configs:
  - job_name: prometheus-agent
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    dns_sd_configs:
      - names:
          - prometheus-node-exporter
        type: A
        port: 9100
        refresh_interval: 30s

  - job_name: cadvisor
    scrape_timeout: 25s
    dns_sd_configs:
      - names:
          - prometheus-cadvisor
        type: A
        port: 8080
        refresh_interval: 30s

  # Blackbox exporter own metrics.
  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - prometheus-blackbox-exporter:9115

  # HTTP liveness probes (module http_alive: 2xx/3xx/401/403/404 = up, no redirect).
  # Internal URLs (dokploy-network): the public URL answers 403 from inside devel08.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_alive
    static_configs:
      - targets:
          - http://workspace-rie-fullstack-pgeebf-app-1:3000/rie/rie-fullstack
          - http://workspace-rie-fullstack-pgeebf-app-1:4000/rie/rie-fullstack/api
          - http://workspace-rie-fullstack-pgeebf-app-1:4010/rie/rie-fullstack/auth
          - http://workspace-rie-fullstack-pgeebf-app-1:3300/rie/rie-fullstack/booking
          - http://workspace-rie-fullstack-pgeebf-app-1:4020/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: prometheus-blackbox-exporter:9115

remote_write:
  - url: https://devel-cen.cen.umontreal.ca/prometheus/api/v1/write
    basic_auth:
      username: devel08-cen
      password_file: /run/secrets/prometheus_remote_write_password
    # devel-cen.cen.umontreal.ca serves an internal self-signed certificate.
    tls_config:
      insecure_skip_verify: true
