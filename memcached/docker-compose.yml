networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-memcached-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

services:
  memcached:
    image: ${MEMCACHED_IMAGE:-docker.io/library/memcached:1.6.45-alpine}
    restart: ${MEMCACHED_RESTART:-unless-stopped}
    privileged: ${MEMCACHED_PRIVILEGED:-false}
    env_file:
      - ${MEMCACHED_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    command:
      - --conn-limit=${MEMCACHED_CONN_LIMIT:-1024}
      - --memory-limit=${MEMCACHED_CACHE_MEMORY:-64}
      - --threads=${MEMCACHED_THREADS:-4}
    deploy:
      mode: ${MEMCACHED_DEPLOY_MODE:-replicated}
      replicas: ${MEMCACHED_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${MEMCACHED_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: ${MEMCACHED_MEMORY_LIMIT:-1G}
