networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-prometheus-agent-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${PROMETHEUS_AGENT_DATA_VOLUME_NAME:-prometheus_agent_data}
    external: ${PROMETHEUS_AGENT_DATA_VOLUME_EXTERNAL:-false}
    driver: ${PROMETHEUS_AGENT_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${PROMETHEUS_AGENT_DATA_VOLUME_TYPE:-}
      o: ${PROMETHEUS_AGENT_DATA_VOLUME_OPTS:-}
      device: ${PROMETHEUS_AGENT_DATA_VOLUME_PATH:-}

services:
  prometheus-agent:
    image: ${PROMETHEUS_AGENT_IMAGE:-docker.io/prom/prometheus:v3.16.0}
    restart: ${PROMETHEUS_AGENT_RESTART:-unless-stopped}
    privileged: ${PROMETHEUS_AGENT_PRIVILEGED:-false}
    user: root
    # The agent config is rendered at start from environment variables (no config file to mount),
    # the remote_write password comes ONLY from the env_file (PROMETHEUS_AGENT_REMOTE_WRITE_PASSWORD).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        printf '%s' "$$PROMETHEUS_AGENT_REMOTE_WRITE_PASSWORD" > /tmp/remote_write_password
        chmod 600 /tmp/remote_write_password
        cat > /tmp/prometheus.yml <<EOF
        global:
          scrape_interval: $${PROMETHEUS_AGENT_SCRAPE_INTERVAL}
          scrape_timeout: 10s
          external_labels:
            cluster: $${PROMETHEUS_AGENT_CLUSTER}
        scrape_configs:
          - job_name: prometheus-agent
            static_configs:
              - targets: ["localhost:$${PROMETHEUS_AGENT_PORT}"]
          - job_name: node-exporter
            static_configs:
              - targets: ["prometheus-agent-node-exporter:$${PROMETHEUS_AGENT_NODE_EXPORTER_PORT}"]
                labels:
                  instance: $${PROMETHEUS_AGENT_CLUSTER}
        remote_write:
          - url: $${PROMETHEUS_AGENT_REMOTE_WRITE_URL}
            basic_auth:
              username: $${PROMETHEUS_AGENT_REMOTE_WRITE_USERNAME}
              password_file: /tmp/remote_write_password
            tls_config:
              insecure_skip_verify: $${PROMETHEUS_AGENT_REMOTE_WRITE_INSECURE}
        EOF
        exec /bin/prometheus --agent --config.file=/tmp/prometheus.yml --storage.agent.path=$${PROMETHEUS_AGENT_DATA_VOLUME_DIR} --web.listen-address=:$${PROMETHEUS_AGENT_PORT}
    env_file:
      - ${PROMETHEUS_AGENT_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - PROMETHEUS_AGENT_CLUSTER=${PROMETHEUS_AGENT_CLUSTER:-example-node}
      - PROMETHEUS_AGENT_REMOTE_WRITE_URL=${PROMETHEUS_AGENT_REMOTE_WRITE_URL:-https://prometheus.example.com/prometheus/api/v1/write}
      - PROMETHEUS_AGENT_REMOTE_WRITE_USERNAME=${PROMETHEUS_AGENT_REMOTE_WRITE_USERNAME:-example-node}
      - PROMETHEUS_AGENT_REMOTE_WRITE_INSECURE=${PROMETHEUS_AGENT_REMOTE_WRITE_INSECURE:-true}
      - PROMETHEUS_AGENT_SCRAPE_INTERVAL=${PROMETHEUS_AGENT_SCRAPE_INTERVAL:-30s}
      - PROMETHEUS_AGENT_PORT=${PROMETHEUS_AGENT_PORT:-9090}
      - PROMETHEUS_AGENT_NODE_EXPORTER_PORT=${PROMETHEUS_AGENT_NODE_EXPORTER_PORT:-9100}
      - PROMETHEUS_AGENT_DATA_VOLUME_DIR=${PROMETHEUS_AGENT_DATA_VOLUME_DIR:-/prometheus}
    volumes:
      - data:${PROMETHEUS_AGENT_DATA_VOLUME_DIR:-/prometheus}:z
    networks:
      default: {}
    deploy:
      mode: ${PROMETHEUS_AGENT_DEPLOY_MODE:-replicated}
      replicas: ${PROMETHEUS_AGENT_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${PROMETHEUS_AGENT_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${PROMETHEUS_AGENT_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PROMETHEUS_AGENT_RESTART_POLICY_CONDITION:-any}
        delay: ${PROMETHEUS_AGENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PROMETHEUS_AGENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${PROMETHEUS_AGENT_HOMEPAGE_GROUP:-Search}"
        - "homepage.name=${PROMETHEUS_AGENT_HOMEPAGE_NAME:-Prometheus Agent}"
        - "homepage.icon=${PROMETHEUS_AGENT_HOMEPAGE_ICON:-prometheus.png}"
        - "homepage.href=${PROMETHEUS_AGENT_HOMEPAGE_URL:-}"
        - "homepage.description=${PROMETHEUS_AGENT_HOMEPAGE_DESCRIPTION:-Prometheus agent (remote_write of node metrics)}"
        - "homepage.siteMonitor=${PROMETHEUS_AGENT_HOMEPAGE_SITEMONITOR:-http://prometheus-agent:9090/-/healthy}"
    labels:
      - "homepage.group=${PROMETHEUS_AGENT_HOMEPAGE_GROUP:-Search}"
      - "homepage.name=${PROMETHEUS_AGENT_HOMEPAGE_NAME:-Prometheus Agent}"
      - "homepage.icon=${PROMETHEUS_AGENT_HOMEPAGE_ICON:-prometheus.png}"
      - "homepage.href=${PROMETHEUS_AGENT_HOMEPAGE_URL:-}"
      - "homepage.description=${PROMETHEUS_AGENT_HOMEPAGE_DESCRIPTION:-Prometheus agent (remote_write of node metrics)}"
      - "homepage.siteMonitor=${PROMETHEUS_AGENT_HOMEPAGE_SITEMONITOR:-http://prometheus-agent:9090/-/healthy}"

  prometheus-agent-node-exporter:
    image: ${PROMETHEUS_AGENT_NODE_EXPORTER_IMAGE:-docker.io/prom/node-exporter:v1.12.1}
    restart: ${PROMETHEUS_AGENT_RESTART:-unless-stopped}
    privileged: ${PROMETHEUS_AGENT_NODE_EXPORTER_PRIVILEGED:-false}
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --web.listen-address=:${PROMETHEUS_AGENT_NODE_EXPORTER_PORT:-9100}
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
    env_file:
      - ${PROMETHEUS_AGENT_NODE_EXPORTER_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      default: {}
    deploy:
      mode: ${PROMETHEUS_AGENT_NODE_EXPORTER_DEPLOY_MODE:-global}
      resources:
        limits:
          memory: ${PROMETHEUS_AGENT_NODE_EXPORTER_MEMORY_LIMIT:-256M}
      placement:
        constraints:
          - ${PROMETHEUS_AGENT_NODE_EXPORTER_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${PROMETHEUS_AGENT_RESTART_POLICY_CONDITION:-any}
        delay: ${PROMETHEUS_AGENT_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${PROMETHEUS_AGENT_RESTART_POLICY_MAX_ATTEMPTS:-3}
