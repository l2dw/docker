networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-siem-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  es_data:
    name: ${SIEM_ES_DATA_VOLUME_NAME:-siem_es_data}
    external: ${SIEM_ES_DATA_VOLUME_EXTERNAL:-false}
    driver: ${SIEM_ES_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${SIEM_ES_DATA_VOLUME_TYPE:-}
      o: ${SIEM_ES_DATA_VOLUME_OPTS:-}
      device: ${SIEM_ES_DATA_VOLUME_PATH:-}
  kb_data:
    name: ${SIEM_KB_DATA_VOLUME_NAME:-siem_kb_data}
    external: ${SIEM_KB_DATA_VOLUME_EXTERNAL:-false}
    driver: ${SIEM_KB_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${SIEM_KB_DATA_VOLUME_TYPE:-}
      o: ${SIEM_KB_DATA_VOLUME_OPTS:-}
      device: ${SIEM_KB_DATA_VOLUME_PATH:-}
  certs:
    name: ${SIEM_CERTS_VOLUME_NAME:-siem_certs}
    external: ${SIEM_CERTS_VOLUME_EXTERNAL:-false}
    driver: ${SIEM_CERTS_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${SIEM_CERTS_VOLUME_TYPE:-}
      o: ${SIEM_CERTS_VOLUME_OPTS:-}
      device: ${SIEM_CERTS_VOLUME_PATH:-}

services:
  cert-utils:
    image: ${SIEM_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.14}
    user: "0"
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /certs/ca/ca.crt ] && [ -f /certs/elasticsearch/elasticsearch.crt ]; then
          echo "SIEM certs already present — skipping generation."
          exit 0
        fi
        rm -rf /certs/elastic-stack-ca.zip /certs/elastic-certificates.zip /certs/ca /certs/elasticsearch
        bin/elasticsearch-certutil ca --silent --pem -out /certs/elastic-stack-ca.zip
        unzip -o /certs/elastic-stack-ca.zip -d /certs
        bin/elasticsearch-certutil cert --silent --ca-cert /certs/ca/ca.crt --ca-key /certs/ca/ca.key --pem --in /instances.yml --out /certs/elastic-certificates.zip
        unzip -o /certs/elastic-certificates.zip -d /certs
        ls -lR /certs
    volumes:
      - certs:${SIEM_CERTS_VOLUME_DIR:-/certs}:z
      - ${SIEM_INSTANCES_FILE:-./instances.yml}:/instances.yml:ro
    networks:
      - default
    deploy:
      mode: ${SIEM_CERT_UTILS_DEPLOY_MODE:-replicated}
      replicas: ${SIEM_CERT_UTILS_DEPLOY_REPLICAS:-1}
      restart_policy:
        condition: ${SIEM_CERT_UTILS_RESTART_POLICY_CONDITION:-none}
      placement:
        constraints:
          - ${SIEM_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      labels:
        - "homepage.group=${SIEM_ES_HOMEPAGE_GROUP:-SIEM}"
        - "homepage.name=${SIEM_CERT_UTILS_HOMEPAGE_NAME:-SIEM certs}"
        - "homepage.icon=${SIEM_ES_HOMEPAGE_ICON:-elasticsearch.png}"
        - "homepage.href=${SIEM_ES_HOMEPAGE_URL:-}"
        - "homepage.description=${SIEM_CERT_UTILS_HOMEPAGE_DESCRIPTION:-One-shot cert generation}"
        - "homepage.siteMonitor=${SIEM_ES_HOMEPAGE_SITEMONITOR:-}"
    labels:
      - "homepage.group=${SIEM_ES_HOMEPAGE_GROUP:-SIEM}"
      - "homepage.name=${SIEM_CERT_UTILS_HOMEPAGE_NAME:-SIEM certs}"
      - "homepage.icon=${SIEM_ES_HOMEPAGE_ICON:-elasticsearch.png}"
      - "homepage.href=${SIEM_ES_HOMEPAGE_URL:-}"
      - "homepage.description=${SIEM_CERT_UTILS_HOMEPAGE_DESCRIPTION:-One-shot cert generation}"
      - "homepage.siteMonitor=${SIEM_ES_HOMEPAGE_SITEMONITOR:-}"

  elasticsearch:
    image: ${SIEM_ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.14}
    hostname: ${SIEM_ES_HOSTNAME:-elasticsearch}
    restart: ${SIEM_ES_RESTART:-unless-stopped}
    privileged: ${SIEM_ES_PRIVILEGED:-false}
    env_file:
      - ${SIEM_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - node.name=${SIEM_ES_NODE_NAME:-elasticsearch}
      - cluster.name=${SIEM_ES_CLUSTER_NAME:-es-docker-cluster}
      - discovery.type=${SIEM_ES_DISCOVERY_TYPE:-single-node}
      - bootstrap.memory_lock=${SIEM_ES_BOOTSTRAP_MEMORY_LOCK:-false}
      - ES_JAVA_OPTS=${SIEM_ES_JAVA_OPTS:--Xms1024m -Xmx1024m}
      - xpack.security.enabled=${SIEM_ES_XPACK_SECURITY_ENABLED:-true}
      - xpack.security.transport.ssl.enabled=${SIEM_ES_XPACK_TRANSPORT_SSL_ENABLED:-true}
      - xpack.security.transport.ssl.verification_mode=${SIEM_ES_XPACK_TRANSPORT_SSL_VERIFICATION_MODE:-certificate}
      - xpack.security.transport.ssl.certificate=${SIEM_ES_TRANSPORT_SSL_CERTIFICATE:-/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.crt}
      - xpack.security.transport.ssl.key=${SIEM_ES_TRANSPORT_SSL_KEY:-/usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.key}
      - xpack.security.transport.ssl.certificate_authorities=${SIEM_ES_TRANSPORT_SSL_CA:-/usr/share/elasticsearch/config/certs/ca/ca.crt}
      - ELASTIC_PASSWORD=${SIEM_ELASTIC_PASSWORD:-}
    volumes:
      - es_data:${SIEM_ES_DATA_VOLUME_DIR:-/usr/share/elasticsearch/data}:z
      - certs:${SIEM_ES_CERTS_VOLUME_DIR:-/usr/share/elasticsearch/config/certs}:z
    ulimits:
      memlock:
        soft: ${SIEM_ES_MEMLOCK_SOFT:--1}
        hard: ${SIEM_ES_MEMLOCK_HARD:--1}
      nofile:
        soft: ${SIEM_ES_NOFILE_SOFT:-65536}
        hard: ${SIEM_ES_NOFILE_HARD:-65536}
    ports:
      - published: ${SIEM_ES_HTTP_PUBLISHED_PORT:-9200}
        target: ${SIEM_ES_HTTP_PORT:-9200}
        mode: ${SIEM_ES_HTTP_PORT_MODE:-ingress}
        protocol: ${SIEM_ES_HTTP_PORT_PROTOCOL:-tcp}
    networks:
      - default
    deploy:
      mode: ${SIEM_ES_DEPLOY_MODE:-replicated}
      replicas: ${SIEM_ES_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${SIEM_ES_MEMORY_LIMIT:-2G}
      placement:
        constraints:
          - ${SIEM_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${SIEM_ES_RESTART_POLICY_CONDITION:-any}
        delay: ${SIEM_ES_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${SIEM_ES_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${SIEM_ES_HOMEPAGE_GROUP:-SIEM}"
        - "homepage.name=${SIEM_ES_HOMEPAGE_NAME:-Elasticsearch}"
        - "homepage.icon=${SIEM_ES_HOMEPAGE_ICON:-elasticsearch.png}"
        - "homepage.href=${SIEM_ES_HOMEPAGE_URL:-}"
        - "homepage.description=${SIEM_ES_HOMEPAGE_DESCRIPTION:-SIEM Elasticsearch}"
        - "homepage.siteMonitor=${SIEM_ES_HOMEPAGE_SITEMONITOR:-http://elasticsearch:9200}"
    labels:
      - "homepage.group=${SIEM_ES_HOMEPAGE_GROUP:-SIEM}"
      - "homepage.name=${SIEM_ES_HOMEPAGE_NAME:-Elasticsearch}"
      - "homepage.icon=${SIEM_ES_HOMEPAGE_ICON:-elasticsearch.png}"
      - "homepage.href=${SIEM_ES_HOMEPAGE_URL:-}"
      - "homepage.description=${SIEM_ES_HOMEPAGE_DESCRIPTION:-SIEM Elasticsearch}"
      - "homepage.siteMonitor=${SIEM_ES_HOMEPAGE_SITEMONITOR:-http://elasticsearch:9200}"

  kibana:
    image: ${SIEM_KB_IMAGE:-docker.elastic.co/kibana/kibana:8.19.14}
    hostname: ${SIEM_KB_HOSTNAME:-kibana}
    restart: ${SIEM_KB_RESTART:-unless-stopped}
    privileged: ${SIEM_KB_PRIVILEGED:-false}
    env_file:
      - ${SIEM_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - SERVER_NAME=${SIEM_KB_SERVER_NAME:-kibana}
      - SERVER_HOST=${SIEM_KB_SERVER_HOST:-0.0.0.0}
      - SERVER_PORT=${SIEM_KB_HTTP_PORT:-5601}
      - SERVER_PUBLICBASEURL=${SIEM_KB_PUBLIC_BASE_URL:-}
      - SERVER_BASEPATH=${SIEM_KB_BASE_PATH:-/kibana}
      - SERVER_REWRITEBASEPATH=${SIEM_KB_REWRITE_BASE_PATH:-true}
      - ELASTICSEARCH_HOSTS=${SIEM_KB_ELASTICSEARCH_HOSTS:-http://elasticsearch:9200}
      - ELASTICSEARCH_USERNAME=${SIEM_KB_ELASTICSEARCH_USERNAME:-kibana_system}
      - ELASTICSEARCH_PASSWORD=${SIEM_KB_ELASTICSEARCH_PASSWORD:-}
      - XPACK_SECURITY_ENABLED=${SIEM_KB_XPACK_SECURITY_ENABLED:-true}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${SIEM_KB_ENCRYPTED_SAVED_OBJECTS_ENCRYPTION_KEY:-}
      - XPACK_REPORTING_ENCRYPTIONKEY=${SIEM_KB_REPORTING_ENCRYPTION_KEY:-}
    volumes:
      - kb_data:${SIEM_KB_DATA_VOLUME_DIR:-/usr/share/kibana/data}:z
      - certs:${SIEM_KB_CERTS_VOLUME_DIR:-/usr/share/kibana/config/certs}:z
    ports:
      - published: ${SIEM_KB_HTTP_PUBLISHED_PORT:-5601}
        target: ${SIEM_KB_HTTP_PORT:-5601}
        mode: ${SIEM_KB_HTTP_PORT_MODE:-ingress}
        protocol: ${SIEM_KB_HTTP_PORT_PROTOCOL:-tcp}
    networks:
      - default
    deploy:
      mode: ${SIEM_KB_DEPLOY_MODE:-replicated}
      replicas: ${SIEM_KB_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${SIEM_KB_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${SIEM_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${SIEM_KB_RESTART_POLICY_CONDITION:-any}
        delay: ${SIEM_KB_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${SIEM_KB_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${SIEM_KB_HOMEPAGE_GROUP:-SIEM}"
        - "homepage.name=${SIEM_KB_HOMEPAGE_NAME:-Kibana}"
        - "homepage.icon=${SIEM_KB_HOMEPAGE_ICON:-kibana.png}"
        - "homepage.href=${SIEM_KB_HOMEPAGE_URL:-}"
        - "homepage.description=${SIEM_KB_HOMEPAGE_DESCRIPTION:-SIEM Kibana}"
        - "homepage.siteMonitor=${SIEM_KB_HOMEPAGE_SITEMONITOR:-http://kibana:5601}"
    labels:
      - "homepage.group=${SIEM_KB_HOMEPAGE_GROUP:-SIEM}"
      - "homepage.name=${SIEM_KB_HOMEPAGE_NAME:-Kibana}"
      - "homepage.icon=${SIEM_KB_HOMEPAGE_ICON:-kibana.png}"
      - "homepage.href=${SIEM_KB_HOMEPAGE_URL:-}"
      - "homepage.description=${SIEM_KB_HOMEPAGE_DESCRIPTION:-SIEM Kibana}"
      - "homepage.siteMonitor=${SIEM_KB_HOMEPAGE_SITEMONITOR:-http://kibana:5601}"
