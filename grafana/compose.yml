# grafana stack — keep compose.yml (no Traefik) and docker-compose.yml in sync.
networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-grafana-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${GRAFANA_DATA_VOLUME_NAME:-grafana_data}
    external: ${GRAFANA_DATA_VOLUME_EXTERNAL:-false}
    driver: ${GRAFANA_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${GRAFANA_DATA_VOLUME_TYPE:-}
      o: ${GRAFANA_DATA_VOLUME_OPTS:-}
      device: ${GRAFANA_DATA_VOLUME_PATH:-}

# Provisioning delivered as Swarm/Compose configs (immutable: bump the _vN suffix after editing).
configs:
  grafana_datasources:
    name: ${GRAFANA_DATASOURCES_CONFIG_NAME:-grafana_datasources_v1}
    file: ./config/provisioning/datasources/prometheus.yml
  grafana_dashboard_provider:
    name: ${GRAFANA_DASHBOARD_PROVIDER_CONFIG_NAME:-grafana_dashboard_provider_v1}
    file: ./config/provisioning/dashboards/default.yml
  grafana_dashboard_node_exporter_full:
    name: ${GRAFANA_DASHBOARD_NODE_EXPORTER_FULL_CONFIG_NAME:-grafana_dashboard_node_exporter_full_v1}
    file: ./config/dashboards/node-exporter-full.json
  grafana_dashboard_cadvisor:
    name: ${GRAFANA_DASHBOARD_CADVISOR_CONFIG_NAME:-grafana_dashboard_cadvisor_v1}
    file: ./config/dashboards/cadvisor.json
  grafana_dashboard_blackbox_http:
    name: ${GRAFANA_DASHBOARD_BLACKBOX_HTTP_CONFIG_NAME:-grafana_dashboard_blackbox_http_v1}
    file: ./config/dashboards/blackbox-http.json
  grafana_dashboard_prometheus_overview:
    name: ${GRAFANA_DASHBOARD_PROMETHEUS_OVERVIEW_CONFIG_NAME:-grafana_dashboard_prometheus_overview_v1}
    file: ./config/dashboards/prometheus-overview.json

services:
  grafana:
    image: ${GRAFANA_IMAGE:-docker.io/grafana/grafana:13.3.1}
    restart: ${GRAFANA_RESTART:-unless-stopped}
    privileged: ${GRAFANA_PRIVILEGED:-false}
    env_file:
      - ${GRAFANA_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - GF_SERVER_HTTP_PORT=${GRAFANA_PORT:-3000}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-grafana.example.com}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://grafana.example.com/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-true}
      - GF_DATABASE_TYPE=${GRAFANA_DB_TYPE:-sqlite3}
      - GF_DATABASE_HOST=${GRAFANA_DB_HOST:-}
      - GF_DATABASE_NAME=${GRAFANA_DB_NAME:-grafana}
      - GF_DATABASE_USER=${GRAFANA_DB_USER:-grafana}
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD:-}
      - GF_DATABASE_SSL_MODE=${GRAFANA_DB_SSL_MODE:-disable}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-}
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - GRAFANA_PROMETHEUS_URL=${GRAFANA_PROMETHEUS_URL:-http://prometheus:9090/prometheus}
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/default.yml
      - source: grafana_dashboard_node_exporter_full
        target: /var/lib/grafana-dashboards/node-exporter-full.json
      - source: grafana_dashboard_cadvisor
        target: /var/lib/grafana-dashboards/cadvisor.json
      - source: grafana_dashboard_blackbox_http
        target: /var/lib/grafana-dashboards/blackbox-http.json
      - source: grafana_dashboard_prometheus_overview
        target: /var/lib/grafana-dashboards/prometheus-overview.json
    volumes:
      - data:${GRAFANA_DATA_VOLUME_DIR:-/var/lib/grafana}:z
    deploy:
      mode: ${GRAFANA_DEPLOY_MODE:-replicated}
      replicas: ${GRAFANA_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${GRAFANA_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${GRAFANA_RESTART_POLICY_CONDITION:-any}
        delay: ${GRAFANA_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${GRAFANA_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${GRAFANA_HOMEPAGE_GROUP:-Observability}"
        - "homepage.name=${GRAFANA_HOMEPAGE_NAME:-Grafana}"
        - "homepage.icon=${GRAFANA_HOMEPAGE_ICON:-grafana.png}"
        - "homepage.href=${GRAFANA_HOMEPAGE_URL:-}"
        - "homepage.description=${GRAFANA_HOMEPAGE_DESCRIPTION:-Dashboards}"
        - "homepage.siteMonitor=${GRAFANA_HOMEPAGE_SITEMONITOR:-http://grafana:3000/grafana/api/health}"
    labels:
      - "homepage.group=${GRAFANA_HOMEPAGE_GROUP:-Observability}"
      - "homepage.name=${GRAFANA_HOMEPAGE_NAME:-Grafana}"
      - "homepage.icon=${GRAFANA_HOMEPAGE_ICON:-grafana.png}"
      - "homepage.href=${GRAFANA_HOMEPAGE_URL:-}"
      - "homepage.description=${GRAFANA_HOMEPAGE_DESCRIPTION:-Dashboards}"
      - "homepage.siteMonitor=${GRAFANA_HOMEPAGE_SITEMONITOR:-http://grafana:3000/grafana/api/health}"
