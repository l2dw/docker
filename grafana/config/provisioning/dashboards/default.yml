# Grafana dashboard provider — grafana stack (docker-composer).
# JSON files are mounted under /var/lib/grafana-dashboards (Swarm/Compose configs).
apiVersion: 1

providers:
  - name: cen-dashboards
    orgId: 1
    folder: Infrastructure
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: false
