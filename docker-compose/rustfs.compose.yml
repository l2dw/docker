
# networks:
#   default:
#     name: dokploy-network
#     external: true

# name: storage # Not supported by Docker Swarm
services:

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    # pull_policy: always ## Not supported by Docker Swarm
    environment:
      - TZ
      - http_proxy
      - https_proxy
      - no_proxy
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
    # labels:
    #   - "traefik.enable=true"
    #   # HTTPS router
    #   - "traefik.http.services.rustfs-s3.loadbalancer.server.port=9000"
    #   - "traefik.http.routers.rustfs-s3.rule=Host(`${RUSTFS_S3_DOMAIN}`)"
    #   - "traefik.http.routers.rustfs-s3.service=rustfs-s3"
    #   # - "traefik.http.routers.rustfs-s3.entrypoints=web"
    #   - "traefik.http.routers.rustfs-s3.entrypoints=websecure"
    #   - "traefik.http.routers.rustfs-s3.tls=true"
    #   # RustFS Console HTTPS router
    #   - "traefik.http.services.rustfs-console.loadbalancer.server.port=9001"
    #   - "traefik.http.routers.rustfs-console.rule=Host(`${RUSTFS_S3_DOMAIN}`) && PathPrefix(`/rustfs`)"
    #   - "traefik.http.routers.rustfs-console.service=rustfs-console"
    #   # - "traefik.http.routers.rustfs-console.entrypoints=web"
    #   - "traefik.http.routers.rustfs-console.entrypoints=websecure"
    #   - "traefik.http.routers.rustfs-console.tls=true"
    volumes:
      - ${RUSTFS_DATA_DIR:-rustfs_data}:/data
    networks:
      - default
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.http.services.rustfs.loadbalancer.server.port=9000
        - traefik.http.routers.rustfs.entrypoints=web
        - traefik.http.routers.rustfs.rule=Host(`${RUSTFS_DOMAIN}`)
        - traefik.http.routers.rustfs.service=rustfs
        - traefik.http.services.rustf-console.loadbalancer.server.port=9001
        - traefik.http.routers.rustf-console.entrypoints=web
        - traefik.http.routers.rustf-console.rule=Host(`${RUSTFS_DOMAIN}`)&&PathPrefix(`/rustfs`)
        - traefik.http.routers.rustf-console.service=rustfs-console
        - homepage.group=MacKantor
        - homepage.name=RustFS
        - homepage.icon=rustfs.png
        - homepage.href=http://${RUSTFS_DOMAIN}/rustfs/
        - homepage.description=RustFS

volumes:
  rustfs_data:
    driver: local

networks:
  default:
    name: ${DEFAULT_NETWORK:-dokploy-network}
    external: true
