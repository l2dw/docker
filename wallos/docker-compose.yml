networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-wallos-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  wallos-db:
    name: ${WALLOS_DB_VOLUME_NAME:-wallos-db}
    external: ${WALLOS_DB_VOLUME_EXTERNAL:-false}
  wallos-logos:
    name: ${WALLOS_LOGOS_VOLUME_NAME:-wallos-logos}
    external: ${WALLOS_LOGOS_VOLUME_EXTERNAL:-false}

services:
  wallos:
    image: ${WALLOS_IMAGE:-docker.io/bellamy/wallos:5.4.2}
    restart: ${WALLOS_RESTART:-unless-stopped}
    privileged: ${WALLOS_PRIVILEGED:-false}
    env_file:
      - ${WALLOS_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - OIDC_ENABLED=${WALLOS_OIDC_ENABLED:-false}
      - OIDC_PROVIDER_NAME=${WALLOS_OIDC_PROVIDER_NAME:-}
      - OIDC_CLIENT_ID=${WALLOS_OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${WALLOS_OIDC_CLIENT_SECRET:-}
      - OIDC_ISSUER=${WALLOS_OIDC_ISSUER:-}
      - OIDC_REDIRECT_URL=${WALLOS_OIDC_REDIRECT_URL:-}
      - OIDC_AUTO_CREATE_USER=${WALLOS_OIDC_AUTO_CREATE_USER:-false}
      - OIDC_DISABLE_PASSWORD_LOGIN=${WALLOS_OIDC_DISABLE_PASSWORD_LOGIN:-false}
      - SSRF_ALLOWLIST=${WALLOS_SSRF_ALLOWLIST:-}
    volumes:
      - ${WALLOS_DB_DIR:-wallos-db}:/var/www/html/db
      - ${WALLOS_LOGOS_DIR:-wallos-logos}:/var/www/html/images/uploads/logos
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/ >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      mode: ${WALLOS_DEPLOY_MODE:-replicated}
      replicas: ${WALLOS_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${WALLOS_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        order: stop-first
        failure_action: rollback
      resources:
        limits:
          memory: ${WALLOS_MEMORY_LIMIT:-1G}
      labels:
        - "traefik.enable=${WALLOS_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-wallos}.loadbalancer.server.port=80"
        - "traefik.http.routers.${APP_NAME:-wallos}.entrypoints=${WALLOS_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-wallos}.rule=Host(`${WALLOS_DOMAIN:-wallos.example.com}`) && PathPrefix(`${WALLOS_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-wallos}.service=${APP_NAME:-wallos}"
        - "traefik.http.routers.${APP_NAME:-wallos}.middlewares=${WALLOS_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-wallos}.tls=${WALLOS_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-wallos}.tls.certresolver=${WALLOS_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${WALLOS_HOMEPAGE_GROUP:-Apps}"
        - "homepage.name=${WALLOS_HOMEPAGE_NAME:-Wallos}"
        - "homepage.icon=${WALLOS_HOMEPAGE_ICON:-wallos.png}"
        - "homepage.href=${WALLOS_APP_URL:-http://wallos.example.com}"
        - "homepage.description=${WALLOS_HOMEPAGE_DESCRIPTION:-Wallos}"
        - "homepage.siteMonitor=${WALLOS_HOMEPAGE_SITEMONITOR:-http://wallos:80}"
    labels:
      - "traefik.enable=${WALLOS_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-wallos}.loadbalancer.server.port=80"
      - "traefik.http.routers.${APP_NAME:-wallos}.entrypoints=${WALLOS_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-wallos}.rule=Host(`${WALLOS_DOMAIN:-wallos.example.com}`) && PathPrefix(`${WALLOS_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-wallos}.service=${APP_NAME:-wallos}"
      - "traefik.http.routers.${APP_NAME:-wallos}.middlewares=${WALLOS_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-wallos}.tls=${WALLOS_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-wallos}.tls.certresolver=${WALLOS_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${WALLOS_HOMEPAGE_GROUP:-Apps}"
      - "homepage.name=${WALLOS_HOMEPAGE_NAME:-Wallos}"
      - "homepage.icon=${WALLOS_HOMEPAGE_ICON:-wallos.png}"
      - "homepage.href=${WALLOS_APP_URL:-http://wallos.example.com}"
      - "homepage.description=${WALLOS_HOMEPAGE_DESCRIPTION:-Wallos}"
      - "homepage.siteMonitor=${WALLOS_HOMEPAGE_SITEMONITOR:-http://wallos:80}"
