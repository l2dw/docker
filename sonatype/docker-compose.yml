networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-sonatype-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${SONATYPE_DATA_VOLUME_NAME:-sonatype_data}
    external: ${SONATYPE_DATA_VOLUME_EXTERNAL:-false}
    driver: ${SONATYPE_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${SONATYPE_DATA_VOLUME_TYPE:-}
      o: ${SONATYPE_DATA_VOLUME_OPTS:-}
      device: ${SONATYPE_DATA_VOLUME_PATH:-}

services:
  sonatype:
    image: ${SONATYPE_IMAGE:-docker.io/sonatype/nexus3:3.96.4}
    restart: ${SONATYPE_RESTART:-unless-stopped}
    privileged: ${SONATYPE_PRIVILEGED:-false}
    stop_grace_period: ${SONATYPE_STOP_GRACE_PERIOD:-2m}
    env_file:
      - ${SONATYPE_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - NEXUS_CONTEXT=${SONATYPE_NEXUS_CONTEXT:-sonatype}
      - INSTALL4J_ADD_VM_PARAMS=${SONATYPE_INSTALL4J_ADD_VM_PARAMS:--Xms512m -Xmx1g -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs}
    volumes:
      - data:${SONATYPE_DATA_VOLUME_DIR:-/nexus-data}:z
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081${SONATYPE_BASE_PATH:-/sonatype}/service/rest/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      mode: ${SONATYPE_DEPLOY_MODE:-replicated}
      replicas: ${SONATYPE_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${SONATYPE_MEMORY_LIMIT:-2G}
      placement:
        constraints:
          - ${SONATYPE_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${SONATYPE_RESTART_POLICY_CONDITION:-any}
        delay: ${SONATYPE_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${SONATYPE_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${SONATYPE_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-sonatype}.loadbalancer.server.port=${SONATYPE_PORT:-8081}"
        - "traefik.http.routers.${APP_NAME:-sonatype}.entrypoints=${SONATYPE_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-sonatype}.rule=Host(`${SONATYPE_DOMAIN:-sonatype.example.com}`) && PathPrefix(`${SONATYPE_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-sonatype}.service=${APP_NAME:-sonatype}"
        - "traefik.http.routers.${APP_NAME:-sonatype}.middlewares=${SONATYPE_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-sonatype}.tls=${SONATYPE_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-sonatype}.tls.certresolver=${SONATYPE_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${SONATYPE_HOMEPAGE_GROUP:-CI}"
        - "homepage.name=${SONATYPE_HOMEPAGE_NAME:-Nexus}"
        - "homepage.icon=${SONATYPE_HOMEPAGE_ICON:-sonatype.png}"
        - "homepage.href=${SONATYPE_HOMEPAGE_URL:-}"
        - "homepage.description=${SONATYPE_HOMEPAGE_DESCRIPTION:-Sonatype Nexus Repository}"
        - "homepage.siteMonitor=${SONATYPE_HOMEPAGE_SITEMONITOR:-http://sonatype:8081/sonatype}"
    labels:
      - "traefik.enable=${SONATYPE_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-sonatype}.loadbalancer.server.port=${SONATYPE_PORT:-8081}"
      - "traefik.http.routers.${APP_NAME:-sonatype}.entrypoints=${SONATYPE_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-sonatype}.rule=Host(`${SONATYPE_DOMAIN:-sonatype.example.com}`) && PathPrefix(`${SONATYPE_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-sonatype}.service=${APP_NAME:-sonatype}"
      - "traefik.http.routers.${APP_NAME:-sonatype}.middlewares=${SONATYPE_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-sonatype}.tls=${SONATYPE_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-sonatype}.tls.certresolver=${SONATYPE_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${SONATYPE_HOMEPAGE_GROUP:-CI}"
      - "homepage.name=${SONATYPE_HOMEPAGE_NAME:-Nexus}"
      - "homepage.icon=${SONATYPE_HOMEPAGE_ICON:-sonatype.png}"
      - "homepage.href=${SONATYPE_HOMEPAGE_URL:-}"
      - "homepage.description=${SONATYPE_HOMEPAGE_DESCRIPTION:-Sonatype Nexus Repository}"
      - "homepage.siteMonitor=${SONATYPE_HOMEPAGE_SITEMONITOR:-http://sonatype:8081/sonatype}"
