networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-infisical-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  infisical_redis_data:
    name: ${INFISICAL_REDIS_DATA_VOLUME_NAME:-infisical_redis_data}
    external: ${INFISICAL_REDIS_DATA_VOLUME_EXTERNAL:-false}
    driver: ${INFISICAL_REDIS_DATA_VOLUME_DRIVER:-local}
    # Empty type/o/device = normal Docker named volume. Set for bind or NFS — see README.
    driver_opts:
      type: ${INFISICAL_REDIS_DATA_VOLUME_DRIVER_TYPE:-}
      o: ${INFISICAL_REDIS_DATA_VOLUME_DRIVER_O:-}
      device: ${INFISICAL_REDIS_DATA_VOLUME_DRIVER_DEVICE:-}

services:
  infisical-redis:
    image: ${INFISICAL_REDIS_IMAGE:-docker.io/library/redis:7-alpine}
    restart: ${INFISICAL_REDIS_RESTART:-unless-stopped}
    privileged: ${INFISICAL_REDIS_PRIVILEGED:-false}
    env_file:
      - ${INFISICAL_REDIS_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
    volumes:
      - ${INFISICAL_REDIS_DATA_HOST_PATH:-infisical_redis_data}:${INFISICAL_REDIS_DATA_CONTAINER_PATH:-/data}:z
    deploy:
      mode: ${INFISICAL_DEPLOY_MODE:-replicated}
      replicas: ${INFISICAL_REDIS_REPLICAS:-1}
      placement:
        constraints:
          - ${INFISICAL_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${INFISICAL_REDIS_MEMORY_LIMIT:-1G}
