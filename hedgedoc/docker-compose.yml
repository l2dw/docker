networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  hedgedoc_uploads:
    name: ${HEDGEDOC_UPLOADS_VOLUME_NAME:-hedgedoc_uploads}
    external: ${HEDGEDOC_UPLOADS_VOLUME_EXTERNAL:-false}

services:
  hedgedoc:
    image: ${HEDGEDOC_IMAGE:-quay.io/hedgedoc/hedgedoc:1.11.1}
    restart: ${HEDGEDOC_RESTART:-unless-stopped}
    privileged: ${HEDGEDOC_PRIVILEGED:-false}
    env_file:
      - ${HEDGEDOC_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - CMD_DB_URL=${HEDGEDOC_DB_URL:-postgres://hedgedoc:ChangeMe@dokploy-postgresql:5432/hedgedoc}
      - CMD_DOMAIN=${HEDGEDOC_DOMAIN:-hedgedoc.example.com}
      - CMD_URL_PATH=${HEDGEDOC_URL_PATH:-}
      - CMD_PROTOCOL_USESSL=${HEDGEDOC_PROTOCOL_USESSL:-false}
      - CMD_URL_ADDPORT=${HEDGEDOC_URL_ADDPORT:-false}
      - CMD_SESSION_SECRET=${HEDGEDOC_SESSION_SECRET:-ChangeMe}
    volumes:
      - ${HEDGEDOC_UPLOADS_DIR:-hedgedoc_uploads}:/hedgedoc/public/uploads
    deploy:
      mode: ${HEDGEDOC_DEPLOY_MODE:-replicated}
      replicas: ${HEDGEDOC_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${HEDGEDOC_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${HEDGEDOC_MEMORY_LIMIT:-512M}
      labels:
        - "traefik.enable=${HEDGEDOC_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.middlewares.stripprefix-hedgedoc.stripprefix.prefixes=${HEDGEDOC_BASE_PATH:-/}"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.entrypoints=${HEDGEDOC_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.rule=Host(`${HEDGEDOC_DOMAIN:-hedgedoc.example.com}`) && PathPrefix(`${HEDGEDOC_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.service=${APP_NAME:-hedgedoc}"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.middlewares=${HEDGEDOC_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.tls=${HEDGEDOC_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-hedgedoc}.tls.certresolver=${HEDGEDOC_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.${APP_NAME:-hedgedoc}.loadbalancer.server.port=3000"
        - "traefik.http.services.${APP_NAME:-hedgedoc}.loadbalancer.passhostheader=true"
        - "homepage.group=${HEDGEDOC_HOMEPAGE_GROUP:-Notes}"
        - "homepage.name=${HEDGEDOC_HOMEPAGE_NAME:-HedgeDoc}"
        - "homepage.icon=${HEDGEDOC_HOMEPAGE_ICON:-hedgedoc.png}"
        - "homepage.href=${HEDGEDOC_HOMEPAGE_HREF:-http://hedgedoc.example.com/}"
        - "homepage.description=${HEDGEDOC_HOMEPAGE_DESCRIPTION:-Collaborative markdown}"
        - "homepage.siteMonitor=${HEDGEDOC_HOMEPAGE_SITEMONITOR:-http://hedgedoc:3000}"
    labels:
      - "traefik.enable=${HEDGEDOC_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.middlewares.stripprefix-hedgedoc.stripprefix.prefixes=${HEDGEDOC_BASE_PATH:-/}"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.entrypoints=${HEDGEDOC_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.rule=Host(`${HEDGEDOC_DOMAIN:-hedgedoc.example.com}`) && PathPrefix(`${HEDGEDOC_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.service=${APP_NAME:-hedgedoc}"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.middlewares=${HEDGEDOC_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.tls=${HEDGEDOC_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-hedgedoc}.tls.certresolver=${HEDGEDOC_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME:-hedgedoc}.loadbalancer.server.port=3000"
      - "traefik.http.services.${APP_NAME:-hedgedoc}.loadbalancer.passhostheader=true"
      - "homepage.group=${HEDGEDOC_HOMEPAGE_GROUP:-Notes}"
      - "homepage.name=${HEDGEDOC_HOMEPAGE_NAME:-HedgeDoc}"
      - "homepage.icon=${HEDGEDOC_HOMEPAGE_ICON:-hedgedoc.png}"
      - "homepage.href=${HEDGEDOC_HOMEPAGE_HREF:-http://hedgedoc.example.com/}"
      - "homepage.description=${HEDGEDOC_HOMEPAGE_DESCRIPTION:-Collaborative markdown}"
      - "homepage.siteMonitor=${HEDGEDOC_HOMEPAGE_SITEMONITOR:-http://hedgedoc:3000}"
