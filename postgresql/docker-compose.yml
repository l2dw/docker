networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-postgresql-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}
volumes:
  data:
    name: ${POSTGRESQL_DATA_VOLUME_NAME:-postgresql_data}
  logs:
    name: ${POSTGRESQL_LOGS_VOLUME_NAME:-postgresql_logs}
  scripts:
    name: ${POSTGRESQL_SCRIPTS_VOLUME_NAME:-postgresql_scripts}
services:
  postgresql:
    image: ${POSTGRESQL_IMAGE:-docker.io/library/postgres:16}
    restart: ${POSTGRESQL_RESTART:-unless-stopped}
    privileged: ${POSTGRESQL_PRIVILEGED:-false}
    env_file:
      - ${POSTGRESQL_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD:-}
      - POSTGRES_USER=${POSTGRESQL_USER:-postgres}
      - POSTGRES_DB=${POSTGRESQL_DB:-postgres}
    volumes:
      - ${POSTGRESQL_DATA_HOST_PATH:-data}:${POSTGRESQL_DATA_CONTAINER_PATH:-/var/lib/postgresql/data}
      - ${POSTGRESQL_LOGS_HOST_PATH:-logs}:${POSTGRESQL_LOGS_CONTAINER_PATH:-/var/log/postgresql}
      - ${POSTGRESQL_SCRIPTS_HOST_PATH:-scripts}:${POSTGRESQL_SCRIPTS_CONTAINER_PATH:-/docker-entrypoint-initdb.d}
    networks:
      default:
        aliases:
          - ${APP_NAME:-postgresql}
          - ${POSTGRESQL_NETWORK_ALIAS:-postgresql-server}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    # mem_limit instead of deploy.* — Podman maps deploy.restart_policy.condition=any to an invalid restart policy
    mem_limit: ${POSTGRESQL_MEMORY_LIMIT:-512M}
    labels:
      - homepage.enabled=${POSTGRESQL_HOMEPAGE_ENABLED:-true}
      - homepage.group=${POSTGRESQL_HOMEPAGE_GROUP:-Database}
      - homepage.name=${APP_NAME:-postgresql}
      - homepage.icon=${POSTGRESQL_HOMEPAGE_ICON:-postgresql.png}
      - homepage.href=${POSTGRESQL_HOMEPAGE_URL:-}
      - homepage.description=${POSTGRESQL_HOMEPAGE_DESCRIPTION:-}
      - homepage.siteMonitor=${POSTGRESQL_HOMEPAGE_SITEMONITOR_URL:-}
      - homepage.ping=${POSTGRESQL_HOMEPAGE_PING:-}
