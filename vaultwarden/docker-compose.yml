networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-vaultwarden-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${VAULTWARDEN_DATA_VOLUME_NAME:-vaultwarden_data}
    external: ${VAULTWARDEN_DATA_VOLUME_EXTERNAL:-false}
    driver: ${VAULTWARDEN_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${VAULTWARDEN_DATA_VOLUME_TYPE:-}
      o: ${VAULTWARDEN_DATA_VOLUME_OPTS:-}
      device: ${VAULTWARDEN_DATA_VOLUME_PATH:-}

services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-docker.io/vaultwarden/server:1.37.3}
    restart: ${VAULTWARDEN_RESTART:-unless-stopped}
    privileged: ${VAULTWARDEN_PRIVILEGED:-false}
    env_file:
      - ${VAULTWARDEN_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - DOMAIN=${VAULTWARDEN_APP_URL:-http://vaultwarden.example.com/vaultwarden}
      - DATABASE_URL=${VAULTWARDEN_DATABASE_URL:-sqlite:///data/db.sqlite3}
      - SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=${VAULTWARDEN_INVITATIONS_ALLOWED:-true}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-}
      - SHOW_PASSWORD_HINT=${VAULTWARDEN_SHOW_PASSWORD_HINT:-false}
      - LOG_LEVEL=${VAULTWARDEN_LOG_LEVEL:-info}
      - IP_HEADER=${VAULTWARDEN_IP_HEADER:-X-Forwarded-For}
      - SMTP_HOST=${VAULTWARDEN_SMTP_HOST:-}
      - SMTP_FROM=${VAULTWARDEN_SMTP_FROM:-}
      - SMTP_PORT=${VAULTWARDEN_SMTP_PORT:-587}
      - SMTP_SECURITY=${VAULTWARDEN_SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${VAULTWARDEN_SMTP_USERNAME:-}
      - SMTP_PASSWORD=${VAULTWARDEN_SMTP_PASSWORD:-}
    volumes:
      - data:${VAULTWARDEN_DATA_VOLUME_DIR:-/data}:z
    deploy:
      mode: ${VAULTWARDEN_DEPLOY_MODE:-replicated}
      replicas: ${VAULTWARDEN_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${VAULTWARDEN_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          - ${VAULTWARDEN_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${VAULTWARDEN_RESTART_POLICY_CONDITION:-any}
        delay: ${VAULTWARDEN_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${VAULTWARDEN_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "traefik.enable=${VAULTWARDEN_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.services.${APP_NAME:-vaultwarden}.loadbalancer.server.port=${VAULTWARDEN_PORT:-80}"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.entrypoints=${VAULTWARDEN_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.rule=Host(`${VAULTWARDEN_DOMAIN:-vaultwarden.example.com}`) && PathPrefix(`${VAULTWARDEN_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.service=${APP_NAME:-vaultwarden}"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.middlewares=${VAULTWARDEN_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.tls=${VAULTWARDEN_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-vaultwarden}.tls.certresolver=${VAULTWARDEN_TLS_CERTRESOLVER:-letsencrypt}"
        - "homepage.group=${VAULTWARDEN_HOMEPAGE_GROUP:-Security}"
        - "homepage.name=${VAULTWARDEN_HOMEPAGE_NAME:-Vaultwarden}"
        - "homepage.icon=${VAULTWARDEN_HOMEPAGE_ICON:-vaultwarden.png}"
        - "homepage.href=${VAULTWARDEN_HOMEPAGE_URL:-}"
        - "homepage.description=${VAULTWARDEN_HOMEPAGE_DESCRIPTION:-Bitwarden-compatible password manager}"
        - "homepage.siteMonitor=${VAULTWARDEN_HOMEPAGE_SITEMONITOR:-http://vaultwarden:80/vaultwarden/alive}"
    labels:
      - "traefik.enable=${VAULTWARDEN_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.services.${APP_NAME:-vaultwarden}.loadbalancer.server.port=${VAULTWARDEN_PORT:-80}"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.entrypoints=${VAULTWARDEN_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.rule=Host(`${VAULTWARDEN_DOMAIN:-vaultwarden.example.com}`) && PathPrefix(`${VAULTWARDEN_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.service=${APP_NAME:-vaultwarden}"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.middlewares=${VAULTWARDEN_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.tls=${VAULTWARDEN_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-vaultwarden}.tls.certresolver=${VAULTWARDEN_TLS_CERTRESOLVER:-letsencrypt}"
      - "homepage.group=${VAULTWARDEN_HOMEPAGE_GROUP:-Security}"
      - "homepage.name=${VAULTWARDEN_HOMEPAGE_NAME:-Vaultwarden}"
      - "homepage.icon=${VAULTWARDEN_HOMEPAGE_ICON:-vaultwarden.png}"
      - "homepage.href=${VAULTWARDEN_HOMEPAGE_URL:-}"
      - "homepage.description=${VAULTWARDEN_HOMEPAGE_DESCRIPTION:-Bitwarden-compatible password manager}"
      - "homepage.siteMonitor=${VAULTWARDEN_HOMEPAGE_SITEMONITOR:-http://vaultwarden:80/vaultwarden/alive}"
