networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-dokploy-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-true}

volumes:
  nginx_html:
    name: ${NGINX_HTML_VOLUME_NAME:-nginx_html}
    external: ${NGINX_HTML_VOLUME_EXTERNAL:-false}

configs:
  nginx_default_conf:
    name: ${NGINX_DEFAULT_CONF_NAME:-nginx_default_conf}
    file: ./default.conf

services:
  nginx:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:alpine}
    restart: ${NGINX_RESTART:-unless-stopped}
    privileged: ${NGINX_PRIVILEGED:-false}
    env_file:
      - ${NGINX_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Toronto}
      - S3_BUCKET_NAME=${NGINX_S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${NGINX_S3_ACCESS_KEY_ID:-}
      - S3_SECRET_KEY=${NGINX_S3_SECRET_KEY:-ChangeMe}
      - S3_SERVER=${NGINX_S3_SERVER:-}
      - S3_SERVER_PORT=${NGINX_S3_SERVER_PORT:-443}
      - S3_SERVER_PROTO=${NGINX_S3_SERVER_PROTO:-https}
      - S3_REGION=${NGINX_S3_REGION:-us-east-1}
      - S3_STYLE=${NGINX_S3_STYLE:-path}
      - AWS_SIGS_VERSION=${NGINX_AWS_SIGS_VERSION:-4}
      - ALLOW_DIRECTORY_LIST=${NGINX_S3_ALLOW_DIRECTORY_LIST:-false}
      - PROVIDE_INDEX_PAGE=${NGINX_S3_PROVIDE_INDEX_PAGE:-true}
      - DNS_RESOLVERS=${NGINX_S3_DNS_RESOLVERS:-127.0.0.11}
    volumes:
      - ${NGINX_HTML_DIR:-nginx_html}:/usr/share/nginx/html:ro
    configs:
      - source: nginx_default_conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    deploy:
      mode: ${NGINX_DEPLOY_MODE:-replicated}
      replicas: ${NGINX_DEPLOY_REPLICAS:-1}
      placement:
        constraints:
          - ${NGINX_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-128M}
      labels:
        - "traefik.enable=${NGINX_TRAEFIK_LABELS_SWARM_ENABLE:-true}"
        - "traefik.http.routers.${APP_NAME:-nginx}.entrypoints=${NGINX_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-nginx}.rule=Host(`${NGINX_DOMAIN:-nginx.example.com}`) && PathPrefix(`${NGINX_BASE_PATH:-/}`)"
        - "traefik.http.routers.${APP_NAME:-nginx}.service=${APP_NAME:-nginx}"
        - "traefik.http.routers.${APP_NAME:-nginx}.middlewares=${NGINX_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-nginx}.tls=${NGINX_TLS_ENABLED:-false}"
        - "traefik.http.routers.${APP_NAME:-nginx}.tls.certresolver=${NGINX_TLS_CERTRESOLVER:-letsencrypt}"
        - "traefik.http.services.${APP_NAME:-nginx}.loadbalancer.server.port=80"
        - "traefik.http.services.${APP_NAME:-nginx}.loadbalancer.passhostheader=true"
        - "homepage.group=${NGINX_HOMEPAGE_GROUP:-Files}"
        - "homepage.name=${NGINX_HOMEPAGE_NAME:-nginx}"
        - "homepage.icon=${NGINX_HOMEPAGE_ICON:-nginx.png}"
        - "homepage.href=${NGINX_HOMEPAGE_HREF:-http://nginx.example.com/}"
        - "homepage.description=${NGINX_HOMEPAGE_DESCRIPTION:-Static HTTP}"
        - "homepage.siteMonitor=${NGINX_HOMEPAGE_SITEMONITOR:-http://nginx:80}"
    labels:
      - "traefik.enable=${NGINX_TRAEFIK_LABELS_DOCKER_ENABLE:-true}"
      - "traefik.http.routers.${APP_NAME:-nginx}.entrypoints=${NGINX_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-nginx}.rule=Host(`${NGINX_DOMAIN:-nginx.example.com}`) && PathPrefix(`${NGINX_BASE_PATH:-/}`)"
      - "traefik.http.routers.${APP_NAME:-nginx}.service=${APP_NAME:-nginx}"
      - "traefik.http.routers.${APP_NAME:-nginx}.middlewares=${NGINX_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-nginx}.tls=${NGINX_TLS_ENABLED:-false}"
      - "traefik.http.routers.${APP_NAME:-nginx}.tls.certresolver=${NGINX_TLS_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.${APP_NAME:-nginx}.loadbalancer.server.port=80"
      - "traefik.http.services.${APP_NAME:-nginx}.loadbalancer.passhostheader=true"
      - "homepage.group=${NGINX_HOMEPAGE_GROUP:-Files}"
      - "homepage.name=${NGINX_HOMEPAGE_NAME:-nginx}"
      - "homepage.icon=${NGINX_HOMEPAGE_ICON:-nginx.png}"
      - "homepage.href=${NGINX_HOMEPAGE_HREF:-http://nginx.example.com/}"
      - "homepage.description=${NGINX_HOMEPAGE_DESCRIPTION:-Static HTTP}"
      - "homepage.siteMonitor=${NGINX_HOMEPAGE_SITEMONITOR:-http://nginx:80}"
