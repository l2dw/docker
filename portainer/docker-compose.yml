
networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-portainer-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  portainer_data:
    name: ${PORTAINER_DATA_VOLUME_NAME:-portainer_data}
    external: ${PORTAINER_DATA_VOLUME_EXTERNAL:-false}
services:
  portainer:
    image: ${PORTAINER_IMAGE_REGISTRY:-docker.io}/${PORTAINER_IMAGE_PATH:-portainer/portainer-ce}:${PORTAINER_IMAGE_TAG:-latest}
    x-pull-policy: ${PORTAINER_PULL_POLICY:-always}
    restart: ${PORTAINER_RESTART:-unless-stopped}
    privileged: ${PORTAINER_PRIVILEGED:-false}
    command:
      - -H
      - unix:///var/run/docker.sock
      - --http-enabled
      - --base-url=${PORTAINER_BASE_PATH:-/portainer}
      - --trusted-origins=${PORTAINER_TRUSTED_ORIGINS:-example.com}
    environment:
      - "TZ=${TZ}"
      - "http_proxy=${HTTP_PROXY}"
      - "https_proxy=${HTTPS_PROXY}"
      - "no_proxy=${NO_PROXY}"
      - "HTTP_PROXY=${HTTP_PROXY}"
      - "HTTPS_PROXY=${HTTPS_PROXY}"
      - "NO_PROXY=${NO_PROXY}"
    volumes:
      - ${DOCKER_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${PORTAINER_DATA_VOLUME_DIR:-portainer_data}:/data:rw
    ## Deploy
    deploy:
      replicas: ${PORTAINER_DEPLOY_REPLICAS:-1}
      mode: ${PORTAINER_DEPLOY_MODE:-replicated}
      resources:
        limits:
          memory: ${PORTAINER_MEMORY_LIMIT:-512M}
      placement:
        constraints:
          # Empty / unset → any Linux node (Swarm scheduler picks). Override to pin.
          - ${PORTAINER_DEPLOY_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      labels:
        # Traefik configuration
        - "traefik.enable=${PORTAINER_TRAEFIK_ENABLE:-true}"
        # Middleware configuration
        - "traefik.http.middlewares.stripprefix-portainer.stripprefix.prefixes=${PORTAINER_BASE_PATH:-/portainer}"
        # Service configuration
        - "traefik.http.services.${APP_NAME:-portainer}.loadbalancer.server.port=${PORTAINER_PORT:-9000}"
        # Router configuration
        - "traefik.http.routers.${APP_NAME:-portainer}.entrypoints=${PORTAINER_TRAEFIK_ENTRYPOINTS:-web}"
        - "traefik.http.routers.${APP_NAME:-portainer}.rule=Host(`${PORTAINER_DOMAIN:-example.com}`) && PathPrefix(`${PORTAINER_BASE_PATH:-/portainer}`)"
        - "traefik.http.routers.${APP_NAME:-portainer}.service=${APP_NAME:-portainer}"
        - "traefik.http.routers.${APP_NAME:-portainer}.middlewares=${PORTAINER_TRAEFIK_MIDDLEWARES:-stripprefix-portainer}"
        # - "traefik.http.routers.${APP_NAME:-portainer}.middlewares=${PORTAINER_TRAEFIK_MIDDLEWARES:-}"
        - "traefik.http.routers.${APP_NAME:-portainer}.tls=${PORTAINER_TRAEFIK_TLS_ENABLE:-false}"
        - "traefik.http.routers.${APP_NAME:-portainer}.tls.certresolver=${PORTAINER_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
        ## Homepage configuration
        - "homepage.group=${PORTAINER_HOMEPAGE_GROUP:-}"
        - "homepage.name=${PORTAINER_HOMEPAGE_NAME:-Portainer}"
        - "homepage.icon=${PORTAINER_HOMEPAGE_ICON:-portainer.png}"
        - "homepage.href=${PORTAINER_HOMEPAGE_HREF:-http://example.com/portainer}"
        - "homepage.description=${PORTAINER_HOMEPAGE_DESCRIPTION:-}"
        - "homepage.siteMonitor=${PORTAINER_HOMEPAGE_SITEMONITOR:-http://example.com/portainer}"
        - "homepage.ping=${PORTAINER_HOMEPAGE_PING:-}"
    labels:
      # Traefik configuration
      - "traefik.enable=${PORTAINER_TRAEFIK_ENABLE:-true}"
      # Middleware configuration
      - "traefik.http.middlewares.stripprefix-portainer.stripprefix.prefixes=${PORTAINER_BASE_PATH:-/portainer}"
      # Service configuration
      - "traefik.http.services.${APP_NAME:-portainer}.loadbalancer.server.port=${PORTAINER_PORT:-9000}"
      # Router configuration
      - "traefik.http.routers.${APP_NAME:-portainer}.entrypoints=${PORTAINER_TRAEFIK_ENTRYPOINTS:-web}"
      - "traefik.http.routers.${APP_NAME:-portainer}.rule=Host(`${PORTAINER_DOMAIN:-example.com}`) && PathPrefix(`${PORTAINER_BASE_PATH:-/portainer}`)"
      - "traefik.http.routers.${APP_NAME:-portainer}.service=${APP_NAME:-portainer}"
      # - "traefik.http.routers.${APP_NAME:-portainer}.middlewares=${PORTAINER_TRAEFIK_MIDDLEWARES:-}"
      - "traefik.http.routers.${APP_NAME:-portainer}.middlewares=${PORTAINER_TRAEFIK_MIDDLEWARES:-stripprefix-portainer}"
      - "traefik.http.routers.${APP_NAME:-portainer}.tls=${PORTAINER_TRAEFIK_TLS_ENABLE:-false}"
      - "traefik.http.routers.${APP_NAME:-portainer}.tls.certresolver=${PORTAINER_TRAEFIK_TLS_CERTRESOLVER:-letsencrypt}"
      ## Homepage configuration
      - "homepage.group=${PORTAINER_HOMEPAGE_GROUP:-}"
      - "homepage.name=${PORTAINER_HOMEPAGE_NAME:-Portainer}"
      - "homepage.icon=${PORTAINER_HOMEPAGE_ICON:-portainer.png}"
      - "homepage.href=${PORTAINER_HOMEPAGE_HREF:-http://example.com/portainer}"
      - "homepage.description=${PORTAINER_HOMEPAGE_DESCRIPTION:-}"
      - "homepage.siteMonitor=${PORTAINER_HOMEPAGE_SITEMONITOR:-http://example.com/portainer}"
      - "homepage.ping=${PORTAINER_HOMEPAGE_PING:-}"
