networks:
  default:
    name: ${DEFAULT_NETWORK_NAME:-keycloak-network}
    external: ${DEFAULT_NETWORK_EXTERNAL:-false}

volumes:
  data:
    name: ${KEYCLOAK_DATA_VOLUME_NAME:-keycloak_data}
    external: ${KEYCLOAK_DATA_VOLUME_EXTERNAL:-false}
    driver: ${KEYCLOAK_DATA_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${KEYCLOAK_DATA_VOLUME_TYPE:-}
      o: ${KEYCLOAK_DATA_VOLUME_OPTS:-}
      device: ${KEYCLOAK_DATA_VOLUME_PATH:-}
  themes:
    name: ${KEYCLOAK_THEMES_VOLUME_NAME:-keycloak_themes}
    external: ${KEYCLOAK_THEMES_VOLUME_EXTERNAL:-false}
    driver: ${KEYCLOAK_THEMES_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${KEYCLOAK_THEMES_VOLUME_TYPE:-}
      o: ${KEYCLOAK_THEMES_VOLUME_OPTS:-}
      device: ${KEYCLOAK_THEMES_VOLUME_PATH:-}
  providers:
    name: ${KEYCLOAK_PROVIDERS_VOLUME_NAME:-keycloak_providers}
    external: ${KEYCLOAK_PROVIDERS_VOLUME_EXTERNAL:-false}
    driver: ${KEYCLOAK_PROVIDERS_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${KEYCLOAK_PROVIDERS_VOLUME_TYPE:-}
      o: ${KEYCLOAK_PROVIDERS_VOLUME_OPTS:-}
      device: ${KEYCLOAK_PROVIDERS_VOLUME_PATH:-}
  conf:
    name: ${KEYCLOAK_CONF_VOLUME_NAME:-keycloak_conf}
    external: ${KEYCLOAK_CONF_VOLUME_EXTERNAL:-false}
    driver: ${KEYCLOAK_CONF_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${KEYCLOAK_CONF_VOLUME_TYPE:-}
      o: ${KEYCLOAK_CONF_VOLUME_OPTS:-}
      device: ${KEYCLOAK_CONF_VOLUME_PATH:-}
  logs:
    name: ${KEYCLOAK_LOGS_VOLUME_NAME:-keycloak_logs}
    external: ${KEYCLOAK_LOGS_VOLUME_EXTERNAL:-false}
    driver: ${KEYCLOAK_LOGS_VOLUME_DRIVER:-local}
    driver_opts:
      type: ${KEYCLOAK_LOGS_VOLUME_TYPE:-}
      o: ${KEYCLOAK_LOGS_VOLUME_OPTS:-}
      device: ${KEYCLOAK_LOGS_VOLUME_PATH:-}

services:
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.3}
    command: start
    restart: ${KEYCLOAK_RESTART:-unless-stopped}
    privileged: ${KEYCLOAK_PRIVILEGED:-false}
    env_file:
      - ${KEYCLOAK_ENV_FILE:-.env.example}
    environment:
      - TZ=${TZ:-America/Montreal}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
      - KC_DB=${KEYCLOAK_DB:-postgres}
      - KC_DB_URL=${KEYCLOAK_DB_URL:-jdbc:postgresql://<DB_HOST>:5432/keycloak}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USERNAME:-keycloak}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-}
      - KC_HOSTNAME=${KEYCLOAK_APP_URL:-http://keycloak.example.com/auth}
      - KC_HTTP_RELATIVE_PATH=${KEYCLOAK_BASE_PATH:-/auth}
      - KC_HTTP_ENABLED=${KEYCLOAK_HTTP_ENABLED:-true}
      - KC_PROXY_HEADERS=${KEYCLOAK_PROXY_HEADERS:-xforwarded}
      - KC_HOSTNAME_STRICT=${KEYCLOAK_HOSTNAME_STRICT:-true}
      - KC_CACHE=${KEYCLOAK_CACHE:-local}
      - KC_HEALTH_ENABLED=${KEYCLOAK_HEALTH_ENABLED:-true}
      - KC_METRICS_ENABLED=${KEYCLOAK_METRICS_ENABLED:-false}
      - KC_LOG_LEVEL=${KEYCLOAK_LOG_LEVEL:-info}
      - KC_LOG=${KEYCLOAK_LOG:-file,console}
      - KC_LOG_FILE=${KEYCLOAK_LOG_FILE:-/opt/keycloak/logs/keycloak.log}
    volumes:
      - data:${KEYCLOAK_DATA_VOLUME_DIR:-/opt/keycloak/data}:z
      - themes:${KEYCLOAK_THEMES_VOLUME_DIR:-/opt/keycloak/themes}:z
      - providers:${KEYCLOAK_PROVIDERS_VOLUME_DIR:-/opt/keycloak/providers}:z
      - conf:${KEYCLOAK_CONF_VOLUME_DIR:-/opt/keycloak/conf}:z
      - logs:${KEYCLOAK_LOGS_VOLUME_DIR:-/opt/keycloak/logs}:z
    deploy:
      mode: ${KEYCLOAK_DEPLOY_MODE:-replicated}
      replicas: ${KEYCLOAK_DEPLOY_REPLICAS:-1}
      resources:
        limits:
          memory: ${KEYCLOAK_MEMORY_LIMIT:-1G}
      placement:
        constraints:
          - ${KEYCLOAK_PLACEMENT_CONSTRAINTS:-node.platform.os==linux}
      restart_policy:
        condition: ${KEYCLOAK_RESTART_POLICY_CONDITION:-any}
        delay: ${KEYCLOAK_RESTART_POLICY_DELAY:-5s}
        max_attempts: ${KEYCLOAK_RESTART_POLICY_MAX_ATTEMPTS:-3}
      labels:
        - "homepage.group=${KEYCLOAK_HOMEPAGE_GROUP:-Identity}"
        - "homepage.name=${KEYCLOAK_HOMEPAGE_NAME:-Keycloak}"
        - "homepage.icon=${KEYCLOAK_HOMEPAGE_ICON:-keycloak.png}"
        - "homepage.href=${KEYCLOAK_HOMEPAGE_URL:-}"
        - "homepage.description=${KEYCLOAK_HOMEPAGE_DESCRIPTION:-Open-source identity and access management}"
        - "homepage.siteMonitor=${KEYCLOAK_HOMEPAGE_SITEMONITOR:-http://keycloak:8080/auth}"
    labels:
      - "homepage.group=${KEYCLOAK_HOMEPAGE_GROUP:-Identity}"
      - "homepage.name=${KEYCLOAK_HOMEPAGE_NAME:-Keycloak}"
      - "homepage.icon=${KEYCLOAK_HOMEPAGE_ICON:-keycloak.png}"
      - "homepage.href=${KEYCLOAK_HOMEPAGE_URL:-}"
      - "homepage.description=${KEYCLOAK_HOMEPAGE_DESCRIPTION:-Open-source identity and access management}"
      - "homepage.siteMonitor=${KEYCLOAK_HOMEPAGE_SITEMONITOR:-http://keycloak:8080/auth}"
